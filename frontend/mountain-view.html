<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Vivify – Mountain (Vector Style)</title>

  <!-- Dev-only CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/pixi.js@8/dist/pixi.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    html,body{height:100%;background:#0b1220}
    body{margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
    .safe{padding-bottom:env(safe-area-inset-bottom)}
  </style>
</head>
<body>
  <div id="scene" class="w-screen h-screen"></div>
  <div id="hud"></div>

  <script type="text/babel">
/* =========================================================
   Vector / FlipMaster-esque Side-Scroller
   ========================================================= */

/* ---------- Utils ---------- */
const lerp = (a,b,t)=>a+(b-a)*t;
// Safe hex (don’t rely on PIXI.utils in v8)
const hex = (c) => {
  if (typeof c === 'number') return c;
  if (!c) return 0x000000;
  let s = String(c).trim();
  if (s[0] === '#') s = s.slice(1);
  if (s.length === 3) s = s.split('').map(ch => ch + ch).join('');
  return parseInt(s,16);
};

/* ---------- Env ---------- */
function envFromAltitude(alt){
  if (alt < 1000) return { name:'Forest Base',   top:'#5ea3e4', bot:'#90c8f8', ground:'#9b8e83', trail:'#7a6e64' };
  if (alt < 2000) return { name:'Mountain Trail', top:'#4b8ccb', bot:'#78b6e7', ground:'#90847a', trail:'#6f655c' };
  if (alt < 3000) return { name:'Alpine Zone',    top:'#3c79bb', bot:'#5b9ad4', ground:'#a7a7a1', trail:'#84847f' };
  return              { name:'Summit Ridge',      top:'#2d68ab', bot:'#4a86c1', ground:'#d8dde2', trail:'#b8bcc0' };
}

/* =========================================================
   HUD (unchanged UX; calls MountainAPI.runForward())
   ========================================================= */
const IconMountain=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>);
const Drop =(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3.1S6 9.1 6 12.6a6 6 0 0 0 12 0C18 9.1 12 3.1 12 3.1z"/></svg>);
const Moon =(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3a9 9 0 1 0 9 9 6 6 0 0 1-9-9Z"/></svg>);
const Steps=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="7" cy="14" r="3"/><circle cx="17" cy="10" r="3"/></svg>);
const Target=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>);

function Hud(){
  const {useState, useMemo, useLayoutEffect, useEffect} = React;
  const [vw, setVw] = useState(window.innerWidth);
  const [vh, setVh] = useState(window.innerHeight);
  useEffect(()=>{ const onR=()=>{setVw(window.innerWidth); setVh(window.innerHeight)}; window.addEventListener('resize',onR); return ()=>window.removeEventListener('resize',onR);},[]);
  const isPhone = (vw < 420) || (vh < 740);

  const [data, setData] = useState({ altitude:1200, target:3776, oxygen:78 });
  const [climbing, setClimbing] = useState(false);
  const [habits, setHabits] = useState([
    { id:'water',  name:'Water',  icon:Drop,   oxygen:15, done:false },
    { id:'sleep',  name:'Sleep',  icon:Moon,   oxygen:20, done:false },
    { id:'move',   name:'Move',   icon:Steps,  oxygen:15, done:false },
    { id:'focus',  name:'Focus',  icon:Target, oxygen:20, done:false },
  ]);

  const env = useMemo(()=>envFromAltitude(data.altitude), [data.altitude]);
  useLayoutEffect(()=>{
    window.MountainAPI?.setTheme(env.top, env.bot, env.ground, env.trail);
  }, [env]);

  const progress = Math.min(100, (data.altitude / data.target) * 100);
  const oxyColor = data.oxygen >= 70 ? '#10b981' : data.oxygen >= 50 ? '#f59e0b' : data.oxygen >= 30 ? '#f97316' : '#ef4444';

  function completeHabit(h){
    if (h.done || climbing) return;
    setClimbing(true);

    const forwardPx = 520;
    const dur = 1.0;

    window.MountainAPI?.runForward(forwardPx, dur);

    const altGain = 260;
    const tmp = { alt: data.altitude };
    gsap.to(tmp,{
      alt: Math.min(data.altitude + altGain, data.target),
      duration: dur, ease:'power2.out',
      onUpdate: ()=>setData(p=>({...p, altitude: tmp.alt})),
      onComplete: ()=>setClimbing(false)
    });

    setData(p=>({...p, oxygen: Math.min(p.oxygen + h.oxygen, 100)}));
    setHabits(p=>p.map(x=>x.id===h.id?{...x,done:true}:x));
  }

  return (
    <div className="pointer-events-none safe">
      {/* Top HUD */}
      <div className="absolute top-4 left-4 right-4 flex justify-between gap-3">
        <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
          <div className="flex items-center gap-2 mb-1">
            <IconMountain className="w-4 h-4 text-emerald-400"/>
            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
          </div>
          <div className="text-3xl font-bold text-white">
            {Math.round(data.altitude).toLocaleString()}<span className="text-base text-slate-400 ml-1">m</span>
          </div>
          <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all" style={{width:`${progress}%`}}/>
          </div>
          <div className="text-xs text-slate-400 mt-1">{Math.round(progress)}% to summit</div>
        </div>

        <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
          <div className="flex items-center gap-2 mb-1">
            <div className="w-3 h-3 rounded-full animate-pulse" style={{backgroundColor:oxyColor}}/>
            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
          </div>
          <div className="text-3xl font-bold" style={{color:oxyColor}}>
            {Math.round(data.oxygen)}<span className="text-base text-slate-400">%</span>
          </div>
          <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
            <div className="h-full transition-all" style={{width:`${data.oxygen}%`, backgroundColor:oxyColor, boxShadow:`0 0 10px ${oxyColor}80`}}/>
          </div>
          <div className="text-xs text-slate-400 mt-1">
            {data.oxygen>=70?'Strong':data.oxygen>=50?'Moderate':data.oxygen>=30?'Weak':'Critical'}
          </div>
        </div>
      </div>

      {/* Habit tray */}
      <div className="absolute left-4 right-4"
           style={{bottom: isPhone ? '16px' : '72px', transform: isPhone?'scale(0.92)':'scale(1)', transformOrigin:'center bottom'}}>
        <div className="pointer-events-auto bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
          <div className="grid grid-cols-4 gap-3">
            {habits.map((h,i)=>{
              const Icon = h.icon;
              const colors = [
                ['from-blue-500','to-cyan-500','shadow-blue-500/50'],
                ['from-indigo-500','to-purple-500','shadow-indigo-500/50'],
                ['from-green-500','to-emerald-500','shadow-green-500/50'],
                ['from-purple-500','to-pink-500','shadow-purple-500/50'],
              ][i];
              return (
                <button key={h.id} onClick={()=>completeHabit(h)} disabled={h.done||climbing}
                  className={`relative aspect-square rounded-2xl transition-all flex flex-col items-center justify-center gap-2
                    ${h.done
                      ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95'
                      : `bg-gradient-to-br ${colors[0]} ${colors[1]} hover:scale-105 active:scale-95 shadow-xl ${colors[2]}`
                    } ${climbing&&!h.done?'opacity-50 cursor-not-allowed':''}`}>
                  {!h.done && <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl"/>}
                  <Icon className={`w-7 h-7 ${h.done?'text-emerald-700':'text-white drop-shadow'}`}/>
                  <span className={`text-xs font-bold ${h.done?'text-emerald-700':'text-white'}`}>{h.done?'✓ Done':`+${h.oxygen}%`}</span>
                </button>
              );
            })}
          </div>
          <div className="text-center mt-4 pt-3 border-t border-slate-200">
            <div className="flex items-center justify-center gap-2">
              <div className="flex gap-1">
                {habits.map((h,i)=>(<div key={i} className={`w-2 h-2 rounded-full ${h.done?'bg-emerald-500 scale-125':'bg-slate-300'}`}/>))}
              </div>
              <span className="text-sm text-slate-600 font-medium ml-2">
                {habits.filter(x=>x.done).length} / 4 completed
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =========================================================
   PIXI Scene – Side scroller with approach segments
   ========================================================= */
// UI & slope constants
const UI_BOTTOM_PAD = 220;                 // reserved space for tray
const SLOPE_DEG = 8;                       // trail angle (rises to the right)
const SLOPE = -Math.tan(SLOPE_DEG * Math.PI / 180); // negative → world y increases as we go right

(async () => {
  const sceneEl = document.getElementById('scene');
  const app = new PIXI.Application();
  await app.init({ resizeTo: sceneEl, antialias:true, backgroundAlpha:1, powerPreference:'high-performance', autoDensity:true });
  sceneEl.appendChild(app.canvas);
  app.stage.sortableChildren = true;

  /* Layers */
  const skyLayer   = new PIXI.Container();   // sky + sun + clouds + haze
  const world      = new PIXI.Container();   // moves along slope
  const ground     = new PIXI.Container();   // ground & trail, part of world
  const segments   = new PIXI.Container();   // approaching trail segments
  const actorLayer = new PIXI.Container();   // player stays anchored
  const fxLayer    = new PIXI.Container();   // dust, vfx
  world.addChild(ground, segments);
  app.stage.addChild(skyLayer, world, actorLayer, fxLayer);

  /* Theme */
  let currentTop = '#4b8ccb', currentBot='#78b6e7', groundCol='#90847a', trailCol='#6f655c';

  function gradientSprite(w,h,top,bottom){
    const c = new PIXI.Container();
    const r1 = new PIXI.Graphics(); r1.beginFill(hex(top)).drawRect(0,0,w,h).endFill();
    const r2 = new PIXI.Graphics(); r2.beginFill(hex(bottom)).drawRect(0,h*0.45,w,h*0.55).endFill();
    r2.alpha = 1.0;
    c.addChild(r1,r2);
    const tex = app.renderer.generateTexture(c,{resolution:Math.max(1, devicePixelRatio), region:new PIXI.Rectangle(0,0,w,h)});
    return new PIXI.Sprite(tex);
  }

  /* Sky build */
  let skySprite, sun, clouds, haze;
  function rebuildSky(){
    const w = app.renderer.width, h = app.renderer.height;
    skyLayer.removeChildren();

    // fill whole screen
    skySprite = gradientSprite(w, h, currentTop, currentBot);
    skyLayer.addChild(skySprite);

    // sun
    sun = new PIXI.Graphics();
    sun.beginFill(0xfff1b8, 0.9).drawCircle(0,0,60).endFill();
    sun.x = w*0.82; sun.y = h*0.18;
    sun.filters = [new PIXI.BlurFilter({strength:2})];
    skyLayer.addChild(sun);

    // clouds
    clouds = new PIXI.Container(); skyLayer.addChild(clouds);
    const cloudTex = (()=>{ const c=new PIXI.Container();
      const p=(x,y,r,a=1)=>{ const g=new PIXI.Graphics(); g.beginFill(0xffffff,a).drawCircle(x,y,r).endFill(); c.addChild(g); };
      p(0,0,24,0.85); p(22,-6,18,0.8); p(-20,-4,16,0.8); p(40,4,14,0.75); p(-36,4,12,0.75);
      return app.renderer.generateTexture(c,{resolution:2});
    })();
    function spawnCloud(y,scale,speed){
      const w = app.renderer.width;
      const s=new PIXI.Sprite(cloudTex); s.anchor.set(0.5); s.x=-120; s.y=y; s.scale.set(scale); s.alpha=0.35; clouds.addChild(s);
      gsap.to(s,{x:w+120,duration:(w+240)/speed,ease:"none",onComplete(){ clouds.removeChild(s); s.destroy(); spawnCloud(y,scale,speed); }});
    }
    spawnCloud(h*0.20,1.1,22);
    spawnCloud(h*0.30,0.95,28);

    // horizon haze (masked to sky only)
    haze = new PIXI.Graphics();
    haze.beginFill(0xffffff,0.10).drawRect(0,h*0.42,w,h*0.18).endFill();
    haze.filters = [new PIXI.BlurFilter({strength:6})];
    const mask = new PIXI.Graphics(); mask.beginFill(0xffffff).drawRect(0,0,w,h*0.60).endFill();
    haze.mask = mask;
    skyLayer.addChild(haze, mask);
  }

  /* Trail geometry helpers (slanted ribbon across screen) */
  function trackY(x){ // top edge baseline
    const w = app.renderer.width, h = app.renderer.height;
    const y0 = h*0.72, y1 = h*0.66; // slight incline up-right
    return lerp(y0,y1, Math.min(1, Math.max(0, x/w)));
  }
  function edgePoints(){
    const w = app.renderer.width;
    return { x1: -200, y1: trackY(-200), x2: w+200, y2: trackY(w+200) };
  }

  /* Ground + trail ribbon */
  let trailBand, bandWidth = 150, trailOffset = 140;
  function rebuildGround(){
    ground.removeChildren();
    const w = app.renderer.width, h = app.renderer.height;
    const g = new PIXI.Graphics();

    // Base ground (below trail)
    g.beginFill(hex(groundCol)).drawRect(-200, h*0.62, w+400, h).endFill();

    // Trail ribbon
    const {x1,y1,x2,y2} = edgePoints();
    const bandW = Math.max(130, Math.min(170, h*0.12));
    bandWidth = bandW;
    trailBand = new PIXI.Graphics();
    const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=-uy, ny=ux;

    const off = Math.max(100, h*0.14);
    trailOffset = off;
    const trim = 200;

    const ax = x1 + ux*trim + nx*off;
    const ay = y1 + uy*trim + ny*off;
    const bx = x2 - ux*trim + nx*off;
    const by = y2 - uy*trim + ny*off;

    const half = bandW/2;
    const L1x = ax - nx*half, L1y = ay - ny*half;
    const L2x = bx - nx*half, L2y = by - ny*half;
    const R1x = ax + nx*half, R1y = ay + ny*half;
    const R2x = bx + nx*half, R2y = by + ny*half;

    trailBand.beginFill(hex(trailCol), 0.96)
      .moveTo(L1x,L1y).lineTo(L2x,L2y).lineTo(R2x,R2y).lineTo(R1x,R1y).closePath().endFill();

    trailBand.lineStyle(3, 0x000000, 0.10)
      .moveTo(L1x,L1y).lineTo(L2x,L2y)
      .moveTo(R1x,R1y).lineTo(R2x,R2y);

    ground.addChild(g, trailBand);
  }

  /* Approach segments (repeating trapezoids riding along trail) */
  const SEG_LEN = 280;
  const SEG_COUNT = 28;
  function buildSegments(){
    segments.removeChildren();
    const h = app.renderer.height;
    const bandW = Math.max(130, Math.min(170, h*0.12));
    for(let i=0;i<SEG_COUNT;i++){
      const xA = i*SEG_LEN, xB = xA + SEG_LEN - 8;
      const yA = trackY(xA),  yB = trackY(xB);
      const L1 = [xA, yA + trailOffset - bandW/2], L2 = [xB, yB + trailOffset - bandW/2];
      const R1 = [xA, yA + trailOffset + bandW/2], R2 = [xB, yB + trailOffset + bandW/2];

      const s = new PIXI.Graphics();
      s.beginFill(0x000000, 0.10).drawPolygon([
        L1[0],L1[1], L2[0],L2[1], R2[0],R2[1], R1[0],R1[1]
      ]).endFill();
      s.lineStyle(2, 0x000000, 0.12).moveTo(L1[0],L1[1]).lineTo(L2[0],L2[1]);
      s.filters = [new PIXI.BlurFilter({strength:0.6})];

      s.x += 140; // push initial field to the right of avatar
      segments.addChild(s);
    }
  }

  /* Actor (silhouette with beanie) */
  const actor = new PIXI.Container(); actorLayer.addChild(actor);
  const body  = new PIXI.Container(); actor.addChild(body);
  const shadow = new PIXI.Graphics(); actor.addChildAt(shadow,0);

  function buildActor(){
    shadow.clear().beginFill(0x000000,0.25).drawEllipse(0,18,26,6).endFill();

    body.removeChildren();
    const sil = new PIXI.Graphics();
    sil.beginFill(0x0b0f16).drawRoundedRect(-12,-24,24,34,8).endFill(); // torso
    sil.beginFill(0x0b0f16).drawRoundedRect(-15,-6,10,24,5).endFill();  // left leg
    sil.beginFill(0x0b0f16).drawRoundedRect( 5,-6,10,24,5).endFill();   // right leg
    sil.beginFill(0x0b0f16).drawEllipse(-18,-12,6,10).endFill();        // left arm
    sil.beginFill(0x0b0f16).drawEllipse( 18,-12,6,10).endFill();        // right arm
    sil.beginFill(0x0b0f16).drawEllipse(0,-32,10,8).endFill();          // head
    body.addChild(sil);

    const beanie = new PIXI.Graphics();
    beanie.beginFill(0xe24d4d).drawEllipse(0,-36,11,7).endFill();
    beanie.beginFill(0xf06a6a).drawRoundedRect(-11,-34,22,4,2).endFill();
    beanie.beginFill(0xf06a6a).drawCircle(0,-41,3).endFill();
    body.addChild(beanie);

    const b = body.getLocalBounds();
    body.pivot.set(b.x + b.width/2, b.y + b.height/2);
    body.position.set(0, -6);
  }

  function placeActorOnTrail(){
    const w = app.renderer.width;
    const h = app.renderer.height;
    actor.x = Math.floor(w * 0.28);
    actor.y = Math.floor(h - UI_BOTTOM_PAD - 70); // sits safely above the tray
  }

  /* Resize / layout */
  function layout(){
    rebuildSky();
    rebuildGround();
    buildSegments();
    buildActor();
    placeActorOnTrail();
    world.x = 0;
    world.y = 0;
  }
  window.addEventListener('resize', layout);

  /* Scroll the world ALONG the slope (x & y) */
  function scrollAlongSlope(distance, duration = 1.0){
    const startX = world.x;
    const startY = world.y;
    const endX   = startX - distance;          // move left
    const endY   = startY + (SLOPE * distance); // and up (since SLOPE is negative)
    gsap.to(world, { x:endX, y:endY, duration, ease:'power2.out' });
  }

  /* Run forward: world scroll + jump arc + 360 flip */
  let isRunning = false;
  function runForward(distance=520, duration=1.0){
    if (isRunning) return;
    isRunning = true;

    const tl = gsap.timeline({onComplete(){ isRunning=false; pruneAndExtend(); }});

    // world pans along the incline
    tl.call(()=>scrollAlongSlope(distance, duration), null, 0);

    // jump arc + flip
    tl.to(actor, { y: actor.y - 120, duration: duration*0.45, ease:'power2.out' }, 0);
    tl.to(actor, { y: actor.y,        duration: duration*0.55, ease:'bounce.out' }, duration*0.45);
    tl.to(body,  { rotation: Math.PI*2, duration, ease:'power2.inOut' }, 0);

    // shadow squash
    tl.to(shadow.scale, { x:0.75, y:0.6, duration:duration*0.45, ease:'power2.out' }, 0);
    tl.to(shadow.scale, { x:1.0,  y:1.0, duration:duration*0.55, ease:'power2.out' }, duration*0.45);

    // dust puff on landing
    tl.call(()=>spawnDust(actor.x+8, actor.y+10), null, duration*0.96);
  }

  /* Keep segments ahead as we run */
  function pruneAndExtend(){
    const children = segments.children;
    // when a segment’s right bound is well off the left of the screen, push it forward
    for (let i=0;i<children.length;i++){
      const s = children[i];
      const bounds = s.getBounds();
      const rightScreenX = bounds.x + bounds.width + world.x;
      if (rightScreenX < -240){
        const maxX = Math.max(...children.map(c => c.x));
        s.x = maxX + SEG_LEN;
      }
    }
  }

/* Dust effect */
function spawnDust(x, y){
  const puff = new PIXI.Graphics();
  puff.beginFill(0xffffff, 0.15).drawCircle(0, 0, 18).endFill();
  puff.filters = [new PIXI.BlurFilter({ strength: 1.2 })]; // ← no extra brace
  puff.x = x;
  puff.y = y;
  fxLayer.addChild(puff);

  gsap.to(puff, {
    x: x + 30,
    y: y - 10,
    alpha: 0,
    duration: 0.6,
    ease: 'power1.out',
    onComplete() {
      fxLayer.removeChild(puff);
      puff.destroy();
    }
  });
}

  /* Public API for HUD */
  window.MountainAPI = {
    runForward,
    setTheme(top,bot,groundColor,trailColor){
      currentTop = top; currentBot = bot; groundCol = groundColor; trailCol = trailColor;
      layout();
    }
  };

  // boot
  layout();
  ReactDOM.createRoot(document.getElementById('hud')).render(React.createElement(Hud));
})();
  </script>
</body>
</html>
