<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivify - Mountain View</title>
    
    <!-- Load React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
    
        // Icons
        const Mountain = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
            </svg>
        );
    
        const Droplets = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
                <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
            </svg>
        );
    
        const Moon = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );
    
        const Footprints = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
                <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
            </svg>
        );
    
        const Target = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );
    
        const MountainView = () => {
            const [userData, setUserData] = useState({
                altitude: 1200,
                targetAltitude: 3776,
                oxygen: 78,
                mountainName: 'Mt. Fuji'
            });
    
            const [habits, setHabits] = useState([
                { id: 'hydration', name: 'Water', icon: Droplets, completed: false, oxygen: 15 },
                { id: 'sleep', name: 'Sleep', icon: Moon, completed: false, oxygen: 20 },
                { id: 'movement', name: 'Move', icon: Footprints, completed: false, oxygen: 15 },
                { id: 'focus', name: 'Focus', icon: Target, completed: false, oxygen: 20 }
            ]);
    
            const [mountainScroll, setMountainScroll] = useState(0);
            const [isClimbing, setIsClimbing] = useState(false);
            const [stepPhase, setStepPhase] = useState(0);
    
            const progressPercent = (userData.altitude / userData.targetAltitude) * 100;
    
            const getEnvironment = (alt) => {
                if (alt < 1000) return {
                    name: 'Forest Base',
                    skyTop: '#4A90C8',
                    skyBot: '#7BB8E8',
                    slopeColor: '#6b5d4f',
                    slopeDark: '#4a3d2f',
                    hasForest: true
                };
                if (alt < 2000) return {
                    name: 'Mountain Trail',
                    skyTop: '#3A7FB8',
                    skyBot: '#5BA3D8',
                    slopeColor: '#7a7268',
                    slopeDark: '#5a5248',
                    hasForest: true
                };
                if (alt < 3000) return {
                    name: 'Alpine Zone',
                    skyTop: '#2E6FA8',
                    skyBot: '#4A8AC8',
                    slopeColor: '#8a8a82',
                    slopeDark: '#6a6a62',
                    hasForest: false
                };
                return {
                    name: 'Summit Ridge',
                    skyTop: '#1E5F98',
                    skyBot: '#2E6FA8',
                    slopeColor: '#dce8f0',
                    slopeDark: '#bcd0e0',
                    hasForest: false
                };
            };
    
            const env = getEnvironment(userData.altitude);
    
            const completeHabit = (habitId) => {
                const habit = habits.find(h => h.id === habitId);
                if (habit.completed || isClimbing) return;
    
                setIsClimbing(true);
                
                let frame = 0;
                const totalFrames = 30;
                
                const walkInterval = setInterval(() => {
                    frame++;
                    setMountainScroll(prev => prev + 2.8);
                    
                    if (frame % 8 === 0) {
                        setStepPhase(prev => prev === 1 ? 2 : 1);
                    }
                    
                    if (frame >= totalFrames) {
                        clearInterval(walkInterval);
                        setStepPhase(0);
                        
                        setUserData(prev => ({
                            ...prev,
                            altitude: Math.min(prev.altitude + 270, prev.targetAltitude),
                            oxygen: Math.min(prev.oxygen + habit.oxygen, 100)
                        }));
    
                        setHabits(prev => prev.map(h => 
                            h.id === habitId ? { ...h, completed: true } : h
                        ));
                        
                        setIsClimbing(false);
                    }
                }, 35);
            };
    
            const getOxygenColor = (oxygen) => {
                if (oxygen >= 70) return '#10b981';
                if (oxygen >= 50) return '#f59e0b';
                if (oxygen >= 30) return '#f97316';
                return '#ef4444';
            };
    
            const generateTerrain = () => {
                const elements = [];
                for (let i = 0; i < 40; i++) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const y = 250 + i * 100;
                    const x = side * (140 + Math.random() * 220);
                    
                    elements.push({
                        id: i,
                        x: x,
                        y: y,
                        type: env.hasForest && Math.random() > 0.25 ? 'tree' : 'rock',
                        size: 1.1 + Math.random() * 0.9,
                        variant: Math.floor(Math.random() * 3)
                    });
                }
                return elements;
            };
    
            const [terrain] = useState(generateTerrain());
    
            return (
                <div className="relative w-full h-screen overflow-hidden" style={{
                    background: `linear-gradient(to bottom, ${env.skyTop} 0%, ${env.skyBot} 100%)`
                }}>
                    
                    {/* Sun with realistic glow */}
                    <div className="absolute w-48 h-48 rounded-full" style={{
                        top: '8%',
                        right: '12%',
                        background: 'radial-gradient(circle, #fffef5 0%, #fff9e0 15%, #ffeb3b 40%, #ffa726 80%, transparent 100%)',
                        boxShadow: '0 0 120px rgba(255, 235, 59, 0.4), 0 0 60px rgba(255, 235, 59, 0.6)',
                        opacity: 0.95
                    }} />
    
                    {/* Mountain slope */}
                    <div 
                        className="absolute inset-0"
                        style={{
                            transform: `translateY(${mountainScroll}px)`,
                            transition: 'none'
                        }}
                    >
                        <svg width="100%" height="200%" className="absolute" style={{ top: '-50%' }} preserveAspectRatio="none">
                            <defs>
                                <pattern id="terrain" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
                                    <rect width="120" height="120" fill={env.slopeColor} />
                                    <circle cx="25" cy="25" r="10" fill={env.slopeDark} opacity="0.2" />
                                    <circle cx="70" cy="40" r="12" fill={env.slopeDark} opacity="0.18" />
                                    <circle cx="45" cy="75" r="9" fill={env.slopeDark} opacity="0.25" />
                                    <circle cx="90" cy="85" r="11" fill={env.slopeDark} opacity="0.19" />
                                    <ellipse cx="35" cy="55" rx="12" ry="6" fill={env.slopeDark} opacity="0.15" />
                                    <path d="M10,10 Q15,12 20,10 T30,10" stroke={env.slopeDark} strokeWidth="2" fill="none" opacity="0.12" />
                                    <path d="M60,60 Q65,58 70,60 T80,60" stroke={env.slopeDark} strokeWidth="1.5" fill="none" opacity="0.1" />
                                </pattern>
                                
                                <filter id="terrainNoise">
                                    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" />
                                    <feColorMatrix type="saturate" values="0" />
                                    <feBlend mode="overlay" in="SourceGraphic" />
                                </filter>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#terrain)" filter="url(#terrainNoise)" />
                            
                            {[...Array(18)].map((_, i) => (
                                <line 
                                    key={i}
                                    x1="0" 
                                    y1={i * 160} 
                                    x2="100%" 
                                    y2={i * 160}
                                    stroke={env.slopeDark}
                                    strokeWidth="1.5"
                                    opacity="0.15"
                                    strokeDasharray="25,12"
                                />
                            ))}

                                        <ellipse cx="47" cy="56" rx="31" ry="22" fill="#195520" />
                                        <ellipse cx="47" cy="50" rx="28" ry="20" fill="#1e6025" />
                                        <ellipse cx="47" cy="45" rx="25" ry="18" fill="#246b2a" />
                                        <ellipse cx="47" cy="40" rx="22" ry="16" fill="#2a7630" />
                                        <ellipse cx="47" cy="35" rx="19" ry="14" fill="#308135" />
                                        <ellipse cx="47" cy="31" rx="16" ry="12" fill="#368c3a" />
                                        
                                        <ellipse cx="40" cy="60" rx="13" ry="11" fill="#4daa4d" opacity="0.5" />
                                        <ellipse cx="56" cy="67" rx="14" ry="12" fill="#4daa4d" opacity="0.45" />
                                    </svg>,
                                    
                                    // Variant 3: Tall slender tree
                                    <svg width={85} height={125} viewBox="0 0 85 125">
                                        <rect x="37" y="92" width="13" height="33" fill="#2d1810" />
                                        <rect x="38" y="93" width="11" height="31" fill="#3e2415" />
                                        <rect x="39" y="94" width="9" height="29" fill="#4a2f1a" />
                                        
                                        <ellipse cx="43" cy="82" rx="36" ry="34" fill="#0a2d0a" />

                                        <ellipse cx="50" cy="62" rx="12" ry="10" fill="#4daa4d" opacity="0.45" />
                                    </svg>
                                ];
                                
                                element = treeVariants[obj.variant];
                            } else {
                                const rockVariants = [
                                    // Variant 1: Angular rock
                                    <svg width={60} height={42} viewBox="0 0 60 42">
                                        <ellipse cx="30" cy="40" rx="26" ry="7" fill="#000000" opacity="0.25" />
                                        <path d="M30,4 L50,30 L48,37 L12,37 L10,30 Z" fill="#2a2a2a" />
                                        <path d="M30,4 L42,26 L40,34 L20,34 L18,26 Z" fill="#3d3d3d" />

                                        <line x1="20" y1="33" x2="24" y2="22" stroke="#1a1a1a" strokeWidth="1.2" opacity="0.6" />
                                        <line x1="40" y1="34" x2="36" y2="23" stroke="#1a1a1a" strokeWidth="1.2" opacity="0.6" />
                                        <line x1="30" y1="7" x2="30" y2="29" stroke="#1a1a1a" strokeWidth="1" opacity="0.5" />
                                        
                                        <ellipse cx="23" cy="28" rx="5" ry="4" fill="#3a5a3a" opacity="0.4" />
                                        <ellipse cx="38" cy="30" rx="4" ry="3" fill="#3a5a3a" opacity="0.35" />
                                    </svg>,
                                    
                                    // Variant 2: Round boulder
                                    <svg width={65} height={45} viewBox="0 0 65 45">
                                        <ellipse cx="32" cy="42" rx="28" ry="8" fill="#000000" opacity="0.25" />
                                        <ellipse cx="32" cy="26" rx="30" ry="24" fill="#2a2a2a" />
                                        <ellipse cx="32" cy="24" rx="28" ry="22" fill="#3d3d3d" />

                                        <path d="M40,30 Q42,28 44,30" stroke="#1a1a1a" strokeWidth="1" fill="none" opacity="0.5" />
                                        
                                        <ellipse cx="25" cy="32" rx="6" ry="5" fill="#3a5a3a" opacity="0.4" />
                                        <ellipse cx="40" cy="34" rx="5" ry="4" fill="#3a5a3a" opacity="0.35" />
                                    </svg>,
                                    
                                    // Variant 3: Flat layered rock
                                    <svg width={70} height={38} viewBox="0 0 70 38">
                                        <ellipse cx="35" cy="36" rx="30" ry="6" fill="#000000" opacity="0.25" />
                                        <path d="M10,30 L15,20 L55,20 L60,30 Z" fill="#2a2a2a" />
                                        <path d="M12,28 L17,22 L53,22 L58,28 Z" fill="#3d3d3d" />
                                        <path d="M15,16 L20,10 L50,10 L55,16 Z" fill="#4a4a4a" />

                                        <path d="M20,8 L25,5 L45,5 L50,8 Z" fill="#7a7a7a" />
                                        
                                        <line x1="12" y1="28" x2="58" y2="28" stroke="#1a1a1a" strokeWidth="1.5" opacity="0.5" />

                            }
    
                            return (
                                <div
                                    key={obj.id}
                                    className="absolute"
                                    style={{
                                        left: `calc(50% + ${obj.x}px)`,
                                        top: `${obj.y}px`,
                                        transform: `scale(${scale * obj.size})`,
                                        opacity: scale > 0.65 ? 1 : scale * 1.4,
                                        filter: scale < 0.7 ? 'blur(1px)' : 'none'
                                    }}
                                >

                    </div>
    
                    {/* REFINED CHARACTER - Grand Mountain Adventure style */}
                    <div className="absolute left-1/2 -translate-x-1/2 z-40" style={{ top: '46%' }}>

                            <path d="M80,74 L84,80 L84,106 L78,112 L78,130 L80,142 L74,146 L60,144 L60,74 Z" fill="#1e5c8a" />
                            <rect x="42" y="74" width="36" height="70" fill="#2d72b8" />
                            
                            <line x1="60" y1="78" x2="60" y2="140" stroke="#1a5c8a" strokeWidth="2.5" />
                            <line x1="50" y1="80" x2="50" y2="136" stroke="#1a5c8a" strokeWidth="1.5" opacity="0.6" />
                            <line x1="70" y1="80" x2="70" y2="136" stroke="#1a5c8a" strokeWidth="1.5" opacity="0.6" />
                            
                            <rect x="50" y="84" width="10" height="48" fill="#3d82c8" opacity="0.35" />
                            <rect x="62" y="84" width="10" height="48" fill="#3d82c8" opacity="0.35" />
                            
                            <rect x="48" y="90" width="12" height="16" rx="2" fill="#1a5c8a" />
                            <rect x="64" y="90" width="12" height="16" rx="2" fill="#1a5c8a" />
                            
                            {/* LEFT ARM with pole */}
                            <g transform={`rotate(${stepPhase === 1 ? -16 : stepPhase === 2 ? -6 : -10} 42 86)`}>
                                <ellipse cx="42" cy="95" rx="7" ry="23" fill="#1a5c8a" />
                                <ellipse cx="41" cy="115" rx="6.5" ry="19" fill="#2d72b8" />
                                <ellipse cx="40" cy="132" rx="6" ry="10" fill="#d4a574" />
                                <ellipse cx="40" cy="136" rx="7" ry="7" fill="#202020" />
                                <ellipse cx="40" cy="136" rx="6" ry="6" fill="#303030" />
                            </g>
                            
                            {stepPhase === 1 && (
                                <>
                                    <line x1="41" y1="136" x2="36" y2="158" stroke="#404040" strokeWidth="3.5" />
                                    <line x1="41" y1="136" x2="36" y2="158" stroke="#606060" strokeWidth="3" />
                                    <circle cx="36" cy="158" r="4" fill="#303030" />
                                    <circle cx="41" cy="138" r="3.5" fill="#707070" />
                                </>
                            )}
                            
                            {/* RIGHT ARM with pole */}
                            <g transform={`rotate(${stepPhase === 2 ? 16 : stepPhase === 1 ? 6 : 10} 78 86)`}>
                                <ellipse cx="78" cy="95" rx="7" ry="23" fill="#1a5c8a" />
                                <ellipse cx="79" cy="115" rx="6.5" ry="19" fill="#2d72b8" />
                                <ellipse cx="80" cy="132" rx="6" ry="10" fill="#d4a574" />
                                <ellipse cx="80" cy="136" rx="7" ry="7" fill="#202020" />
                                <ellipse cx="80" cy="136" rx="6" ry="6" fill="#303030" />
                            </g>
                            
                            {stepPhase === 2 && (
                                <>
                                    <line x1="79" y1="136" x2="84" y2="158" stroke="#404040" strokeWidth="3.5" />
                                    <line x1="79" y1="136" x2="84" y2="158" stroke="#606060" strokeWidth="3" />
                                    <circle cx="84" cy="158" r="4" fill="#303030" />
                                    <circle cx="79" cy="138" r="3.5" fill="#707070" />
                                </>
                            )}
                            
                            {/* PANTS - better proportions */}
                            <g transform={`translate(${stepPhase === 1 ? -2 : 0} ${stepPhase === 1 ? 4 : 0})`}>
                                <rect x="50" y="144" width="12" height="18" rx="2" fill="#2a3a48" />
                                <rect x="51" y="145" width="10" height="16" rx="1.5" fill="#3a4a58" />
                                <rect x="52" y="146" width="8" height="14" rx="1" fill="#4a5a68" />
                            </g>
                            
                            <g transform={`translate(${stepPhase === 2 ? 2 : 0} ${stepPhase === 2 ? 4 : 0})`}>
                                <rect x="60" y="144" width="12" height="18" rx="2" fill="#2a3a48" />
                                <rect x="61" y="145" width="10" height="16" rx="1.5" fill="#3a4a58" />
                                <rect x="62" y="146" width="8" height="14" rx="1" fill="#4a5a68" />
                            </g>
                            
                            {/* BOOTS - refined */}
                            <ellipse cx="56" cy="162" rx="9" ry="4.5" fill="#1a1a1a" />
                            <ellipse cx="56" cy="161" rx="8" ry="4" fill="#252525" />
                            <ellipse cx="56" cy="160" rx="7" ry="3.5" fill="#303030" />
                            <line x1="51" y1="161" x2="61" y2="161" stroke="#0a0a0a" strokeWidth="1" />
                            <line x1="53" y1="159" x2="59" y2="159" stroke="#404040" strokeWidth="0.7" opacity="0.5" />
                            
                            <ellipse cx="64" cy="162" rx="9" ry="4.5" fill="#1a1a1a" />
                            <ellipse cx="64" cy="161" rx="8" ry="4" fill="#252525" />
                            <ellipse cx="64" cy="160" rx="7" ry="3.5" fill="#303030" />
                            <line x1="59" y1="161" x2="69" y2="161" stroke="#0a0a0a" strokeWidth="1" />
                            <line x1="61" y1="159" x2="67" y2="159" stroke="#404040" strokeWidth="0.7" opacity="0.5" />
                        </svg>
                        
                        <div 
                            className="absolute left-1/2 -translate-x-1/2 rounded-full blur-xl"
                            style={{ 
                                top: '155px',
                                width: '80px',
                                height: '20px',
                                background: 'radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.3) 50%, transparent 100%)'
                            }}
                        />
                    </div>
    
                    {/* HUD */}
                    <div className="absolute top-4 left-4 right-4 z-50 flex justify-between items-start gap-3">
                        <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                            <div className="flex items-center gap-2 mb-1">
                                <Mountain className="w-4 h-4 text-emerald-400" />
                                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
                            </div>
                            <div className="text-3xl font-bold text-white">
                                {userData.altitude.toLocaleString()}
                                <span className="text-base text-slate-400 ml-1">m</span>
                            </div>
                            <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                                <div 
                                    className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all duration-500 shadow-lg shadow-emerald-500/50"
                                    style={{ width: `${progressPercent}%` }}
                                />
                            </div>
                            <div className="text-xs text-slate-400 mt-1">
                                {Math.round(progressPercent)}% to summit
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                            <div className="flex items-center gap-2 mb-1">
                                <div className="w-3 h-3 rounded-full animate-pulse" style={{ backgroundColor: getOxygenColor(userData.oxygen) }} />
                                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
                            </div>
                            <div 
                                className="text-3xl font-bold transition-colors duration-500"
                                style={{ color: getOxygenColor(userData.oxygen) }}
                            >
                                {userData.oxygen}
                                <span className="text-base text-slate-400">%</span>
                            </div>
                            <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                                <div 
                                    className="h-full transition-all duration-500"
                                    style={{ 
                                        width: `${userData.oxygen}%`,
                                        backgroundColor: getOxygenColor(userData.oxygen),
                                        boxShadow: `0 0 10px ${getOxygenColor(userData.oxygen)}80`
                                    }}
                                />
                            </div>
                            <div className="text-xs text-slate-400 mt-1">
                                {userData.oxygen >= 70 ? 'Strong' : userData.oxygen >= 50 ? 'Moderate' : userData.oxygen >= 30 ? 'Weak' : 'Critical'}
                            </div>
                        </div>
                    </div>

                    {/* Habit Buttons */}
                    <div className="absolute left-4 right-4 z-50" style={{ bottom: '80px' }}>
                        <div className="bg-white/98 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
                            <div className="grid grid-cols-4 gap-3">
                                {habits.map((habit, index) => {
                                    const Icon = habit.icon;
                                    const colors = [
                                        { from: 'from-blue-500', to: 'to-cyan-500', glow: 'shadow-blue-500/50' },
                                        { from: 'from-indigo-500', to: 'to-purple-500', glow: 'shadow-indigo-500/50' },
                                        { from: 'from-green-500', to: 'to-emerald-500', glow: 'shadow-green-500/50' },
                                        { from: 'from-purple-500', to: 'to-pink-500', glow: 'shadow-purple-500/50' }
                                    ];
                                    const color = colors[index];
                                    
                                    return (
                                        <button
                                            key={habit.id}
                                            onClick={() => completeHabit(habit.id)}
                                            disabled={habit.completed || isClimbing}
                                            className={`
                                                relative aspect-square rounded-2xl transition-all duration-300 flex flex-col items-center justify-center gap-2
                                                ${habit.completed 
                                                    ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95' 
                                                    : `bg-gradient-to-br ${color.from} ${color.to} hover:scale-105 active:scale-95 shadow-xl ${color.glow}`
                                                }
                                                ${isClimbing && !habit.completed ? 'opacity-50 cursor-not-allowed' : ''}
                                            `}
                                        >
                                            {!habit.completed && (
                                                <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl" />
                                            )}
                                            
                                            <Icon 
                                                className={`w-7 h-7 ${habit.completed ? 'text-emerald-600' : 'text-white drop-shadow-lg'}`}
                                                strokeWidth={2.5}
                                            />
                                            <span className={`text-xs font-bold ${habit.completed ? 'text-emerald-700' : 'text-white drop-shadow'}`}>
                                                {habit.completed ? '✓ Done' : `+${habit.oxygen}%`}
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>
                            
                            <div className="text-center mt-4 pt-3 border-t border-slate-200">
                                <div className="flex items-center justify-center gap-2">
                                    <div className="flex gap-1">
                                        {habits.map((h, i) => (
                                            <div 
                                                key={i} 
                                                className={`w-2 h-2 rounded-full transition-all duration-300 ${
                                                    h.completed ? 'bg-emerald-500 scale-125' : 'bg-slate-300'
                                                }`}
                                            />
                                        ))}
                                    </div>
                                    <span className="text-sm text-slate-600 font-medium ml-2">
                                        {habits.filter(h => h.completed).length} / 4 completed
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {userData.altitude >= 2000 && userData.altitude < 2270 && (
                        <div className="absolute top-1/3 left-1/2 -translate-x-1/2 z-50 animate-bounce">
                            <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl border-2 border-white/50">
                                🎯 2,000m Milestone!
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<MountainView />, document.getElementById('root'));
    </script>
</body>
</html>
