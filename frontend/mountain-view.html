<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Vivify Mountain</title>

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React (for HUD/UI) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- PixiJS (GPU canvas) + GSAP for sweet easing -->
  <script src="https://unpkg.com/pixi.js@8/dist/pixi.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    html,body { height:100%; background:#0b1220; }
    body { margin:0; overflow:hidden; -webkit-tap-highlight-color: transparent; }
    /* Mobile safe area */
    .safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <!-- PIXI scene lives here -->
  <div id="scene" class="w-screen h-screen"></div>

  <!-- React HUD -->
  <div id="hud" class="pointer-events-none"></div>

  <script type="text/babel">
    // -----------------------------
    // PIXI SCENE (GPU-accelerated)
    // -----------------------------
    const DPR = Math.max(1, window.devicePixelRatio || 1);
    const sceneEl = document.getElementById('scene');

    const app = new PIXI.Application({
      resizeTo: sceneEl,    // handle responsive sizing
      antialias: true,
      backgroundAlpha: 1,
      powerPreference: 'high-performance',
      autoDensity: true
    });
    sceneEl.appendChild(app.view);

    // Root layers
    const skyLayer   = new PIXI.Container(); app.stage.addChild(skyLayer);
    const worldLayer = new PIXI.Container(); app.stage.addChild(worldLayer);
    const fxLayer    = new PIXI.Container(); app.stage.addChild(fxLayer);

    // Gradients via Graphics → toTexture for speed
    function makeVerticalGradient(w,h,top,bottom) {
      const g = new PIXI.Graphics();
      const mat = new PIXI.Matrix();
      mat.createGradient(0,0,0,h);
      const grad = g.beginTextureFill({
        texture: PIXI.Texture.WHITE,
        color: 0xFFFFFF,
        matrix: mat
      });
      // fallback: draw rect, then apply a gradient filter shader is overkill.
      // We'll fake with two rects + alpha ramp
      g.clear();
      const topC = PIXI.Color.shared.setValue(top).toNumber();
      const botC = PIXI.Color.shared.setValue(bottom).toNumber();
      // top
      const topRect = new PIXI.Graphics(); topRect.beginFill(topC).drawRect(0,0,w,h).endFill();
      // overlay a black->transparent to "mix" into bottom tone
      const botOverlay = new PIXI.Graphics(); botOverlay.beginFill(botC).drawRect(0,h*0.35,w,h).endFill(); botOverlay.alpha=0.9;
      const cont = new PIXI.Container();
      cont.addChild(topRect, botOverlay);
      const tex = app.renderer.generateTexture(cont, {resolution: DPR, region: new PIXI.Rectangle(0,0,w,h)});
      const spr = new PIXI.Sprite(tex);
      return spr;
    }

    // Sky
    const sky = makeVerticalGradient(app.renderer.width, app.renderer.height,
      '#3A7FB8', '#5BA3D8');
    skyLayer.addChild(sky);

    // Parallax ground strips
    function makeGroundStrip(width, height, colorHex) {
      const g = new PIXI.Graphics();
      g.beginFill(PIXI.Color.shared.setValue(colorHex).toNumber());
      g.drawRect(0, 0, width, height).endFill();

      // subtle texture noise
      const noise = new PIXI.Graphics();
      noise.beginFill(0x000000, 0.06); noise.drawRect(0,0,width,height).endFill();
      noise.blendMode = 'overlay';

      const c = new PIXI.Container();
      c.addChild(g, noise);
      return c;
    }

    // Create 3 parallax bands (near/mid/far)
    const groundFar  = makeGroundStrip(4000, 1400, '#9a9185');
    const groundMid  = makeGroundStrip(4000, 1600, '#887a6b');
    const groundNear = makeGroundStrip(4000, 2000, '#76695c');

    // Tilt for depth
    groundFar.angle = -6;  groundFar.y = app.renderer.height * 0.05;
    groundMid.angle = -8;  groundMid.y = app.renderer.height * 0.15;
    groundNear.angle = -10; groundNear.y = app.renderer.height * 0.28;

    worldLayer.addChild(groundFar, groundMid, groundNear);

    // Soft fog overlay
    const fog = new PIXI.Graphics();
    fog.beginFill(0xFFFFFF, 0.12).drawRect(0,0,app.renderer.width,app.renderer.height).endFill();
    fog.blendMode = 'screen';
    fxLayer.addChild(fog);

    // Snow particles (very light)
    const snow = new PIXI.ParticleContainer(300, {scale:true, alpha:true, position:true});
    fxLayer.addChild(snow);
    const snowTex = PIXI.Texture.from('data:image/svg+xml;charset=utf8,\
      <svg xmlns="http://www.w3.org/2000/svg" width="6" height="6"><circle cx="3" cy="3" r="3" fill="white" /></svg>');
    const flakes = [];
    for (let i=0;i<180;i++){
      const s = new PIXI.Sprite(snowTex);
      s.x = Math.random() * app.renderer.width;
      s.y = Math.random() * app.renderer.height;
      s.alpha = 0.5 + Math.random()*0.5;
      s.scale.set(0.4 + Math.random()*0.9);
      snow.addChild(s);
      flakes.push({spr:s, vy: 0.4 + Math.random()*0.8, sway: Math.random()*1.2});
    }

    // Avatar (placeholder crisp sprite)
    const avatarG = new PIXI.Graphics();
    avatarG.beginFill(0x2d72b8).drawRoundedRect(-18,-26,36,52,10).endFill(); // body
    avatarG.beginFill(0xc83838).drawCircle(0,-38,12).endFill(); // beanie
    avatarG.beginFill(0x222222).drawEllipse(0, -24, 10, 4).endFill(); // strap
    avatarG.beginFill(0x333333).drawEllipse(0, 28, 18, 6).endFill(); // shadow
    const avatarTex = app.renderer.generateTexture(avatarG, {resolution:DPR});
    const avatar = new PIXI.Sprite(avatarTex);
    avatar.anchor.set(0.5);
    avatar.x = app.renderer.width * 0.5;
    avatar.y = app.renderer.height * 0.58;
    avatar.zIndex = 10;
    worldLayer.addChild(avatar);

    // Depth blur filter for distant ground (cheap)
    const blurFar = new PIXI.filters.BlurFilter({strength:2, quality:2, resolution:1});
    const blurMid = new PIXI.filters.BlurFilter({strength:1.2, quality:2, resolution:1});
    groundFar.filters = [blurFar];
    groundMid.filters = [blurMid];

    // Resize handling
    function onResize() {
      sky.width  = app.renderer.width;  sky.height  = app.renderer.height;
      fog.clear().beginFill(0xFFFFFF, 0.12).drawRect(0,0,app.renderer.width,app.renderer.height).endFill();
      avatar.x = app.renderer.width * 0.5;
      avatar.y = app.renderer.height * 0.58;
    }
    window.addEventListener('resize', onResize);

    // Scene tick — snow + subtle light drift
    let t = 0;
    app.ticker.add((delta) => {
      t += delta/60;

      // snow
      for (const f of flakes) {
        f.spr.y += f.vy * delta;
        f.spr.x += Math.sin((f.spr.y + t*20) * 0.01) * f.sway * 0.3;
        if (f.spr.y > app.renderer.height) { f.spr.y = -10; f.spr.x = Math.random()*app.renderer.width; }
      }

      // parallax idle drift for life
      groundFar.x  = (Math.sin(t*0.07) * 40);
      groundMid.x  = (Math.sin(t*0.11) * 70);
      groundNear.x = (Math.sin(t*0.16) * 110);
    });

    // Public API for the HUD to call:
    const VivifyMountainAPI = {
      climbBy: (pixels, duration=1.05) => {
        // Move world downward to simulate ascent
        gsap.to(groundFar,  { y: groundFar.y  + pixels*0.22, duration, ease:'power2.out' });
        gsap.to(groundMid,  { y: groundMid.y  + pixels*0.42, duration, ease:'power2.out' });
        gsap.to(groundNear, { y: groundNear.y + pixels*0.72, duration, ease:'power2.out' });
        gsap.fromTo(avatar, { y: avatar.y+4 }, { y: avatar.y, duration:0.35, ease:'power1.out' });
      },
      setSkyGradient: (top, bottom) => {
        skyLayer.removeChild(sky);
        const s = makeVerticalGradient(app.renderer.width, app.renderer.height, top, bottom);
        skyLayer.addChildAt(s,0);
      },
      setSnowVisible: (visible) => {
        snow.visible = !!visible;
      }
    };
    window.VivifyMountainAPI = VivifyMountainAPI;

    // -----------------------------
    // REACT HUD + LOGIC
    // -----------------------------
    const {useState, useMemo} = React;

    const IconMountain = (props)=>(<svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>);
    const Drop = (props)=>(<svg {...props} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3.1S6 9.1 6 12.6a6 6 0 0 0 12 0C18 9.1 12 3.1 12 3.1z"/></svg>);
    const Moon = (p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3a9 9 0 1 0 9 9 6 6 0 0 1-9-9Z"/></svg>);
    const Steps = (p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="7" cy="14" r="3"/><circle cx="17" cy="10" r="3"/></svg>);
    const Target = (p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>);

    function envFromAltitude(alt){
      if (alt < 1000) return { name:'Forest Base', top:'#4A90C8', bot:'#7BB8E8', snow:false };
      if (alt < 2000) return { name:'Mountain Trail', top:'#3A7FB8', bot:'#5BA3D8', snow:false };
      if (alt < 3000) return { name:'Alpine Zone', top:'#2E6FA8', bot:'#4A8AC8', snow:true  };
      return { name:'Summit Ridge', top:'#1E5F98', bot:'#2E6FA8', snow:true };
    }

    function Hud(){
      const [data, setData] = useState({ altitude:1200, target:3776, oxygen:78 });
      const [climbing, setClimbing] = useState(false);
      const [habits, setHabits] = useState([
        { id:'water',  name:'Water',  icon:Drop,   oxygen:15, done:false },
        { id:'sleep',  name:'Sleep',  icon:Moon,   oxygen:20, done:false },
        { id:'move',   name:'Move',   icon:Steps,  oxygen:15, done:false },
        { id:'focus',  name:'Focus',  icon:Target, oxygen:20, done:false },
      ]);

      // Environment binding
      const env = useMemo(()=>envFromAltitude(data.altitude), [data.altitude]);
      React.useLayoutEffect(()=>{
        window.VivifyMountainAPI.setSkyGradient(env.top, env.bot);
        window.VivifyMountainAPI.setSnowVisible(env.snow);
      }, [env]);

      const progress = Math.min(100, (data.altitude / data.target) * 100);
      const oxyColor = data.oxygen >= 70 ? '#10b981' : data.oxygen >= 50 ? '#f59e0b' : data.oxygen >= 30 ? '#f97316' : '#ef4444';

      function completeHabit(h){
        if (h.done || climbing) return;
        setClimbing(true);

        // Animate world & stats
        const altitudeGain = 270;
        const pixels = 120;        // visual scroll amount

        window.VivifyMountainAPI.climbBy(pixels, 1.05);
        // Number easing (no re-render storm)
        gsap.to(data, {
          altitude: Math.min(data.altitude + altitudeGain, data.target),
          duration: 1.05, ease:'power2.out',
          onUpdate: () => setData(prev => ({...prev, altitude: gsap.getProperty(data,'altitude')})),
          onComplete: () => setClimbing(false)
        });
        setData(prev=>({...prev, oxygen: Math.min(prev.oxygen + h.oxygen, 100)}));
        setHabits(prev => prev.map(x => x.id===h.id ? {...x, done:true} : x));
      }

      return (
        <div className="pointer-events-none safe">
          {/* Top HUD */}
          <div className="absolute top-4 left-4 right-4 flex justify-between gap-3">
            <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
              <div className="flex items-center gap-2 mb-1">
                <IconMountain className="w-4 h-4 text-emerald-400" />
                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
              </div>
              <div className="text-3xl font-bold text-white">
                {Math.round(data.altitude).toLocaleString()}<span className="text-base text-slate-400 ml-1">m</span>
              </div>
              <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all" style={{width:`${progress}%`}}/>
              </div>
              <div className="text-xs text-slate-400 mt-1">{Math.round(progress)}% to summit</div>
            </div>

            <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
              <div className="flex items-center gap-2 mb-1">
                <div className="w-3 h-3 rounded-full animate-pulse" style={{backgroundColor:oxyColor}}/>
                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
              </div>
              <div className="text-3xl font-bold" style={{color:oxyColor}}>
                {Math.round(data.oxygen)}<span className="text-base text-slate-400">%</span>
              </div>
              <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                <div className="h-full transition-all" style={{width:`${data.oxygen}%`, backgroundColor:oxyColor, boxShadow:`0 0 10px ${oxyColor}80`}}/>
              </div>
              <div className="text-xs text-slate-400 mt-1">
                {data.oxygen>=70?'Strong':data.oxygen>=50?'Moderate':data.oxygen>=30?'Weak':'Critical'}
              </div>
            </div>
          </div>

          {/* Habit tray */}
          <div className="absolute left-4 right-4" style={{bottom:'80px'}}>
            <div className="pointer-events-auto bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
              <div className="grid grid-cols-4 gap-3">
                {habits.map((h,i)=>{
                  const Icon = h.icon;
                  const colors = [
                    ['from-blue-500','to-cyan-500','shadow-blue-500/50'],
                    ['from-indigo-500','to-purple-500','shadow-indigo-500/50'],
                    ['from-green-500','to-emerald-500','shadow-green-500/50'],
                    ['from-purple-500','to-pink-500','shadow-purple-500/50'],
                  ][i];
                  return (
                    <button
                      key={h.id}
                      onClick={()=>completeHabit(h)}
                      disabled={h.done||climbing}
                      className={`relative aspect-square rounded-2xl transition-all flex flex-col items-center justify-center gap-2
                        ${h.done
                          ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95'
                          : `bg-gradient-to-br ${colors[0]} ${colors[1]} hover:scale-105 active:scale-95 shadow-xl ${colors[2]}`
                        }
                        ${climbing && !h.done ? 'opacity-50 cursor-not-allowed':''}
                      `}
                    >
                      {!h.done && <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl" />}
                      <Icon className={`w-7 h-7 ${h.done?'text-emerald-700':'text-white drop-shadow'}`} />
                      <span className={`text-xs font-bold ${h.done?'text-emerald-700':'text-white'}`}>{h.done?'✓ Done':`+${h.oxygen}%`}</span>
                    </button>
                  );
                })}
              </div>
              <div className="text-center mt-4 pt-3 border-t border-slate-200">
                <div className="flex items-center justify-center gap-2">
                  <div className="flex gap-1">
                    {habits.map((h,i)=>(<div key={i} className={`w-2 h-2 rounded-full ${h.done?'bg-emerald-500 scale-125':'bg-slate-300'}`}/>))}
                  </div>
                  <span className="text-sm text-slate-600 font-medium ml-2">
                    {habits.filter(x=>x.done).length} / 4 completed
                  </span>
                </div>
              </div>
            </div>
          </div>

          {/* Milestone */}
          {(Math.round(progress) >= 53 && Math.round(progress) < 60) && (
            <div className="absolute top-1/3 left-1/2 -translate-x-1/2 animate-bounce">
              <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl border-2 border-white/50">
                🎯 2,000m Milestone!
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('hud')).render(<Hud />);
  </script>
</body>
</html>
