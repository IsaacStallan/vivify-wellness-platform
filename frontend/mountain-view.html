<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivify - Mountain View</title>
    
    <!-- Load React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
    
        // Icon components
        const Mountain = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
            </svg>
        );
    
        const Droplets = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
                <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
            </svg>
        );
    
        const Moon = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );
    
        const Footprints = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
                <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
            </svg>
        );
    
        const Target = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );
    
        const MountainView = () => {
            const [userData, setUserData] = useState({
                altitude: 1200,
                targetAltitude: 3776,
                oxygen: 78,
                mountainName: 'Mt. Fuji'
            });
    
            const [habits, setHabits] = useState([
                { id: 'hydration', name: 'Water', icon: Droplets, completed: false, oxygen: 15 },
                { id: 'sleep', name: 'Sleep', icon: Moon, completed: false, oxygen: 20 },
                { id: 'movement', name: 'Move', icon: Footprints, completed: false, oxygen: 15 },
                { id: 'focus', name: 'Focus', icon: Target, completed: false, oxygen: 20 }
            ]);
    
            const [trailOffset, setTrailOffset] = useState(0);
            const [isClimbing, setIsClimbing] = useState(false);
            const [stepPhase, setStepPhase] = useState(0); // 0 = neutral, 1 = left step, 2 = right step
    
            const progressPercent = (userData.altitude / userData.targetAltitude) * 100;
    
            const getZone = (alt) => {
                if (alt < 1500) return { 
                    name: 'Forest Trail', 
                    skyTop: '#5BA3D0',
                    skyMid: '#87CEEB',
                    skyBot: '#B0E0E6'
                };
                if (alt < 2500) return { 
                    name: 'Alpine Ridge', 
                    skyTop: '#4A7BA8',
                    skyMid: '#6BA3D4',
                    skyBot: '#89B5D6'
                };
                if (alt < 3500) return { 
                    name: 'High Summit', 
                    skyTop: '#2E5F8A',
                    skyMid: '#4A8AB8',
                    skyBot: '#6BA3D4'
                };
                return { 
                    name: 'Peak Ridge', 
                    skyTop: '#1E4F7A',
                    skyMid: '#2E5F8A',
                    skyBot: '#4A8AB8'
                };
            };
    
            const zone = getZone(userData.altitude);
    
            const completeHabit = (habitId) => {
                const habit = habits.find(h => h.id === habitId);
                if (habit.completed || isClimbing) return;
    
                setIsClimbing(true);
                
                // Smooth continuous scrolling animation
                let frame = 0;
                const totalFrames = 30;
                const scrollDistance = 80; // Total distance to scroll
                
                const animationInterval = setInterval(() => {
                    frame++;
                    setTrailOffset(prev => prev + (scrollDistance / totalFrames));
                    
                    // Alternate steps: left -> right -> left -> right
                    if (frame % 8 === 0) {
                        setStepPhase(prev => prev === 1 ? 2 : 1);
                    }
                    
                    if (frame >= totalFrames) {
                        clearInterval(animationInterval);
                        setStepPhase(0); // Back to neutral
                        
                        setUserData(prev => ({
                            ...prev,
                            altitude: Math.min(prev.altitude + 270, prev.targetAltitude),
                            oxygen: Math.min(prev.oxygen + habit.oxygen, 100)
                        }));
    
                        setHabits(prev => prev.map(h => 
                            h.id === habitId ? { ...h, completed: true } : h
                        ));
                        
                        setIsClimbing(false);
                    }
                }, 30);
            };
    
            const getOxygenColor = (oxygen) => {
                if (oxygen >= 70) return '#10b981';
                if (oxygen >= 50) return '#f59e0b';
                if (oxygen >= 30) return '#f97316';
                return '#ef4444';
            };
    
            // Generate realistic terrain elements
            const generateTerrain = () => {
                const elements = [];
                for (let i = 0; i < 40; i++) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const distance = 150 + i * 80;
                    const spread = 100 + Math.random() * 180;
                    
                    elements.push({
                        id: i,
                        x: side * spread,
                        y: distance,
                        type: Math.random() > 0.5 ? 'tree' : 'rock',
                        variant: Math.floor(Math.random() * 3),
                        size: 0.7 + Math.random() * 0.5
                    });
                }
                return elements;
            };
    
            const [terrainElements] = useState(generateTerrain());
    
            return (
                <div className="relative w-full h-screen overflow-hidden" style={{
                    background: `linear-gradient(to bottom, ${zone.skyTop} 0%, ${zone.skyMid} 50%, ${zone.skyBot} 100%)`
                }}>
                    
                    {/* Sun */}
                    <div className="absolute w-40 h-40 rounded-full" style={{
                        top: '6%',
                        right: '10%',
                        background: 'radial-gradient(circle, #fffef0 0%, #fff9c4 30%, #ffeb3b 60%, #ffa726 100%)',
                        boxShadow: '0 0 100px rgba(255, 235, 59, 0.5)',
                        opacity: 0.9
                    }} />
    
                    {/* Realistic clouds */}
                    {[...Array(8)].map((_, i) => (
                        <div
                            key={i}
                            className="absolute"
                            style={{
                                left: `${8 + i * 13}%`,
                                top: `${8 + (i % 4) * 10}%`,
                                width: `${140 + i * 25}px`,
                                height: `${70 + i * 12}px`,
                                background: 'radial-gradient(ellipse, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 70%, transparent 100%)',
                                borderRadius: '50%',
                                filter: 'blur(20px)',
                                animation: `cloudFloat ${30 + i * 8}s ease-in-out infinite`,
                                animationDelay: `${i * 4}s`
                            }}
                        />
                    ))}
    
                    {/* HUGE MOUNTAIN PEAK - Very visible */}
                    <svg className="absolute w-full h-full pointer-events-none" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
                        <defs>
                            <linearGradient id="mountainShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stopColor="#1e293b" stopOpacity="0.8" />
                                <stop offset="50%" stopColor="#334155" stopOpacity="0.6" />
                                <stop offset="100%" stopColor="#475569" stopOpacity="0.4" />
                            </linearGradient>
                            <linearGradient id="mountainSnow" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stopColor="#ffffff" stopOpacity="1" />
                                <stop offset="100%" stopColor="#e0f2fe" stopOpacity="0.85" />
                            </linearGradient>
                        </defs>
                        
                        {/* Mt. Fuji main body - HUGE and centered */}
                        <polygon
                            points="600,150 700,350 750,330 850,420 950,380 1000,430 1050,400 1100,450 1200,350 1300,450 800,450 750,380 700,340 650,300 600,250"
                            fill="url(#mountainShadow)"
                        />
                        
                        {/* Snow cap - very prominent */}
                        <polygon
                            points="600,150 650,220 700,200 750,250 800,220 850,270 900,230 950,280 1000,240 1050,290 1100,250 1050,230 1000,200 950,220 900,190 850,210 800,180 750,200 700,170 650,185"
                            fill="url(#mountainSnow)"
                        />
                        
                        {/* Additional detail ridges */}
                        <line x1="700" y1="200" x2="750" y2="350" stroke="#64748b" strokeWidth="3" opacity="0.3" />
                        <line x1="900" y1="230" x2="950" y2="380" stroke="#64748b" strokeWidth="3" opacity="0.3" />
                    </svg>
    
                    {/* Scrolling trail and terrain */}
                    <div 
                        className="absolute bottom-0 left-1/2 -translate-x-1/2"
                        style={{ 
                            transform: `translateX(-50%) translateY(${trailOffset}px)`,
                            transition: isClimbing ? 'none' : 'transform 0.3s ease-out'
                        }}
                    >
                        {/* Realistic dirt trail */}
                        <svg width="800" height="2000" className="absolute" style={{ bottom: '-600px', left: '50%', transform: 'translateX(-50%)' }}>
                            <defs>
                                {/* Dirt texture */}
                                <pattern id="dirtPattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
                                    <rect width="50" height="50" fill="#8b7355" />
                                    <circle cx="10" cy="10" r="3" fill="#6b5335" opacity="0.4" />
                                    <circle cx="35" cy="20" r="4" fill="#5d4a2f" opacity="0.3" />
                                    <circle cx="20" cy="35" r="2.5" fill="#7d6345" opacity="0.35" />
                                    <circle cx="42" cy="42" r="3.5" fill="#6b5335" opacity="0.45" />
                                    <ellipse cx="25" cy="15" rx="4" ry="2" fill="#5d4a2f" opacity="0.25" />
                                </pattern>
                                
                                <linearGradient id="trailGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor="#8b7355" stopOpacity="0.4" />
                                    <stop offset="50%" stopColor="#8b7355" stopOpacity="0.8" />
                                    <stop offset="100%" stopColor="#8b7355" stopOpacity="1" />
                                </linearGradient>
                            </defs>
                            
                            {/* Trail path with perspective */}
                            <path
                                d="M 220 2000 L 250 1500 L 270 1000 L 290 500 L 300 100 L 305 0 L 495 0 L 500 100 L 510 500 L 530 1000 L 550 1500 L 580 2000 Z"
                                fill="url(#trailGradient)"
                            />
                            <path
                                d="M 220 2000 L 250 1500 L 270 1000 L 290 500 L 300 100 L 305 0 L 495 0 L 500 100 L 510 500 L 530 1000 L 550 1500 L 580 2000 Z"
                                fill="url(#dirtPattern)"
                                opacity="0.8"
                            />
                            
                            {/* Trail edges */}
                            <path 
                                d="M 220 2000 L 250 1500 L 270 1000 L 290 500 L 300 100 L 305 0" 
                                stroke="#5d4a2f" 
                                strokeWidth="6" 
                                fill="none" 
                                opacity="0.8" 
                            />
                            <path 
                                d="M 580 2000 L 550 1500 L 530 1000 L 510 500 L 500 100 L 495 0" 
                                stroke="#5d4a2f" 
                                strokeWidth="6" 
                                fill="none" 
                                opacity="0.8" 
                            />
    
                            {/* Switchbacks and trail markers */}
                            {[...Array(16)].map((_, i) => {
                                const y = 120 + i * 120;
                                const leftX = 220 + (16 - i) * 6;
                                const rightX = 580 - (16 - i) * 6;
                                return (
                                    <g key={i}>
                                        <line 
                                            x1={leftX} y1={y} x2={rightX} y2={y}
                                            stroke="#6b5335" 
                                            strokeWidth="4" 
                                            strokeDasharray="20,15" 
                                            opacity="0.6" 
                                        />
                                        {/* Small rocks scattered */}
                                        {i % 2 === 0 && (
                                            <>
                                                <ellipse cx={leftX + 40} cy={y - 15} rx="5" ry="3" fill="#5d4a2f" opacity="0.7" />
                                                <ellipse cx={rightX - 50} cy={y + 12} rx="6" ry="4" fill="#6b5335" opacity="0.6" />
                                            </>
                                        )}
                                    </g>
                                );
                            })}
                        </svg>
    
                        {/* Realistic terrain objects */}
                        {terrainElements.map((el) => {
                            const scale = Math.max(0.4, 1 - (el.y / 3000));
                            let element = null;
    
                            if (el.type === 'tree') {
                                // Realistic tree variations
                                element = (
                                    <svg width={50 * el.size} height={70 * el.size} viewBox="0 0 50 70">
                                        {/* Trunk with texture */}
                                        <rect x="20" y="52" width="10" height="18" fill="#4a3728" />
                                        <rect x="21" y="53" width="8" height="16" fill="#5d4037" />
                                        <line x1="23" y1="55" x2="23" y2="68" stroke="#3e2723" strokeWidth="0.5" opacity="0.6" />
                                        <line x1="27" y1="56" x2="27" y2="67" stroke="#3e2723" strokeWidth="0.5" opacity="0.5" />
                                        
                                        {/* Detailed foliage layers */}
                                        <ellipse cx="25" cy="45" rx="22" ry="18" fill="#1a5f1a" />
                                        <ellipse cx="25" cy="37" rx="19" ry="15" fill="#2d6b2d" />
                                        <ellipse cx="25" cy="30" rx="16" ry="13" fill="#3d7a3d" />
                                        <ellipse cx="25" cy="24" rx="13" ry="11" fill="#4d8a4d" />
                                        <ellipse cx="25" cy="19" rx="10" ry="9" fill="#5d9a5d" />
                                        
                                        {/* Light patches for depth */}
                                        <ellipse cx="22" cy="32" rx="6" ry="5" fill="#6daa6d" opacity="0.5" />
                                        <ellipse cx="29" cy="38" rx="7" ry="6" fill="#6daa6d" opacity="0.4" />
                                        <ellipse cx="25" cy="22" rx="4" ry="3" fill="#7dba7d" opacity="0.6" />
                                    </svg>
                                );
                            } else if (el.type === 'rock') {
                                // Realistic rock with shading
                                element = (
                                    <svg width={35 * el.size} height={25 * el.size} viewBox="0 0 35 25">
                                        {/* Shadow */}
                                        <ellipse cx="17" cy="23" rx="16" ry="4" fill="#000000" opacity="0.2" />
                                        
                                        {/* Rock body with detail */}
                                        <path d="M17,4 L30,18 L28,22 L7,22 L5,18 Z" fill="#6b7280" />
                                        <path d="M17,4 L24,14 L22,19 L12,19 L10,14 Z" fill="#9ca3af" />
                                        <path d="M17,6 L21,13 L19,16 L15,16 L13,13 Z" fill="#cbd5e1" />
                                        
                                        {/* Cracks and detail */}
                                        <line x1="12" y1="17" x2="15" y2="12" stroke="#475569" strokeWidth="0.8" opacity="0.5" />
                                        <line x1="23" y1="18" x2="20" y2="13" stroke="#475569" strokeWidth="0.8" opacity="0.5" />
                                        <line x1="17" y1="7" x2="17" y2="15" stroke="#475569" strokeWidth="0.6" opacity="0.4" />
                                    </svg>
                                );
                            }
    
                            return (
                                <div
                                    key={el.id}
                                    className="absolute"
                                    style={{
                                        left: `calc(50% + ${el.x}px)`,
                                        bottom: `${el.y}px`,
                                        transform: `scale(${scale})`,
                                        opacity: scale > 0.5 ? 1 : scale * 1.5,
                                        filter: el.y > 1500 ? 'blur(1px)' : 'none'
                                    }}
                                >
                                    {element}
                                </div>
                            );
                        })}
                    </div>
    
                    {/* DETAILED CLIMBER - Back view, realistic */}
                    <div className="absolute bottom-36 left-1/2 -translate-x-1/2 z-30">
                        <svg width="100" height="140" viewBox="0 0 100 140">
                            {/* Large backpack - prominent */}
                            <ellipse cx="50" cy="52" rx="22" ry="28" fill="#b71c1c" />
                            <ellipse cx="50" cy="50" rx="20" ry="26" fill="#c62828" />
                            <rect x="42" y="38" width="16" height="12" rx="3" fill="#d32f2f" />
                            <circle cx="45" cy="58" r="3" fill="#ef5350" />
                            <circle cx="55" cy="58" r="3" fill="#ef5350" />
                            
                            {/* Straps */}
                            <path d="M38,45 Q35,50 35,70" stroke="#8b1a1a" strokeWidth="3" fill="none" />
                            <path d="M62,45 Q65,50 65,70" stroke="#8b1a1a" strokeWidth="3" fill="none" />
                            
                            {/* Sleeping bag on top */}
                            <ellipse cx="50" cy="30" rx="12" ry="8" fill="#1565c0" />
                            <ellipse cx="50" cy="28" rx="10" ry="6" fill="#1976d2" />
                            
                            {/* Hood/Hat - back of head */}
                            <ellipse cx="50" cy="20" rx="14" ry="16" fill="#b71c1c" />
                            <ellipse cx="50" cy="18" rx="12" ry="14" fill="#c62828" />
                            <ellipse cx="50" cy="12" rx="13" ry="8" fill="#d32f2f" />
                            <circle cx="50" cy="14" r="3" fill="#ef5350" />
                            
                            {/* Neck/shoulders visible */}
                            <rect x="44" y="28" width="12" height="8" fill="#d4a574" />
                            
                            {/* Jacket - back view */}
                            <path d="M35,70 L32,75 L32,95 L38,100 L38,115 L35,128 L40,132 L50,130 L50,70 Z" fill="#0d47a1" />
                            <path d="M65,70 L68,75 L68,95 L62,100 L62,115 L65,128 L60,132 L50,130 L50,70 Z" fill="#0d47a1" />
                            <rect x="38" y="70" width="24" height="60" fill="#1565c0" />
                            
                            {/* Jacket details - seams */}
                            <line x1="44" y1="75" x2="44" y2="125" stroke="#0d47a1" strokeWidth="1.5" opacity="0.6" />
                            <line x1="56" y1="75" x2="56" y2="125" stroke="#0d47a1" strokeWidth="1.5" opacity="0.6" />
                            
                            {/* Arms - left arm */}
                            <g transform={`rotate(${stepPhase === 1 ? -15 : stepPhase === 2 ? -5 : -10} 35 80)`}>
                                <ellipse cx="35" cy="88" rx="6" ry="20" fill="#0d47a1" />
                                <ellipse cx="34" cy="105" rx="5" ry="16" fill="#1565c0" />
                                <ellipse cx="33" cy="119" rx="5" ry="8" fill="#d4a574" />
                                <ellipse cx="33" cy="122" rx="6" ry="6" fill="#ff6f00" />
                            </g>
                            
                            {/* Arms - right arm (holding pole) */}
                            <g transform={`rotate(${stepPhase === 2 ? 15 : stepPhase === 1 ? 5 : 10} 65 80)`}>
                                <ellipse cx="65" cy="88" rx="6" ry="20" fill="#0d47a1" />
                                <ellipse cx="66" cy="105" rx="5" ry="16" fill="#1565c0" />
                                <ellipse cx="67" cy="119" rx="5" ry="8" fill="#d4a574" />
                                <ellipse cx="67" cy="122" rx="6" ry="6" fill="#ff6f00" />
                            </g>
                            
                            {/* Hiking pole */}
                            <line x1="68" y1="122" x2="74" y2="138" stroke="#795548" strokeWidth="3.5" />
                            <circle cx="74" cy="139" r="4" fill="#5d4037" />
                            <circle cx="68" cy="124" r="3" fill="#8d6e63" />
                            
                            {/* Legs - animated walking */}
                            <g transform={`translate(${stepPhase === 1 ? -1 : 0} ${stepPhase === 1 ? 4 : 0})`}>
                                <rect x="40" y="130" width="10" height="10" rx="2" fill="#37474f" />
                            </g>
                            <g transform={`translate(${stepPhase === 2 ? 1 : 0} ${stepPhase === 2 ? 4 : 0})`}>
                                <rect x="50" y="130" width="10" height="10" rx="2" fill="#37474f" />
                            </g>
                            
                            {/* Boots - back view */}
                            <ellipse cx="45" cy="140" rx="7" ry="3" fill="#212121" />
                            <ellipse cx="55" cy="140" rx="7" ry="3" fill="#212121" />
                        </svg>
                        
                        {/* Shadow */}
                        <div 
                            className="absolute -bottom-5 left-1/2 -translate-x-1/2 rounded-full blur-xl"
                            style={{ 
                                width: '70px',
                                height: '16px',
                                background: 'radial-gradient(ellipse, rgba(0,0,0,0.6) 0%, transparent 70%)'
                            }}
                        />
                    </div>
    
                    {/* Fog/atmosphere at bottom */}
                    <div className="absolute inset-0 pointer-events-none">
                        <div 
                            className="absolute bottom-0 left-0 right-0"
                            style={{
                                height: '45%',
                                background: `linear-gradient(to top, ${zone.skyBot}95 0%, ${zone.skyBot}50 30%, transparent 100%)`
                            }}
                        />
                    </div>
    
                    {/* HUD - unchanged */}
                    <div className="absolute top-4 left-4 right-4 z-40 flex justify-between items-start gap-3">
                        <div className="bg-gradient-to-br from-slate-900/90 to-slate-800/90 backdrop-blur-md rounded-2xl px-5 py-3 shadow-2xl border border-white/10">
                            <div className="flex items-center gap-2 mb-1">
                                <Mountain className="w-4 h-4 text-emerald-400" />
                                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{zone.name}</span>
                            </div>
                            <div className="text-3xl font-bold text-white">
                                {userData.altitude.toLocaleString()}
                                <span className="text-base text-slate-400 ml-1">m</span>
                            </div>
                            <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                                <div 
                                    className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all duration-500 shadow-lg shadow-emerald-500/50"
                                    style={{ width: `${progressPercent}%` }}
                                />
                            </div>
                            <div className="text-xs text-slate-400 mt-1">
                                {Math.round(progressPercent)}% to summit
                            </div>
                        </div>
    
                        <div className="bg-gradient-to-br from-slate-900/90 to-slate-800/90 backdrop-blur-md rounded-2xl px-5 py-3 shadow-2xl border border-white/10">
                        <div className="flex items-center gap-2 mb-1">
                            <div className="w-3 h-3 rounded-full animate-pulse" style={{ backgroundColor: getOxygenColor(userData.oxygen) }} />
                            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
                        </div>
                        <div 
                            className="text-3xl font-bold transition-colors duration-500"
                            style={{ color: getOxygenColor(userData.oxygen) }}
                        >
                            {userData.oxygen}
                            <span className="text-base text-slate-400">%</span>
                        </div>
                        <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                            <div 
                                className="h-full transition-all duration-500"
                                style={{ 
                                    width: `${userData.oxygen}%`,
                                    backgroundColor: getOxygenColor(userData.oxygen),
                                    boxShadow: `0 0 10px ${getOxygenColor(userData.oxygen)}80`
                                }}
                            />
                        </div>
                        <div className="text-xs text-slate-400 mt-1">
                            {userData.oxygen >= 70 ? 'Strong' : userData.oxygen >= 50 ? 'Moderate' : userData.oxygen >= 30 ? 'Weak' : 'Critical'}
                        </div>
                    </div>
                </div>

                {/* Habit Buttons */}
                <div className="absolute bottom-6 left-4 right-4 z-40">
                    <div className="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-4 border border-slate-200">
                        <div className="grid grid-cols-4 gap-3">
                            {habits.map((habit, index) => {
                                const Icon = habit.icon;
                                const colors = [
                                    { from: 'from-blue-500', to: 'to-cyan-500', glow: 'shadow-blue-500/50' },
                                    { from: 'from-indigo-500', to: 'to-purple-500', glow: 'shadow-indigo-500/50' },
                                    { from: 'from-green-500', to: 'to-emerald-500', glow: 'shadow-green-500/50' },
                                    { from: 'from-purple-500', to: 'to-pink-500', glow: 'shadow-purple-500/50' }
                                ];
                                const color = colors[index];
                                
                                return (
                                    <button
                                        key={habit.id}
                                        onClick={() => completeHabit(habit.id)}
                                        disabled={habit.completed || isClimbing}
                                        className={`
                                            relative aspect-square rounded-2xl transition-all duration-300 flex flex-col items-center justify-center gap-2
                                            ${habit.completed 
                                                ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95' 
                                                : `bg-gradient-to-br ${color.from} ${color.to} hover:scale-105 active:scale-95 shadow-xl ${color.glow}`
                                            }
                                            ${isClimbing && !habit.completed ? 'opacity-50 cursor-not-allowed' : ''}
                                        `}
                                    >
                                        {!habit.completed && (
                                            <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl" />
                                        )}
                                        
                                        <Icon 
                                            className={`w-7 h-7 ${habit.completed ? 'text-emerald-600' : 'text-white drop-shadow-lg'}`}
                                            strokeWidth={2.5}
                                        />
                                        <span className={`text-xs font-bold ${habit.completed ? 'text-emerald-700' : 'text-white drop-shadow'}`}>
                                            {habit.completed ? '✓ Done' : `+${habit.oxygen}%`}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                        
                        <div className="text-center mt-4 pt-3 border-t border-slate-200">
                            <div className="flex items-center justify-center gap-2">
                                <div className="flex gap-1">
                                    {habits.map((h, i) => (
                                        <div 
                                            key={i} 
                                            className={`w-2 h-2 rounded-full transition-all duration-300 ${
                                                h.completed ? 'bg-emerald-500 scale-125' : 'bg-slate-300'
                                            }`}
                                        />
                                    ))}
                                </div>
                                <span className="text-sm text-slate-600 font-medium ml-2">
                                    {habits.filter(h => h.completed).length} / 4 completed
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Milestone notification */}
                {userData.altitude >= 2000 && userData.altitude < 2270 && (
                    <div className="absolute top-1/3 left-1/2 -translate-x-1/2 z-40 animate-bounce">
                        <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl border-2 border-white/50">
                            🎯 2,000m Milestone!
                        </div>
                    </div>
                )}

                <style>{`
                    @keyframes cloudFloat {
                        0%, 100% { transform: translateY(0px) translateX(0px); }
                        25% { transform: translateY(-15px) translateX(10px); }
                        50% { transform: translateY(-8px) translateX(-10px); }
                        75% { transform: translateY(-20px) translateX(8px); }
                    }
                `}</style>
            </div>
        );
    };

    ReactDOM.render(<MountainView />, document.getElementById('root'));
</script>
</body>
</html>
