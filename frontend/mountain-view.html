<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivify - Mountain View</title>
    
    <!-- Load React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
    
        // Icons (keeping same)
        const Mountain = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
            </svg>
        );
    
        const Droplets = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
                <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
            </svg>
        );
    
        const Moon = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );
    
        const Footprints = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
                <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
            </svg>
        );
    
        const Target = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );
    
        const MountainView = () => {
            const [userData, setUserData] = useState({
                altitude: 1200,
                targetAltitude: 3776,
                oxygen: 78,
                mountainName: 'Mt. Fuji'
            });
    
            const [habits, setHabits] = useState([
                { id: 'hydration', name: 'Water', icon: Droplets, completed: false, oxygen: 15 },
                { id: 'sleep', name: 'Sleep', icon: Moon, completed: false, oxygen: 20 },
                { id: 'movement', name: 'Move', icon: Footprints, completed: false, oxygen: 15 },
                { id: 'focus', name: 'Focus', icon: Target, completed: false, oxygen: 20 }
            ]);
    
            const [mountainScroll, setMountainScroll] = useState(0);
            const [isClimbing, setIsClimbing] = useState(false);
            const [stepPhase, setStepPhase] = useState(0); // 0=neutral, 1=left forward, 2=right forward
    
            const progressPercent = (userData.altitude / userData.targetAltitude) * 100;
    
            const getEnvironment = (alt) => {
                if (alt < 1000) return {
                    name: 'Forest Base',
                    skyTop: '#5BA3D0',
                    skyBot: '#87CEEB',
                    slopeColor: '#7a6f5d',
                    slopeDark: '#5d513f',
                    hasForest: true
                };
                if (alt < 2000) return {
                    name: 'Mountain Trail',
                    skyTop: '#4A7BA8',
                    skyBot: '#6BA3D4',
                    slopeColor: '#8b8680',
                    slopeDark: '#6b6660',
                    hasForest: true
                };
                if (alt < 3000) return {
                    name: 'Alpine Zone',
                    skyTop: '#2E5F8A',
                    skyBot: '#4A8AB8',
                    slopeColor: '#9098a0',
                    slopeDark: '#707880',
                    hasForest: false
                };
                return {
                    name: 'Summit Ridge',
                    skyTop: '#1E4F7A',
                    skyBot: '#2E5F8A',
                    slopeColor: '#e8f0f8',
                    slopeDark: '#c8d8e8',
                    hasForest: false
                };
            };
    
            const env = getEnvironment(userData.altitude);
    
            const completeHabit = (habitId) => {
                const habit = habits.find(h => h.id === habitId);
                if (habit.completed || isClimbing) return;
    
                setIsClimbing(true);
                
                let frame = 0;
                const totalFrames = 30;
                
                const walkInterval = setInterval(() => {
                    frame++;
                    setMountainScroll(prev => prev + 2.8);
                    
                    // Step every 8 frames for smooth natural gait
                    if (frame % 8 === 0) {
                        setStepPhase(prev => prev === 1 ? 2 : 1);
                    }
                    
                    if (frame >= totalFrames) {
                        clearInterval(walkInterval);
                        setStepPhase(0);
                        
                        setUserData(prev => ({
                            ...prev,
                            altitude: Math.min(prev.altitude + 270, prev.targetAltitude),
                            oxygen: Math.min(prev.oxygen + habit.oxygen, 100)
                        }));
    
                        setHabits(prev => prev.map(h => 
                            h.id === habitId ? { ...h, completed: true } : h
                        ));
                        
                        setIsClimbing(false);
                    }
                }, 35);
            };
    
            const getOxygenColor = (oxygen) => {
                if (oxygen >= 70) return '#10b981';
                if (oxygen >= 50) return '#f59e0b';
                if (oxygen >= 30) return '#f97316';
                return '#ef4444';
            };
    
            const generateTerrain = () => {
                const elements = [];
                for (let i = 0; i < 40; i++) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const y = 250 + i * 100;
                    const x = side * (140 + Math.random() * 220);
                    
                    elements.push({
                        id: i,
                        x: x,
                        y: y,
                        type: env.hasForest && Math.random() > 0.3 ? 'tree' : 'rock',
                        size: 1.2 + Math.random() * 0.8
                    });
                }
                return elements;
            };
    
            const [terrain] = useState(generateTerrain());
    
            return (
                <div className="relative w-full h-screen overflow-hidden" style={{
                    background: `linear-gradient(to bottom, ${env.skyTop} 0%, ${env.skyBot} 100%)`
                }}>
                    
                    {/* Sun */}
                    <div className="absolute w-56 h-56 rounded-full" style={{
                        top: '6%',
                        right: '10%',
                        background: 'radial-gradient(circle, #fffff8 0%, #fffacd 20%, #ffeb3b 50%, #ffa726 100%)',
                        boxShadow: '0 0 150px rgba(255, 235, 59, 0.5)',
                        opacity: 0.9
                    }} />
    
                    {/* Mountain slope */}
                    <div 
                        className="absolute inset-0"
                        style={{
                            transform: `translateY(${mountainScroll}px)`,
                            transition: 'none'
                        }}
                    >
                        <svg width="100%" height="200%" className="absolute" style={{ top: '-50%' }} preserveAspectRatio="none">
                            <defs>
                                <pattern id="terrain" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
                                    <rect width="100" height="100" fill={env.slopeColor} />
                                    <circle cx="20" cy="20" r="8" fill={env.slopeDark} opacity="0.25" />
                                    <circle cx="65" cy="35" r="10" fill={env.slopeDark} opacity="0.2" />
                                    <circle cx="40" cy="70" r="7" fill={env.slopeDark} opacity="0.3" />
                                    <circle cx="80" cy="80" r="9" fill={env.slopeDark} opacity="0.22" />
                                    <ellipse cx="30" cy="50" rx="10" ry="5" fill={env.slopeDark} opacity="0.18" />
                                </pattern>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#terrain)" />
                            
                            {[...Array(20)].map((_, i) => (
                                <line 
                                    key={i}
                                    x1="0" 
                                    y1={i * 150} 
                                    x2="100%" 
                                    y2={i * 150}
                                    stroke={env.slopeDark}
                                    strokeWidth="2"
                                    opacity="0.12"
                                    strokeDasharray="20,15"
                                />
                            ))}
                        </svg>
    
                        {/* BIGGER, MORE REALISTIC TERRAIN */}
                        {terrain.map((obj) => {
                            const scale = Math.max(0.6, 1 - ((obj.y - mountainScroll) / 3500));
                            
                            let element = null;
    
                            if (obj.type === 'tree') {
                                element = (
                                    <svg width={80 * obj.size} height={110 * obj.size} viewBox="0 0 80 110">
                                        {/* Trunk - realistic bark */}
                                        <rect x="32" y="80" width="16" height="30" fill="#3e2723" />
                                        <rect x="33" y="81" width="14" height="28" fill="#4a3728" />
                                        <rect x="34" y="82" width="12" height="26" fill="#5d4037" />
                                        <line x1="35" y1="84" x2="35" y2="106" stroke="#2d1b14" strokeWidth="1" opacity="0.7" />
                                        <line x1="38" y1="83" x2="38" y2="107" stroke="#2d1b14" strokeWidth="0.8" opacity="0.6" />
                                        <line x1="42" y1="84" x2="42" y2="105" stroke="#2d1b14" strokeWidth="0.9" opacity="0.65" />
                                        <ellipse cx="37" cy="92" rx="2" ry="3" fill="#2d1b14" opacity="0.8" />
                                        <ellipse cx="41" cy="98" rx="1.8" ry="2.5" fill="#2d1b14" opacity="0.7" />
                                        
                                        {/* Foliage - layered and dense */}
                                        <ellipse cx="40" cy="70" rx="34" ry="28" fill="#0f3d0f" />
                                        <ellipse cx="40" cy="62" rx="31" ry="25" fill="#143d14" />
                                        <ellipse cx="40" cy="55" rx="28" ry="23" fill="#1a4d1a" />
                                        <ellipse cx="40" cy="48" rx="25" ry="21" fill="#1e5a1e" />
                                        <ellipse cx="40" cy="42" rx="22" ry="19" fill="#256b25" />
                                        <ellipse cx="40" cy="36" rx="19" ry="17" fill="#2d7a2d" />
                                        <ellipse cx="40" cy="31" rx="16" ry="14" fill="#358a35" />
                                        <ellipse cx="40" cy="26" rx="13" ry="12" fill="#3d9a3d" />
                                        <ellipse cx="40" cy="22" rx="10" ry="10" fill="#45aa45" />
                                        
                                        {/* Highlights */}
                                        <ellipse cx="34" cy="50" rx="10" ry="8" fill="#5dba5d" opacity="0.6" />
                                        <ellipse cx="47" cy="58" rx="11" ry="9" fill="#5dba5d" opacity="0.5" />
                                        <ellipse cx="37" cy="35" rx="7" ry="6" fill="#6dca6d" opacity="0.7" />
                                        <ellipse cx="44" cy="42" rx="8" ry="7" fill="#6dca6d" opacity="0.55" />
                                        
                                        {/* Dark shadows */}
                                        <ellipse cx="30" cy="63" rx="9" ry="7" fill="#0a2d0a" opacity="0.5" />
                                        <ellipse cx="50" cy="66" rx="10" ry="8" fill="#0a2d0a" opacity="0.45" />
                                    </svg>
                                );
                            } else {
                                element = (
                                    <svg width={55 * obj.size} height={38 * obj.size} viewBox="0 0 55 38">
                                        <ellipse cx="27" cy="36" rx="24" ry="6" fill="#000000" opacity="0.3" />
                                        <path d="M27,6 L45,28 L43,34 L11,34 L9,28 Z" fill="#3f3f3f" />
                                        <path d="M27,6 L38,23 L36,30 L18,30 L16,23 Z" fill="#5a5a5a" />
                                        <path d="M27,8 L33,20 L31,26 L23,26 L21,20 Z" fill="#7a7a7a" />
                                        <path d="M27,10 L30,18 L29,22 L25,22 L24,18 Z" fill="#9a9a9a" />
                                        <ellipse cx="27" cy="14" rx="5" ry="4" fill="#b5b5b5" opacity="0.7" />
                                        
                                        {/* Cracks */}
                                        <line x1="18" y1="29" x2="22" y2="20" stroke="#2a2a2a" strokeWidth="1.5" opacity="0.7" />
                                        <line x1="36" y1="30" x2="32" y2="21" stroke="#2a2a2a" strokeWidth="1.5" opacity="0.7" />
                                        <line x1="27" y1="9" x2="27" y2="25" stroke="#2a2a2a" strokeWidth="1.2" opacity="0.6" />
                                        <path d="M24,22 Q25,21 26,22" stroke="#3a3a3a" strokeWidth="0.8" fill="none" opacity="0.6" />
                                        <path d="M29,24 Q30,23 31,24" stroke="#3a3a3a" strokeWidth="0.8" fill="none" opacity="0.6" />
                                        
                                        {/* Moss */}
                                        <ellipse cx="21" cy="26" rx="4" ry="3" fill="#4a6b4a" opacity="0.5" />
                                        <ellipse cx="34" cy="28" rx="3.5" ry="2.5" fill="#4a6b4a" opacity="0.45" />
                                    </svg>
                                );
                            }
    
                            return (
                                <div
                                    key={obj.id}
                                    className="absolute"
                                    style={{
                                        left: `calc(50% + ${obj.x}px)`,
                                        top: `${obj.y}px`,
                                        transform: `scale(${scale})`,
                                        opacity: scale > 0.7 ? 1 : scale * 1.3,
                                        filter: scale < 0.75 ? 'blur(1.2px)' : 'none'
                                    }}
                                >
                                    {element}
                                </div>
                            );
                        })}
                    </div>
    
                    {/* GRAND MOUNTAIN ADVENTURE STYLE CHARACTER */}
                    <div className="absolute left-1/2 -translate-x-1/2 z-40" style={{ top: '46%' }}>
                        <svg width="140" height="180" viewBox="0 0 140 180">
                            {/* BACKPACK - realistic hiking pack */}
                            <ellipse cx="70" cy="68" rx="32" ry="38" fill="#1a4d80" />
                            <ellipse cx="70" cy="66" rx="30" ry="36" fill="#2563a8" />
                            <ellipse cx="70" cy="64" rx="28" ry="34" fill="#2d72b8" />
                            
                            {/* Main compartment */}
                            <rect x="56" y="52" width="28" height="20" rx="4" fill="#3d82c8" />
                            <rect x="58" y="54" width="24" height="16" rx="3" fill="#4a8fd8" />
                            
                            {/* Side pockets */}
                            <ellipse cx="48" cy="70" rx="8" ry="16" fill="#2563a8" />
                            <ellipse cx="92" cy="70" rx="8" ry="16" fill="#2563a8" />
                            
                            {/* Straps detail */}
                            <path d="M48,58 Q44,64 44,82" stroke="#1a3d60" strokeWidth="5" fill="none" />
                            <path d="M92,58 Q96,64 96,82" stroke="#1a3d60" strokeWidth="5" fill="none" />
                            <path d="M49,60 Q46,66 46,82" stroke="#2563a8" strokeWidth="3.5" fill="none" />
                            <path d="M91,60 Q94,66 94,82" stroke="#2563a8" strokeWidth="3.5" fill="none" />
                            
                            {/* Buckles */}
                            <rect x="56" y="74" width="6" height="4" rx="1" fill="#505050" />
                            <rect x="78" y="74" width="6" height="4" rx="1" fill="#505050" />
                            
                            {/* Sleeping pad on top */}
                            <ellipse cx="70" cy="42" rx="18" ry="12" fill="#c84848" />
                            <ellipse cx="70" cy="40" rx="16" ry="10" fill="#d85858" />
                            
                            {/* BEANIE/CAP - realistic winter hat */}
                            <ellipse cx="70" cy="28" rx="20" ry="22" fill="#8b2828" />
                            <ellipse cx="70" cy="26" rx="18" ry="20" fill="#a83838" />
                            <ellipse cx="70" cy="24" rx="17" ry="19" fill="#c84848" />
                            <ellipse cx="70" cy="18" rx="18" ry="12" fill="#d85858" />
                            <circle cx="70" cy="14" r="6" fill="#e86868" />
                            <circle cx="68" cy="13" r="3" fill="#f88888" opacity="0.8" />
                            
                            {/* Back of head/neck */}
                            <ellipse cx="70" cy="42" rx="15" ry="12" fill="#d4a574" />
                            <rect x="62" y="50" width="16" height="10" fill="#c99565" />
                            
                            {/* GOGGLE STRAP visible on back of head */}
                            <ellipse cx="70" cy="32" rx="19" ry="4" fill="#2a2a2a" opacity="0.8" />
                            <ellipse cx="70" cy="32" rx="18" ry="3" fill="#3a3a3a" />
                            
                            {/* RAIN JACKET - realistic outdoor gear */}
                            <path d="M46,82 L42,88 L42,118 L48,124 L48,142 L46,156 L52,160 L70,158 L70,82 Z" fill="#1a5c8a" />
                            <path d="M94,82 L98,88 L98,118 L92,124 L92,142 L94,156 L88,160 L70,158 L70,82 Z" fill="#1a5c8a" />
                            <rect x="48" y="82" width="44" height="76" fill="#2d72b8" />
                            
                            {/* Jacket seams and details */}
                            <line x1="70" y1="86" x2="70" y2="152" stroke="#1a5c8a" strokeWidth="3" />
                            <line x1="56" y1="88" x2="56" y2="148" stroke="#1a5c8a" strokeWidth="2" opacity="0.7" />
                            <line x1="84" y1="88" x2="84" y2="148" stroke="#1a5c8a" strokeWidth="2" opacity="0.7" />
                            
                            {/* Waterproof panels */}
                            <rect x="56" y="92" width="12" height="54" fill="#3d82c8" opacity="0.4" />
                            <rect x="72" y="92" width="12" height="54" fill="#3d82c8" opacity="0.4" />
                            
                            {/* Pockets on jacket */}
                            <rect x="54" y="100" width="14" height="18" rx="2" fill="#1a5c8a" />
                            <rect x="72" y="100" width="14" height="18" rx="2" fill="#1a5c8a" />
                            
                            {/* Left arm with hiking pole */}
                            <g transform={`rotate(${stepPhase === 1 ? -18 : stepPhase === 2 ? -8 : -12} 48 96)`}>
                                <ellipse cx="48" cy="106" rx="8" ry="26" fill="#1a5c8a" />
                                <ellipse cx="47" cy="128" rx="7.5" ry="22" fill="#2d72b8" />
                                <ellipse cx="46" cy="148" rx="7" ry="12" fill="#d4a574" />
                                <ellipse cx="46" cy="152" rx="8" ry="8" fill="#2a2a2a" />
                                <ellipse cx="46" cy="152" rx="7" ry="7" fill="#3a3a3a" />
                            </g>
                            
                            {/* Hiking pole - LEFT */}
                            {stepPhase === 1 && (
                                <>
                                    <line x1="47" y1="152" x2="42" y2="178" stroke="#505050" strokeWidth="4" />
                                    <line x1="47" y1="152" x2="42" y2="178" stroke="#6a6a6a" strokeWidth="3.5" />
                                    <circle cx="42" cy="178" r="5" fill="#3a3a3a" />
                                    <circle cx="47" cy="154" r="4" fill="#7a7a7a" />
                                </>
                            )}
                            
                            {/* Right arm with hiking pole */}
                            <g transform={`rotate(${stepPhase === 2 ? 18 : stepPhase === 1 ? 8 : 12} 92 96)`}>
                                <ellipse cx="92" cy="106" rx="8" ry="26" fill="#1a5c8a" />
                                <ellipse cx="93" cy="128" rx="7.5" ry="22" fill="#2d72b8" />
                                <ellipse cx="94" cy="148" rx="7" ry="12" fill="#d4a574" />
                                <ellipse cx="94" cy="152" rx="8" ry="8" fill="#2a2a2a" />
                                <ellipse cx="94" cy="152" rx="7" ry="7" fill="#3a3a3a" />
                            </g>
                            
                            {/* Hiking pole - RIGHT */}
                            {stepPhase === 2 && (
                                <>
                                    <line x1="93" y1="152" x2="98" y2="178" stroke="#505050" strokeWidth="4" />
                                    <line x1="93" y1="152" x2="98" y2="178" stroke="#6a6a6a" strokeWidth="3.5" />
                                    <circle cx="98" cy="178" r="5" fill="#3a3a3a" />
                                    <circle cx="93" cy="154" r="4" fill="#7a7a7a" />
                                </>
                            )}
                            
                            {/* WATERPROOF PANTS - realistic hiking pants */}
                            <g transform={`translate(${stepPhase === 1 ? -3 : 0} ${stepPhase === 1 ? 6 : 0})`}>
                                <rect x="56" y="158" width="14" height="22" rx="2" fill="#2a3a4a" />
                                <rect x="57" y="159" width="12" height="20" rx="1.5" fill="#3a4a5a" />
                                <rect x="58" y="160" width="10" height="18" rx="1" fill="#4a5a6a" />
                            </g>
                            
                            <g transform={`translate(${stepPhase === 2 ? 3 : 0} ${stepPhase === 2 ? 6 : 0})`}>
                                <rect x="70" y="158" width="14" height="22" rx="2" fill="#2a3a4a" />
                                <rect x="71" y="159" width="12" height="20" rx="1.5" fill="#3a4a5a" />
                                <rect x="72" y="160" width="10" height="18" rx="1" fill="#4a5a6a" />
                            </g>
                            
                            {/* HIKING SHOES - realistic boots */}
                            <ellipse cx="63" cy="180" rx="10" ry="5" fill="#1a1a1a" />
                            <ellipse cx="63" cy="179" rx="9" ry="4.5" fill="#2a2a2a" />
                            <ellipse cx="63" cy="178" rx="8" ry="4" fill="#3a3a3a" />
                            <line x1="58" y1="179" x2="68" y2="179" stroke="#0a0a0a" strokeWidth="1.2" />
                            <line x1="60" y1="177" x2="66" y2="177" stroke="#4a4a4a" strokeWidth="0.8" opacity="0.6" />
                            
                            <ellipse cx="77" cy="180" rx="10" ry="5" fill="#1a1a1a" />
                            <ellipse cx="77" cy="179" rx="9" ry="4.5" fill="#2a2a2a" />
                            <ellipse cx="77" cy="178" rx="8" ry="4" fill="#3a3a3a" />
                            <line x1="72" y1="179" x2="82" y2="179" stroke="#0a0a0a" strokeWidth="1.2" />
                            <line x1="74" y1="177" x2="80" y2="177" stroke="#4a4a4a" strokeWidth="0.8" opacity="0.6" />
                        </svg>
                        
                        <div 
                            className="absolute left-1/2 -translate-x-1/2 rounded-full blur-2xl"
                            style={{ 
                                top: '175px',
                                width: '95px',
                                height: '24px',
                                background: 'radial-gradient(ellipse, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.35) 50%, transparent 100%)'
                            }}
                        />
                    </div>
    
                    {/* HUD - same as before */}
                    <div className="absolute top-4 left-4 right-4 z-50 flex justify-between items-start gap-3">
                        <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                            <div className="flex items-center gap-2 mb-1">
                            <Mountain className="w-4 h-4 text-emerald-400" />
                            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
                        </div>
                        <div className="text-3xl font-bold text-white">
                            {userData.altitude.toLocaleString()}
                            <span className="text-base text-slate-400 ml-1">m</span>
                        </div>
                        <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                            <div 
                                className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all duration-500 shadow-lg shadow-emerald-500/50"
                                style={{ width: `${progressPercent}%` }}
                            />
                        </div>
                        <div className="text-xs text-slate-400 mt-1">
                            {Math.round(progressPercent)}% to summit
                        </div>
                    </div>

                    <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                        <div className="flex items-center gap-2 mb-1">
                            <div className="w-3 h-3 rounded-full animate-pulse" style={{ backgroundColor: getOxygenColor(userData.oxygen) }} />
                            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
                        </div>
                        <div 
                            className="text-3xl font-bold transition-colors duration-500"
                            style={{ color: getOxygenColor(userData.oxygen) }}
                        >
                            {userData.oxygen}
                            <span className="text-base text-slate-400">%</span>
                        </div>
                        <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                            <div 
                                className="h-full transition-all duration-500"
                                style={{ 
                                    width: `${userData.oxygen}%`,
                                    backgroundColor: getOxygenColor(userData.oxygen),
                                    boxShadow: `0 0 10px ${getOxygenColor(userData.oxygen)}80`
                                }}
                            />
                        </div>
                        <div className="text-xs text-slate-400 mt-1">
                            {userData.oxygen >= 70 ? 'Strong' : userData.oxygen >= 50 ? 'Moderate' : userData.oxygen >= 30 ? 'Weak' : 'Critical'}
                        </div>
                    </div>
                </div>

                {/* Habit Buttons */}
                <div className="absolute left-4 right-4 z-50" style={{ bottom: '80px' }}>
                    <div className="bg-white/98 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
                        <div className="grid grid-cols-4 gap-3">
                            {habits.map((habit, index) => {
                                const Icon = habit.icon;
                                const colors = [
                                    { from: 'from-blue-500', to: 'to-cyan-500', glow: 'shadow-blue-500/50' },
                                    { from: 'from-indigo-500', to: 'to-purple-500', glow: 'shadow-indigo-500/50' },
                                    { from: 'from-green-500', to: 'to-emerald-500', glow: 'shadow-green-500/50' },
                                    { from: 'from-purple-500', to: 'to-pink-500', glow: 'shadow-purple-500/50' }
                                ];
                                const color = colors[index];
                                
                                return (
                                    <button
                                        key={habit.id}
                                        onClick={() => completeHabit(habit.id)}
                                        disabled={habit.completed || isClimbing}
                                        className={`
                                            relative aspect-square rounded-2xl transition-all duration-300 flex flex-col items-center justify-center gap-2
                                            ${habit.completed 
                                                ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95' 
                                                : `bg-gradient-to-br ${color.from} ${color.to} hover:scale-105 active:scale-95 shadow-xl ${color.glow}`
                                            }
                                            ${isClimbing && !habit.completed ? 'opacity-50 cursor-not-allowed' : ''}
                                        `}
                                    >
                                        {!habit.completed && (
                                            <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl" />
                                        )}
                                        
                                        <Icon 
                                            className={`w-7 h-7 ${habit.completed ? 'text-emerald-600' : 'text-white drop-shadow-lg'}`}
                                            strokeWidth={2.5}
                                        />
                                        <span className={`text-xs font-bold ${habit.completed ? 'text-emerald-700' : 'text-white drop-shadow'}`}>
                                            {habit.completed ? '✓ Done' : `+${habit.oxygen}%`}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                        
                        <div className="text-center mt-4 pt-3 border-t border-slate-200">
                            <div className="flex items-center justify-center gap-2">
                                <div className="flex gap-1">
                                    {habits.map((h, i) => (
                                        <div 
                                            key={i} 
                                            className={`w-2 h-2 rounded-full transition-all duration-300 ${
                                                h.completed ? 'bg-emerald-500 scale-125' : 'bg-slate-300'
                                            }`}
                                        />
                                    ))}
                                </div>
                                <span className="text-sm text-slate-600 font-medium ml-2">
                                    {habits.filter(h => h.completed).length} / 4 completed
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Milestone notification */}
                {userData.altitude >= 2000 && userData.altitude < 2270 && (
                    <div className="absolute top-1/3 left-1/2 -translate-x-1/2 z-50 animate-bounce">
                        <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl border-2 border-white/50">
                            🎯 2,000m Milestone!
                        </div>
                    </div>
                )}

                <style>{`
                    @keyframes cloudFloat {
                        0%, 100% { transform: translateY(0px) translateX(0px); }
                        25% { transform: translateY(-18px) translateX(12px); }
                        50% { transform: translateY(-10px) translateX(-12px); }
                        75% { transform: translateY(-22px) translateX(10px); }
                    }
                `}</style>
            </div>
        );
    };

    ReactDOM.render(<MountainView />, document.getElementById('root'));
</script>
</body>
</html>
