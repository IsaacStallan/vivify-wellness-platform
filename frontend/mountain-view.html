<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Vivify Mountain</title>

  <!-- Dev-only CDNs (fine for prototyping) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/pixi.js@8/dist/pixi.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    html,body{height:100%;background:#0b1220}
    body{margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
    .safe{padding-bottom:env(safe-area-inset-bottom)}
  </style>
</head>
<body>
  <div id="scene" class="w-screen h-screen"></div>
  <div id="hud"></div>

  <script type="text/babel">
    /* ---------------- ENV / THEME ---------------- */
    function envFromAltitude(alt){
      if (alt < 1000) return { 
        name:'Forest Base', top:'#6ea8da', bot:'#9fd0f1', snow:false,
        groundBase:'#8b7355', groundDark:'#6b5845', groundLight:'#b29f8b',
        trail:'#b8a58f', trailEdge:'#5a4f46'
      };
      if (alt < 2000) return { 
        name:'Mountain Trail', top:'#4b8ccb', bot:'#78b6e7', snow:false,
        groundBase:'#95887a', groundDark:'#75685a', groundLight:'#c2b7aa',
        trail:'#cdbba6', trailEdge:'#675c50'
      };
      if (alt < 3000) return { 
        name:'Alpine Zone', top:'#3c79bb', bot:'#5b9ad4', snow:true,
        groundBase:'#a5a59d', groundDark:'#85857d', groundLight:'#cfcfc7',
        trail:'#d9d7d1', trailEdge:'#6f7376'
      };
      return { 
        name:'Summit Ridge', top:'#2d68ab', bot:'#4a86c1', snow:true,
        groundBase:'#cfd4d9', groundDark:'#9aa2aa', groundLight:'#eef2f5',
        trail:'#f2f4f7', trailEdge:'#8a949e'
      };
    }

    /* ---------------- HUD ---------------- */
    const IconMountain=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>);
    const Drop =(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3.1S6 9.1 6 12.6a6 6 0 0 0 12 0C18 9.1 12 3.1 12 3.1z"/></svg>);
    const Moon =(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3a9 9 0 1 0 9 9 6 6 0 0 1-9-9Z"/></svg>);
    const Steps=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="7" cy="14" r="3"/><circle cx="17" cy="10" r="3"/></svg>);
    const Target=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>);

    function Hud(){
      const {useState, useMemo, useLayoutEffect, useEffect} = React;
      const [vw, setVw] = useState(window.innerWidth);
      const [vh, setVh] = useState(window.innerHeight);
      useEffect(()=>{ const onR=()=>{setVw(window.innerWidth); setVh(window.innerHeight)}; window.addEventListener('resize',onR); return ()=>window.removeEventListener('resize',onR);},[]);
      const isPhone = (vw < 420) || (vh < 740);

      const [data, setData] = useState({ altitude:1200, target:3776, oxygen:78 });
      const [climbing, setClimbing] = useState(false);
      const [habits, setHabits] = useState([
        { id:'water',  name:'Water',  icon:Drop,   oxygen:15, done:false },
        { id:'sleep',  name:'Sleep',  icon:Moon,   oxygen:20, done:false },
        { id:'move',   name:'Move',   icon:Steps,  oxygen:15, done:false },
        { id:'focus',  name:'Focus',  icon:Target, oxygen:20, done:false },
      ]);

      const env = useMemo(()=>envFromAltitude(data.altitude), [data.altitude]);
      useLayoutEffect(()=>{
        if (window.MountainAPI){
          window.MountainAPI.setSkyGradient(env.top, env.bot);
          window.MountainAPI.setSnowVisible(env.snow);
          window.MountainAPI.setGroundColors(env.groundBase, env.groundDark, env.groundLight, env.trail, env.trailEdge);
        }
      }, [env]);

      // seed progress at mount
      useLayoutEffect(()=>{
        window.MountainAPI?.setProgress(0);
      }, []);

      const progress = Math.min(100, (data.altitude / data.target) * 100);
      const oxyColor = data.oxygen >= 70 ? '#10b981' : data.oxygen >= 50 ? '#f59e0b' : data.oxygen >= 30 ? '#f97316' : '#ef4444';

      function completeHabit(h){
        if (h.done || climbing) return;
        setClimbing(true);

        const altitudeGain = 270;
        const pixels = 140; // world scroll per habit

        window.MountainAPI?.climbBy(pixels, 1.05);

        const tmp = { alt: data.altitude, p: window.__vivifyProgress || 0 };
        gsap.to(tmp, {
          alt: Math.min(data.altitude + altitudeGain, data.target),
          p:   Math.min(1, (data.altitude + altitudeGain - 1200) / (3776 - 1200)),
          duration: 1.05, ease:'power2.out',
          onUpdate: () => {
            setData(prev => ({...prev, altitude: tmp.alt}));
            window.MountainAPI?.setProgress(tmp.p);
          },
          onComplete: () => setClimbing(false)
        });

        setData(prev=>({...prev, oxygen: Math.min(prev.oxygen + h.oxygen, 100)}));
        setHabits(prev => prev.map(x => x.id===h.id ? {...x, done:true} : x));
      }

      return (
        <div className="pointer-events-none safe">
          {/* Top HUD */}
          <div className="absolute top-4 left-4 right-4 flex justify-between gap-3">
            <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
              <div className="flex items-center gap-2 mb-1">
                <IconMountain className="w-4 h-4 text-emerald-400"/>
                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
              </div>
              <div className="text-3xl font-bold text-white">
                {Math.round(data.altitude).toLocaleString()}<span className="text-base text-slate-400 ml-1">m</span>
              </div>
              <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                <div className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all" style={{width:`${progress}%`}}/>
              </div>
              <div className="text-xs text-slate-400 mt-1">{Math.round(progress)}% to summit</div>
            </div>

            <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
              <div className="flex items-center gap-2 mb-1">
                <div className="w-3 h-3 rounded-full animate-pulse" style={{backgroundColor:oxyColor}}/>
                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
              </div>
              <div className="text-3xl font-bold" style={{color:oxyColor}}>
                {Math.round(data.oxygen)}<span className="text-base text-slate-400">%</span>
              </div>
              <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                <div className="h-full transition-all" style={{width:`${data.oxygen}%`, backgroundColor:oxyColor, boxShadow:`0 0 10px ${oxyColor}80`}}/>
              </div>
              <div className="text-xs text-slate-400 mt-1">
                {data.oxygen>=70?'Strong':data.oxygen>=50?'Moderate':data.oxygen>=30?'Weak':'Critical'}
              </div>
            </div>
          </div>

          {/* Habit tray */}
          <div className="absolute left-4 right-4"
               style={{bottom: isPhone ? '16px' : '72px', transform: isPhone?'scale(0.92)':'scale(1)', transformOrigin:'center bottom'}}>
            <div className="pointer-events-auto bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
              <div className="grid grid-cols-4 gap-3">
                {habits.map((h,i)=>{
                  const Icon = h.icon;
                  const colors = [
                    ['from-blue-500','to-cyan-500','shadow-blue-500/50'],
                    ['from-indigo-500','to-purple-500','shadow-indigo-500/50'],
                    ['from-green-500','to-emerald-500','shadow-green-500/50'],
                    ['from-purple-500','to-pink-500','shadow-purple-500/50'],
                  ][i];
                  return (
                    <button key={h.id} onClick={()=>completeHabit(h)} disabled={h.done||climbing}
                      className={`relative aspect-square rounded-2xl transition-all flex flex-col items-center justify-center gap-2
                        ${h.done
                          ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95'
                          : `bg-gradient-to-br ${colors[0]} ${colors[1]} hover:scale-105 active:scale-95 shadow-xl ${colors[2]}`
                        } ${climbing&&!h.done?'opacity-50 cursor-not-allowed':''}`}>
                      {!h.done && <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl"/>}
                      <Icon className={`w-7 h-7 ${h.done?'text-emerald-700':'text-white drop-shadow'}`}/>
                      <span className={`text-xs font-bold ${h.done?'text-emerald-700':'text-white'}`}>{h.done?'✓ Done':`+${h.oxygen}%`}</span>
                    </button>
                  );
                })}
              </div>
              <div className="text-center mt-4 pt-3 border-t border-slate-200">
                <div className="flex items-center justify-center gap-2">
                  <div className="flex gap-1">
                    {habits.map((h,i)=>(<div key={i} className={`w-2 h-2 rounded-full ${h.done?'bg-emerald-500 scale-125':'bg-slate-300'}`}/>))}
                  </div>
                  <span className="text-sm text-slate-600 font-medium ml-2">
                    {habits.filter(x=>x.done).length} / 4 completed
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ---------------- PIXI SCENE ---------------- */
    (async () => {
      const sceneEl = document.getElementById('scene');
      const DPR = Math.max(1, window.devicePixelRatio || 1);

      // robust hex helper
      const hex = (c) => {
        if (typeof c === 'number') return c;
        if (!c) return 0x000000;
        let s = String(c).trim();
        if (s[0] === '#') s = s.slice(1);
        if (s.length === 3) s = s.split('').map(ch => ch + ch).join('');
        return parseInt(s, 16);
      };

      window.__vivifyProgress = 0;

      const app = new PIXI.Application();
      await app.init({ resizeTo: sceneEl, antialias:true, backgroundAlpha:1, powerPreference:'high-performance', autoDensity:true });
      sceneEl.appendChild(app.canvas);
      app.stage.sortableChildren = true;

      // Layers
      const skyLayer   = new PIXI.Container(); skyLayer.zIndex = 0;
      const groundLayer= new PIXI.Container(); groundLayer.zIndex = 1; // static ground background (below world items)
      const worldLayer = new PIXI.Container(); worldLayer.zIndex = 2;  // scrolls (trail/rocks/trees)
      const actorLayer = new PIXI.Container(); actorLayer.zIndex = 3;  // avatar
      const fxLayer    = new PIXI.Container(); fxLayer.zIndex = 4;
      app.stage.addChild(skyLayer, groundLayer, worldLayer, actorLayer, fxLayer);

      /* ---------- SKY (never covers ground) ---------- */
      let currentTop = '#4b8ccb', currentBot = '#78b6e7';
      let sky, clouds;

      function gradientSprite(w,h,top,bottom){
        const cont = new PIXI.Container();
        const r1 = new PIXI.Graphics(); r1.beginFill(hex(top)).drawRect(0,0,w,h).endFill();
        const r2 = new PIXI.Graphics(); r2.beginFill(hex(bottom)).drawRect(0,h*0.35,w,h).endFill(); r2.alpha=0.9;
        cont.addChild(r1,r2);
        const tex = app.renderer.generateTexture(cont,{resolution:DPR,region:new PIXI.Rectangle(0,0,w,h)});
        return new PIXI.Sprite(tex);
      }

      // horizon split
      function horizonY(){ return app.renderer.height * 0.52; }

      function makeCloudTex() {
        const c = new PIXI.Container();
        const puff = (x, y, r, a=1) => {
          const g = new PIXI.Graphics();
          g.beginFill(0xffffff, a).drawCircle(x, y, r).endFill();
          c.addChild(g);
        };
        puff(0,0,26,0.9); puff(20,-6,20,0.85); puff(-20,-4,18,0.85); puff(40,2,16,0.8); puff(-36,2,14,0.8);
        return app.renderer.generateTexture(c, { resolution: DPR });
      }
      const cloudTex = makeCloudTex();

      function spawnCloud(y, scale, speed) {
        const s = new PIXI.Sprite(cloudTex);
        s.anchor.set(0.5);
        s.y = y; s.x = -120;
        s.scale.set(scale);
        s.alpha = 0.35;
        clouds.addChild(s);
        gsap.to(s, {
          x: app.renderer.width + 120,
          duration: (app.renderer.width + 240) / speed,
          ease: "none",
          onComplete: () => { clouds.removeChild(s); s.destroy(); spawnCloud(y, scale, speed); }
        });
      }

      function rebuildSky(){
        skyLayer.removeChildren();

        const w=app.renderer.width, h=app.renderer.height;
        const skyHeight = Math.floor(horizonY()); // only to horizon
        sky = gradientSprite(w, skyHeight, currentTop, currentBot);
        skyLayer.addChild(sky);

        // distant silhouettes (clipped to sky)
        const mask = new PIXI.Graphics(); mask.beginFill(0xffffff).drawRect(0,0,w,skyHeight).endFill();
        const silhouettes = new PIXI.Container(); silhouettes.mask = mask;
        skyLayer.addChild(silhouettes, mask);

        const addSilhouette=(color, yy, width, height, offset=0, alpha=0.35)=>{
          const g = new PIXI.Graphics();
          g.beginFill(hex(color));
          g.moveTo(-200+offset, yy + height*0.85);
          g.lineTo( width*0.15+offset, yy + height*0.55);
          g.lineTo( width*0.30+offset, yy + height*0.35);
          g.lineTo( width*0.45+offset, yy + height*0.60);
          g.lineTo( width*0.70+offset, yy + height*0.30);
          g.lineTo( width*0.90+offset, yy + height*0.55);
          g.lineTo( width*1.10+offset, yy + height*0.85);
          g.closePath().endFill();
          g.alpha = alpha;
          g.filters = [new PIXI.BlurFilter({strength:1.2})];
          silhouettes.addChild(g);
        };
        addSilhouette('#2b4f75', skyHeight*0.35, w*0.9,  skyHeight*0.50, -140, 0.32);
        addSilhouette('#35608d', skyHeight*0.40, w,      skyHeight*0.55,   90,  0.28);

        // sun (in sky only)
        const sun = new PIXI.Graphics();
        sun.beginFill(0xfff2b2, 0.9).drawCircle(0, 0, 58).endFill();
        sun.position.set(w*0.82, skyHeight*0.42);
        sun.alpha = 0.8;
        sun.filters = [new PIXI.BlurFilter({ strength: 2 })];
        silhouettes.addChild(sun);

        // clouds
        clouds = new PIXI.Container(); silhouettes.addChild(clouds);
        spawnCloud(skyHeight*0.35, 1.2, 22);
        spawnCloud(skyHeight*0.50, 1.0, 28);
        spawnCloud(skyHeight*0.65, 0.85, 34);
      }

      /* ---------- GROUND & TRAIL (static base) ---------- */
      let currentGroundBase='#95887a', currentGroundDark='#75685a', currentGroundLight='#c2b7aa';
      let currentTrail='#cdbba6', currentTrailEdge='#675c50';

      const ground = new PIXI.Graphics(); groundLayer.addChild(ground);

      const trailContainer = new PIXI.Container(); worldLayer.addChild(trailContainer);
      const trailShape = new PIXI.Graphics(); trailContainer.addChild(trailShape);
      const trailEdge  = new PIXI.Graphics(); trailContainer.addChild(trailEdge);
      const trailNoiseTS = new PIXI.TilingSprite({ texture: PIXI.Texture.WHITE, width: 64, height: 64 }); 
      trailNoiseTS.alpha = 0.08; trailContainer.addChild(trailNoiseTS);

      // ground textures (noise + contours), masked to ground polygon
      const groundMask = new PIXI.Graphics(); groundLayer.addChild(groundMask);
      const groundNoiseTS = new PIXI.TilingSprite({ texture: PIXI.Texture.WHITE, width: 64, height: 64 }); groundLayer.addChild(groundNoiseTS);
      const groundContourTS = new PIXI.TilingSprite({ texture: PIXI.Texture.WHITE, width: 64, height: 64 }); groundLayer.addChild(groundContourTS);
      groundNoiseTS.alpha = 0.15; groundNoiseTS.blendMode = 'multiply';
      groundContourTS.alpha = 0.25; groundContourTS.tint = 0x000000;
      groundNoiseTS.mask = groundMask; groundContourTS.mask = groundMask;

      function makeNoiseTex(size=64, dots=70){
        const g = new PIXI.Graphics();
        for(let i=0;i<dots;i++){
          const a = 0.04 + Math.random()*0.06;
          const r = 0.8 + Math.random()*1.6;
          const x = Math.random()*size, y = Math.random()*size;
          g.beginFill(0x000000,a).drawCircle(x,y,r).endFill();
        }
        return app.renderer.generateTexture(g,{resolution:DPR,region:new PIXI.Rectangle(0,0,size,size)});
      }
      function makeContourTex(size=64, step=8){
        const g = new PIXI.Graphics();
        g.lineStyle(1,0xffffff,0.08);
        for(let y=0;y<size;y+=step){ g.moveTo(0,y); g.lineTo(size,y); }
        return app.renderer.generateTexture(g,{resolution:DPR,region:new PIXI.Rectangle(0,0,size,size)});
      }
      const groundNoiseTex = makeNoiseTex(64,70);
      const groundContourTex = makeContourTex(64,8);
      groundNoiseTS.texture = groundNoiseTex;
      groundContourTS.texture = groundContourTex;

      // compute slope top line and draw ground polygon
      function drawGroundAndTrail(){
        const w=app.renderer.width, h=app.renderer.height;
        const H = horizonY();

        // --- ground base ---
        const x1 = -600, y1 = H + 70;        // top-left of ground band
        const x2 = w + 600, y2 = H - 70;     // top-right of ground band
        ground.clear().beginFill(hex(currentGroundBase))
              .moveTo(x1,y1).lineTo(x2,y2).lineTo(x2,h+600).lineTo(x1,h+600)
              .closePath().endFill();

        groundMask.clear().beginFill(0xffffff)
              .moveTo(x1,y1).lineTo(x2,y2).lineTo(x2,h+600).lineTo(x1,h+600)
              .closePath().endFill();

        groundNoiseTS.width = w*2; groundNoiseTS.height = h*2;
        groundContourTS.width = w*2; groundContourTS.height = h*2;

        // --- trail band (diagonal, on top of ground) ---
        // vector along top edge
        const dx = (x2-x1), dy = (y2-y1); 
        const len = Math.hypot(dx,dy); 
        const ux = dx/len, uy = dy/len;               // unit along
        const nx = -uy, ny = ux;                      // unit normal (downhill)
        const offset = 110;                           // distance below the top edge
        const width  = 140;                           // trail thickness

        // start & end of trail centerline (trim a bit so it stays on screen)
        const trim = 220;
        const cx1 = x1 + ux*trim + nx*offset;
        const cy1 = y1 + uy*trim + ny*offset;
        const cx2 = x2 - ux*trim + nx*offset;
        const cy2 = y2 - uy*trim + ny*offset;

        // polygon points (left/right edges are ± width/2 along the normal)
        const lw = -width/2, rw = width/2;
        const p1x = cx1 + nx*lw, p1y = cy1 + ny*lw;
        const p2x = cx2 + nx*lw, p2y = cy2 + ny*lw;
        const p3x = cx2 + nx*rw, p3y = cy2 + ny*rw;
        const p4x = cx1 + nx*rw, p4y = cy1 + ny*rw;

        trailShape.clear()
          .beginFill(hex(currentTrail), 0.95)
          .drawPolygon([p1x,p1y, p2x,p2y, p3x,p3y, p4x,p4y])
          .endFill();

        // edges for readability
        trailEdge.clear()
          .lineStyle(3, hex(currentTrailEdge), 0.35)
          .moveTo(p1x,p1y).lineTo(p2x,p2y)
          .moveTo(p4x,p4y).lineTo(p3x,p3y);

        // subtle trail grain
        const trailNoiseTex = makeNoiseTex(64, 40);
        trailNoiseTS.texture = trailNoiseTex;
        trailNoiseTS.width = w*2; trailNoiseTS.height = h*2;

        // keep trail with world scroll (it lives in worldLayer already)
      }

      /* ---------- WORLD OBJECTS (biased off the trail) ---------- */
      const objects = new PIXI.Container(); worldLayer.addChild(objects);
      const worldHeight = 9000;

      function treeTexture(){
        const c=new PIXI.Container();
        const trunk=new PIXI.Graphics();
        trunk.beginFill(0x5c3d2e).drawRoundedRect(-6,18,12,34,3).endFill();
        trunk.lineStyle(1,0x4a2f24,0.6).moveTo(-3,20).lineTo(-3,48).moveTo(3,20).lineTo(3,48); c.addChild(trunk);
        const greens=[0x0f6a3b,0x147a45,0x199951,0x25a35c,0x30b168,0x3bc174,0x45cf80];
        let y=18,r=30;
        greens.forEach((col,i)=>{
          const g=new PIXI.Graphics();
          g.beginFill(col).drawEllipse(0,y-(i*9), r-(i*3), 12).endFill();
          g.beginFill(0xffffff,0.06).drawEllipse(-6,y-(i*9)-2, (r-(i*3))*0.7, 6).endFill();
          c.addChild(g);
        });
        const moss=new PIXI.Graphics(); moss.beginFill(0x6bbf59,0.5).drawCircle(-8,32,3).drawCircle(6,26,2.5).endFill(); c.addChild(moss);
        return app.renderer.generateTexture(c,{resolution:DPR});
      }
      function rockTexture(){
        const g=new PIXI.Graphics();
        g.beginFill(hex(currentGroundDark)).drawRoundedRect(-24,-12,48,24,10).endFill();
        g.beginFill(hex(currentGroundBase),0.85).drawRoundedRect(-18,-10,36,20,8).endFill();
        g.beginFill(hex(currentGroundLight),0.6).drawRoundedRect(-14,-8,28,16,6).endFill();
        g.lineStyle(2,hex(currentGroundDark),0.6).moveTo(-10,-4).lineTo(2,-1).lineTo(14,-6);
        g.lineStyle(2,hex(currentGroundDark),0.4).moveTo(-14,6).lineTo(6,4);
        g.beginFill(0xa1c36d,0.45).drawCircle(-8,-2,2).drawCircle(10,0,1.8).endFill();
        return app.renderer.generateTexture(g,{resolution:DPR});
      }
      let treeTex = treeTexture();
      let rockTex = rockTexture();

      const terrainObjects=[];
      function rebuildObjects(){
        objects.removeChildren(); terrainObjects.length = 0;
        const w=app.renderer.width, h=app.renderer.height;
        const H=horizonY();

        for(let i=0;i<40;i++){
          const isTree=Math.random()>0.35;
          const spr=new PIXI.Sprite(isTree?treeTex:rockTex);
          spr.anchor.set(0.5,1);

          const wy=(i/40)*worldHeight + Math.random()*200;

          // bias X away from the trail band: pick left or right side cluster
          const left  = w*0.18 + Math.random()*w*0.18;
          const right = w*0.64 + Math.random()*w*0.18;
          const baseX = Math.random()<0.5 ? left : right;

          spr.position.set(baseX, (h*0.46 - wy)); // same vertical mapping as before
          objects.addChild(spr);
          terrainObjects.push({ spr, wy, baseX, side: (Math.random() - 0.5) * 2 });
        }
      }

      /* ---------- AVATAR ---------- */
      const avatar = new PIXI.Container(); actorLayer.addChild(avatar);
      function placeAvatar(){
        const w=app.renderer.width,h=app.renderer.height;
        avatar.x = w*0.5;
        avatar.y = (w<420||h<740)? h*0.50 : h*0.58;
      }
      const sh = new PIXI.Graphics(); sh.beginFill(0x000000,0.28).drawEllipse(0,32,22,7).endFill(); sh.y+=6; avatar.addChild(sh);
      const pack = new PIXI.Graphics();
      pack.beginFill(0x1e4d7a).drawRoundedRect(-15,-22,30,44,8).endFill();
      pack.beginFill(0x245a8f).drawRoundedRect(-12,-20,24,32,6).endFill();
      pack.beginFill(0x1e4d7a).drawRoundedRect(-18,-6,10,16,4).endFill();
      pack.beginFill(0x1e4d7a).drawRoundedRect(  8,-6,10,16,4).endFill();
      pack.beginFill(0x6aa7d6).drawRoundedRect(-18,-30,36,10,5).endFill();
      pack.lineStyle(2,0x184469,1).moveTo(-12,-14).lineTo(-12,12).moveTo(12,-14).lineTo(12,12);
      avatar.addChild(pack);

      const jacket = new PIXI.Graphics();
      jacket.beginFill(0x2d72b8).drawRoundedRect(-20,-28,40,56,10).endFill();
      jacket.lineStyle(2,0x1a5c8a,1).moveTo(0,-26).lineTo(0,26).moveTo(-10,-5).lineTo(-10,10).moveTo(10,-5).lineTo(10,10);
      jacket.beginFill(0x3d82c8,0.25).drawRoundedRect(-20,-10,40,20,6).endFill();
      jacket.lineStyle(2.5,0x123e63,0.9).drawRoundedRect(-20,-28,40,56,10);
      jacket.lineStyle(1.6,0x1a5c8a,0.8).moveTo(-12,-10).lineTo(-20,6).moveTo(12,-10).lineTo(20,6);
      avatar.addChild(jacket);

      const web = new PIXI.Graphics();
      web.lineStyle(2,0x173a5c,0.9).moveTo(-10,-18).lineTo(-16,0).moveTo(10,-18).lineTo(16,0).moveTo(-6,4).lineTo(6,4);
      avatar.addChild(web);

      const shade = new PIXI.Graphics(); shade.beginFill(0x000000,0.12).drawRoundedRect(-20,-6,40,18,6).endFill();
      shade.filters=[new PIXI.BlurFilter({strength:1})]; avatar.addChild(shade);

      const armL = new PIXI.Graphics(); armL.beginFill(0x2d72b8).drawEllipse(-22,2,6,16).endFill();
      const armR = new PIXI.Graphics(); armR.beginFill(0x2d72b8).drawEllipse( 22,2,6,16).endFill();
      const gloveL=new PIXI.Graphics(); gloveL.beginFill(0x222222).drawCircle(-22,15,5).endFill();
      const gloveR=new PIXI.Graphics(); gloveR.beginFill(0x222222).drawCircle( 22,15,5).endFill();
      avatar.addChild(armL,armR,gloveL,gloveR);

      const head = new PIXI.Graphics(); head.beginFill(0xe0b080).drawEllipse(0,-38,11,9).endFill();
      const beanieBase=new PIXI.Graphics(); beanieBase.beginFill(0xc83838).drawEllipse(0,-42,14,10).endFill();
      const beanieBand=new PIXI.Graphics(); beanieBand.beginFill(0xe84848).drawRoundedRect(-14,-39,28,6,3).endFill();
      const strap=new PIXI.Graphics(); strap.beginFill(0x111111,0.9).drawEllipse(0,-38,10,3).endFill();
      const pom=new PIXI.Graphics(); pom.beginFill(0xe84848).drawCircle(0,-50,3.5).endFill();
      avatar.addChild(head,beanieBase,beanieBand,strap,pom);

      const legL = new PIXI.Graphics(); legL.beginFill(0x2a3a48).drawRoundedRect(-16,26,12,16,2).endFill();
      const legR = new PIXI.Graphics(); legR.beginFill(0x2a3a48).drawRoundedRect(4,26,12,16,2).endFill();
      const bootL=new PIXI.Graphics(); bootL.beginFill(0x353535).drawEllipse(-10,42,8,3).endFill();
      const bootR=new PIXI.Graphics(); bootR.beginFill(0x353535).drawEllipse(10,42,8,3).endFill();
      avatar.addChild(legL,legR,bootL,bootR);

      const poleL=new PIXI.Graphics(); poleL.lineStyle(3,0x444444).moveTo(-28,6).lineTo(-28,36); poleL.beginFill(0x222222).drawCircle(-28,36,4).endFill();
      const poleR=new PIXI.Graphics(); poleR.lineStyle(3,0x444444).moveTo( 28,6).lineTo( 28,36); poleR.beginFill(0x222222).drawCircle( 28,36,4).endFill();
      poleL.alpha=0; poleR.alpha=0; avatar.addChild(poleL,poleR);

      placeAvatar();

      /* ---------- World scroll & animation ---------- */
      let worldOffset = 0;
      function applyWorldOffset(){ worldLayer.y = worldOffset; }

      // snow (optional; toggled by env)
      const snow = new PIXI.ParticleContainer(300, { scale:true, alpha:true, position:true }); fxLayer.addChild(snow);
      const snowTex = PIXI.Texture.from('data:image/svg+xml;charset=utf8,<svg xmlns="http://www.w3.org/2000/svg" width="6" height="6"><circle cx="3" cy="3" r="3" fill="white"/></svg>');
      const flakes=[];
      for(let i=0;i<160;i++){
        const s=new PIXI.Sprite(snowTex); s.x=Math.random()*app.renderer.width; s.y=Math.random()*app.renderer.height; s.alpha=0.5+Math.random()*0.5; s.scale.set(0.4+Math.random()*0.9);
        snow.addParticle(s); flakes.push({spr:s, vy:0.4+Math.random()*0.8, sway:Math.random()*1.2});
      }

      function stepCycle(duration=1.05){
        const tl=gsap.timeline({defaults:{ease:'power2.inOut'}});
        tl.to(legL,{y:22,duration:duration*0.25},0)
          .to(legR,{y:30,duration:duration*0.25},0)
          .to(bootL,{y:38,duration:duration*0.25},0)
          .to(bootR,{y:44,duration:duration*0.25},0)
          .to(poleR,{alpha:1,duration:duration*0.20},0)
          .to(poleL,{alpha:0,duration:duration*0.20},0)
          .to(legL,{y:30,duration:duration*0.25},duration*0.25)
          .to(legR,{y:22,duration:duration*0.25},duration*0.25)
          .to(bootL,{y:44,duration:duration*0.25},duration*0.25)
          .to(bootR,{y:38,duration:duration*0.25},duration*0.25)
          .to(poleR,{alpha:0,duration:duration*0.20},duration*0.25)
          .to(poleL,{alpha:1,duration:duration*0.20},duration*0.25);
      }

      let t=0;
      app.ticker.add((delta)=>{
        t += delta/60;

        // snow drift
        for(const f of flakes){
          f.spr.y += f.vy * delta;
          f.spr.x += Math.sin((f.spr.y + t*20) * 0.01) * f.sway * 0.3;
          if (f.spr.y > app.renderer.height) { f.spr.y=-10; f.spr.x=Math.random()*app.renderer.width; }
        }

        // slight texture drift
        groundNoiseTS.tilePosition.x -= 0.08*delta;
        groundNoiseTS.tilePosition.y += 0.04*delta;
        groundContourTS.tilePosition.y += 0.06*delta;
        trailNoiseTS.tilePosition.x -= 0.06*delta;

        // perspective for objects
        const h = app.renderer.height;
        for (const o of terrainObjects) {
          const screenY = (h * 0.46 - o.wy) + worldOffset;
          const depth = Math.min(1, Math.max(0, (screenY - h*0.25) / (h*0.65)));
          const s = 0.6 + depth * 0.7;
          o.spr.scale.set(s);
          o.spr.alpha = 0.35 + depth * 0.65;
          o.spr.x = o.baseX + o.side * depth * 18;
          o.spr.y = screenY;
        }
      });

      /* ---------- Layout / Resize ---------- */
      function layout(){
        rebuildSky();
        drawGroundAndTrail();
        placeAvatar();
        rebuildObjects();
        applyWorldOffset();
      }
      window.addEventListener('resize', layout);
      layout();

      /* ---------- Public API ---------- */
      const MountainAPI = {
        climbBy(pixels, duration=1.05){
          stepCycle(duration);
          gsap.to({off:worldOffset}, {
            off: worldOffset + pixels,
            duration,
            ease:'power2.out',
            onUpdate(){ worldOffset = this.targets()[0].off; applyWorldOffset(); }
          });
          gsap.fromTo(avatar,{y:avatar.y+4, skewY:-0.06},{y:avatar.y, skewY:0, duration:duration*0.5, ease:'power2.out'});
        },
        setSkyGradient(top,bottom){ currentTop=top; currentBot=bottom; rebuildSky(); },
        setSnowVisible(v){ snow.visible = !!v; },
        setGroundColors(base,dark,light,trail,trailEdge){
          currentGroundBase=base; currentGroundDark=dark; currentGroundLight=light;
          currentTrail=trail; currentTrailEdge=trailEdge;
          drawGroundAndTrail();
          treeTex.destroy(true); rockTex.destroy(true);
          treeTex = treeTexture(); rockTex = rockTexture();
          rebuildObjects();
        },
        setProgress(p){ window.__vivifyProgress = Math.max(0, Math.min(1, p)); }
      };
      window.MountainAPI = MountainAPI;

      // Mount HUD after API is ready
      ReactDOM.createRoot(document.getElementById('hud')).render(React.createElement(Hud));
    })();
  </script>
</body>
</html>
