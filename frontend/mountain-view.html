<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivify - Mountain View</title>
    
    <!-- Load React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
    
        // Icons
        const Mountain = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
            </svg>
        );
    
        const Droplets = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
                <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
            </svg>
        );
    
        const Moon = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );
    
        const Footprints = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
                <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
            </svg>
        );
    
        const Target = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );
    
        const MountainView = () => {
            const [userData, setUserData] = useState({
                altitude: 1200,
                targetAltitude: 3776,
                oxygen: 78,
                mountainName: 'Mt. Fuji'
            });
    
            const [habits, setHabits] = useState([
                { id: 'hydration', name: 'Water', icon: Droplets, completed: false, oxygen: 15 },
                { id: 'sleep', name: 'Sleep', icon: Moon, completed: false, oxygen: 20 },
                { id: 'movement', name: 'Move', icon: Footprints, completed: false, oxygen: 15 },
                { id: 'focus', name: 'Focus', icon: Target, completed: false, oxygen: 20 }
            ]);
    
            const [mountainScroll, setMountainScroll] = useState(0);
            const [isClimbing, setIsClimbing] = useState(false);
            const [leftLegForward, setLeftLegForward] = useState(false);
            const [armSwing, setArmSwing] = useState(0);
    
            const progressPercent = (userData.altitude / userData.targetAltitude) * 100;
    
            const getEnvironment = (alt) => {
                if (alt < 1000) return {
                    name: 'Forest Base',
                    skyTop: '#4A90E2',
                    skyBot: '#87CEEB',
                    slopeColor: '#6b8b47',
                    slopeDark: '#556b2f',
                    hasForest: true,
                    hasCity: true,
                    rockDensity: 'low'
                };
                if (alt < 2000) return {
                    name: 'Mountain Trail',
                    skyTop: '#3A7BC8',
                    skyBot: '#6BA3D4',
                    slopeColor: '#7a6f5d',
                    slopeDark: '#5d513f',
                    hasForest: true,
                    hasCity: false,
                    rockDensity: 'medium'
                };
                if (alt < 3000) return {
                    name: 'Alpine Zone',
                    skyTop: '#2E5F8A',
                    skyBot: '#4A8AB8',
                    slopeColor: '#8b8680',
                    slopeDark: '#6b6660',
                    hasForest: false,
                    hasCity: false,
                    rockDensity: 'high'
                };
                return {
                    name: 'Summit Ridge',
                    skyTop: '#1E4F7A',
                    skyBot: '#2E5F8A',
                    slopeColor: '#d0d8e0',
                    slopeDark: '#a0a8b0',
                    hasForest: false,
                    hasCity: false,
                    rockDensity: 'sparse'
                };
            };
    
            const env = getEnvironment(userData.altitude);
    
            const completeHabit = (habitId) => {
                const habit = habits.find(h => h.id === habitId);
                if (habit.completed || isClimbing) return;
    
                setIsClimbing(true);
                
                let frame = 0;
                const totalFrames = 24;
                
                const walkInterval = setInterval(() => {
                    frame++;
                    
                    // Scroll mountain downward (character climbs up)
                    setMountainScroll(prev => prev + 3.5);
                    
                    // Alternate legs every 6 frames
                    if (frame % 6 === 0) {
                        setLeftLegForward(prev => !prev);
                    }
                    
                    // Arm swing
                    setArmSwing(Math.sin(frame * 0.5) * 8);
                    
                    if (frame >= totalFrames) {
                        clearInterval(walkInterval);
                        
                        setUserData(prev => ({
                            ...prev,
                            altitude: Math.min(prev.altitude + 270, prev.targetAltitude),
                            oxygen: Math.min(prev.oxygen + habit.oxygen, 100)
                        }));
    
                        setHabits(prev => prev.map(h => 
                            h.id === habitId ? { ...h, completed: true } : h
                        ));
                        
                        setIsClimbing(false);
                        setArmSwing(0);
                    }
                }, 40);
            };
    
            const getOxygenColor = (oxygen) => {
                if (oxygen >= 70) return '#10b981';
                if (oxygen >= 50) return '#f59e0b';
                if (oxygen >= 30) return '#f97316';
                return '#ef4444';
            };
    
            // Generate terrain elements based on altitude
            const generateTerrain = () => {
                const elements = [];
                for (let i = 0; i < 45; i++) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const y = 200 + i * 90;
                    const x = side * (120 + Math.random() * 200);
                    
                    let type = 'rock';
                    if (env.hasForest && Math.random() > 0.4) type = 'tree';
                    if (env.rockDensity === 'high') type = 'rock';
                    
                    elements.push({
                        id: i,
                        x: x,
                        y: y,
                        type: type,
                        size: 0.8 + Math.random() * 0.6,
                        variant: Math.floor(Math.random() * 3)
                    });
                }
                return elements;
            };
    
            const [terrain] = useState(generateTerrain());
    
            return (
                <div className="relative w-full h-screen overflow-hidden" style={{
                    background: `linear-gradient(to bottom, ${env.skyTop} 0%, ${env.skyBot} 100%)`
                }}>
                    
                    {/* Sun */}
                    <div className="absolute w-48 h-48 rounded-full" style={{
                        top: '8%',
                        right: '12%',
                        background: 'radial-gradient(circle, #fffef5 0%, #fff9c4 25%, #ffeb3b 55%, #ffa726 100%)',
                        boxShadow: '0 0 120px rgba(255, 235, 59, 0.6)',
                        opacity: 0.95
                    }} />
    
                    {/* Distant city/forest at base (only low altitude) */}
                    {userData.altitude < 1500 && (
                        <div className="absolute bottom-0 left-0 right-0 opacity-30" style={{
                            height: '20%',
                            background: 'linear-gradient(to top, #2d3748 0%, transparent 100%)'
                        }}>
                            {/* Simplified city skyline */}
                            {[...Array(20)].map((_, i) => (
                                <div key={i} style={{
                                    position: 'absolute',
                                    bottom: 0,
                                    left: `${i * 5}%`,
                                    width: `${20 + Math.random() * 30}px`,
                                    height: `${30 + Math.random() * 60}px`,
                                    background: '#1a202c',
                                    opacity: 0.6
                                }} />
                            ))}
                        </div>
                    )}
    
                    {/* Mountain slope surface - scrolls down as you climb */}
                    <div 
                        className="absolute inset-0"
                        style={{
                            transform: `translateY(${mountainScroll}px)`,
                            transition: 'none'
                        }}
                    >
                        {/* Main mountain slope with detailed texture */}
                        <svg width="100%" height="200%" className="absolute" style={{ top: '-50%' }} preserveAspectRatio="none">
                            <defs>
                                {/* Realistic rock/dirt texture */}
                                <pattern id="mountainTexture" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                                    <rect width="80" height="80" fill={env.slopeColor} />
                                    {/* Detailed rock patterns */}
                                    <circle cx="15" cy="15" r="6" fill={env.slopeDark} opacity="0.3" />
                                    <circle cx="50" cy="25" r="8" fill={env.slopeDark} opacity="0.25" />
                                    <circle cx="30" cy="55" r="5" fill={env.slopeDark} opacity="0.35" />
                                    <circle cx="65" cy="60" r="7" fill={env.slopeDark} opacity="0.28" />
                                    <ellipse cx="20" cy="40" rx="8" ry="4" fill={env.slopeDark} opacity="0.2" />
                                    <ellipse cx="55" cy="12" rx="6" ry="3" fill={env.slopeDark} opacity="0.22" />
                                    <path d="M10,20 L15,18 L12,23 Z" fill={env.slopeDark} opacity="0.3" />
                                    <path d="M60,45 L67,42 L63,50 Z" fill={env.slopeDark} opacity="0.25" />
                                </pattern>
                                
                                <linearGradient id="slopeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stopColor={env.slopeDark} stopOpacity="0.4" />
                                    <stop offset="50%" stopColor={env.slopeColor} stopOpacity="0.1" />
                                    <stop offset="100%" stopColor={env.slopeDark} stopOpacity="0.4" />
                                </linearGradient>
                            </defs>
                            
                            {/* Mountain slope surface */}
                            <rect width="100%" height="100%" fill="url(#mountainTexture)" />
                            <rect width="100%" height="100%" fill="url(#slopeGradient)" />
                            
                            {/* Terrain contour lines for depth */}
                            {[...Array(25)].map((_, i) => (
                                <line 
                                    key={i}
                                    x1="0" 
                                    y1={i * 120} 
                                    x2="100%" 
                                    y2={i * 120}
                                    stroke={env.slopeDark}
                                    strokeWidth="2"
                                    opacity="0.15"
                                    strokeDasharray="15,10"
                                />
                            ))}
                        </svg>
    
                        {/* Terrain objects (trees, rocks) */}
                        {terrain.map((obj) => {
                            const scale = Math.max(0.5, 1 - ((obj.y - mountainScroll) / 3500));
                            const opacity = scale > 0.6 ? 1 : scale * 1.5;
                            
                            let element = null;
    
                            if (obj.type === 'tree' && env.hasForest) {
                                // ULTRA DETAILED TREE
                                element = (
                                    <svg width={60 * obj.size} height={85 * obj.size} viewBox="0 0 60 85">
                                        {/* Detailed trunk with bark texture */}
                                        <rect x="24" y="62" width="12" height="23" fill="#3e2723" />
                                        <rect x="25" y="63" width="10" height="21" fill="#4a3728" />
                                        <rect x="26" y="64" width="8" height="19" fill="#5d4037" />
                                        
                                        {/* Bark detail lines */}
                                        <line x1="26" y1="66" x2="26" y2="82" stroke="#3e2723" strokeWidth="0.8" opacity="0.6" />
                                        <line x1="28" y1="65" x2="28" y2="83" stroke="#3e2723" strokeWidth="0.6" opacity="0.5" />
                                        <line x1="32" y1="66" x2="32" y2="81" stroke="#3e2723" strokeWidth="0.7" opacity="0.55" />
                                        
                                        {/* Knots and imperfections */}
                                        <ellipse cx="29" cy="72" rx="1.5" ry="2" fill="#2d1b14" opacity="0.7" />
                                        <ellipse cx="31" cy="78" rx="1.2" ry="1.8" fill="#2d1b14" opacity="0.6" />
                                        
                                        {/* Highly detailed foliage - multiple layers */}
                                        <ellipse cx="30" cy="55" rx="26" ry="22" fill="#1a4d1a" />
                                        <ellipse cx="30" cy="48" rx="23" ry="19" fill="#1e5a1e" />
                                        <ellipse cx="30" cy="42" rx="20" ry="17" fill="#256b25" />
                                        <ellipse cx="30" cy="36" rx="17" ry="15" fill="#2d7a2d" />
                                        <ellipse cx="30" cy="31" rx="14" ry="12" fill="#358a35" />
                                        <ellipse cx="30" cy="26" rx="11" ry="10" fill="#3d9a3d" />
                                        <ellipse cx="30" cy="22" rx="8" ry="8" fill="#45aa45" />
                                        
                                        {/* Light highlights for realistic depth */}
                                        <ellipse cx="26" cy="40" rx="7" ry="6" fill="#5dba5d" opacity="0.5" />
                                        <ellipse cx="35" cy="47" rx="8" ry="7" fill="#5dba5d" opacity="0.4" />
                                        <ellipse cx="28" cy="28" rx="5" ry="4" fill="#6dca6d" opacity="0.6" />
                                        <ellipse cx="33" cy="35" rx="6" ry="5" fill="#6dca6d" opacity="0.45" />
                                        
                                        {/* Shadow clusters */}
                                        <ellipse cx="23" cy="50" rx="6" ry="5" fill="#143d14" opacity="0.4" />
                                        <ellipse cx="37" cy="53" rx="7" ry="6" fill="#143d14" opacity="0.35" />
                                        
                                        {/* Individual leaf clusters for detail */}
                                        <circle cx="20" cy="45" r="4" fill="#2d7a2d" opacity="0.7" />
                                        <circle cx="40" cy="43" r="4.5" fill="#2d7a2d" opacity="0.65" />
                                        <circle cx="25" cy="32" r="3.5" fill="#3d9a3d" opacity="0.7" />
                                        <circle cx="36" cy="30" r="4" fill="#3d9a3d" opacity="0.65" />
                                    </svg>
                                );
                            } else if (obj.type === 'rock') {
                                // ULTRA DETAILED ROCK
                                element = (
                                    <svg width={45 * obj.size} height={32 * obj.size} viewBox="0 0 45 32">
                                        {/* Shadow beneath rock */}
                                        <ellipse cx="22" cy="30" rx="20" ry="5" fill="#000000" opacity="0.25" />
                                        
                                        {/* Main rock body with realistic shading */}
                                        <path d="M22,5 L38,22 L36,28 L9,28 L7,22 Z" fill="#4b5563" />
                                        <path d="M22,5 L32,18 L30,24 L14,24 L12,18 Z" fill="#6b7280" />
                                        <path d="M22,7 L28,16 L26,21 L18,21 L16,16 Z" fill="#9ca3af" />
                                        <path d="M22,9 L25,15 L24,18 L20,18 L19,15 Z" fill="#cbd5e1" />
                                        
                                        {/* Detailed cracks and fissures */}
                                        <line x1="15" y1="23" x2="18" y2="16" stroke="#374151" strokeWidth="1.2" opacity="0.6" />
                                        <line x1="30" y1="24" x2="27" y2="17" stroke="#374151" strokeWidth="1.2" opacity="0.6" />
                                        <line x1="22" y1="8" x2="22" y2="20" stroke="#374151" strokeWidth="1" opacity="0.5" />
                                        <line x1="19" y1="13" x2="25" y2="13" stroke="#374151" strokeWidth="0.8" opacity="0.4" />
                                        
                                        {/* Smaller surface cracks */}
                                        <path d="M20,18 Q21,17 22,18" stroke="#475569" strokeWidth="0.6" fill="none" opacity="0.5" />
                                        <path d="M24,20 Q25,19 26,20" stroke="#475569" strokeWidth="0.6" fill="none" opacity="0.5" />
                                        
                                        {/* Lichen/moss patches */}
                                        <ellipse cx="17" cy="20" rx="3" ry="2" fill="#6b8b6b" opacity="0.4" />
                                        <ellipse cx="28" cy="22" rx="2.5" ry="1.8" fill="#6b8b6b" opacity="0.35" />
                                        <circle cx="23" cy="17" r="1.5" fill="#7b9b7b" opacity="0.3" />
                                        
                                        {/* Highlight for 3D effect */}
                                        <ellipse cx="22" cy="11" rx="4" ry="3" fill="#e2e8f0" opacity="0.3" />
                                    </svg>
                                );
                            }
    
                            return (
                                <div
                                    key={obj.id}
                                    className="absolute"
                                    style={{
                                        left: `calc(50% + ${obj.x}px)`,
                                        top: `${obj.y}px`,
                                        transform: `scale(${scale})`,
                                        opacity: opacity,
                                        filter: scale < 0.7 ? 'blur(1.5px)' : 'none',
                                        pointerEvents: 'none'
                                    }}
                                >
                                    {element}
                                </div>
                            );
                        })}
                    </div>
    
                    {/* ULTRA DETAILED CHARACTER - Pixel art quality, back view */}
                    <div className="absolute left-1/2 -translate-x-1/2 z-40" style={{ top: '48%' }}>
                        <svg width="120" height="160" viewBox="0 0 120 160">
                            {/* Large detailed backpack */}
                            <ellipse cx="60" cy="62" rx="28" ry="35" fill="#8b1a1a" />
                            <ellipse cx="60" cy="60" rx="26" ry="33" fill="#b71c1c" />
                            <ellipse cx="60" cy="58" rx="24" ry="31" fill="#c62828" />
                            <rect x="50" y="45" width="20" height="14" rx="4" fill="#d32f2f" />
                            
                            {/* Backpack pockets and details */}
                            <rect x="53" y="48" width="14" height="9" rx="2" fill="#ef5350" />
                            <circle cx="56" cy="68" r="3.5" fill="#ef5350" />
                            <circle cx="64" cy="68" r="3.5" fill="#ef5350" />
                            <rect x="57" y="78" width="6" height="8" rx="1.5" fill="#d32f2f" />
                            
                            {/* Backpack straps - thick and visible */}
                            <path d="M42,50 Q38,56 38,75" stroke="#8b1a1a" strokeWidth="4.5" fill="none" />
                            <path d="M78,50 Q82,56 82,75" stroke="#8b1a1a" strokeWidth="4.5" fill="none" />
                            <path d="M42,52 Q39,58 39,75" stroke="#a51c1c" strokeWidth="3" fill="none" />
                            <path d="M78,52 Q81,58 81,75" stroke="#a51c1c" strokeWidth="3" fill="none" />
                            
                            {/* Sleeping bag/gear on top */}
                            <ellipse cx="60" cy="35" rx="15" ry="10" fill="#0d47a1" />
                            <ellipse cx="60" cy="33" rx="13" ry="8" fill="#1565c0" />
                            <ellipse cx="60" cy="31" rx="11" ry="6" fill="#1976d2" />
                            
                            {/* Rope coil detail */}
                            <circle cx="72" cy="55" r="6" fill="none" stroke="#d4a574" strokeWidth="2" />
                            <circle cx="72" cy="55" r="4" fill="none" stroke="#d4a574" strokeWidth="1.5" />
                            
                            {/* Detailed hood/head from back */}
                            <ellipse cx="60" cy="24" rx="16" ry="18" fill="#8b1a1a" />
                            <ellipse cx="60" cy="22" rx="14" ry="16" fill="#b71c1c" />
                            <ellipse cx="60" cy="20" rx="13" ry="15" fill="#c62828" />
                            <ellipse cx="60" cy="14" rx="14" ry="9" fill="#d32f2f" />
                            
                            {/* Pom-pom on hat */}
                            <circle cx="60" cy="10" r="4.5" fill="#ef5350" />
                            <circle cx="58" cy="9" r="2" fill="#ff8a80" opacity="0.8" />
                            <circle cx="62" cy="9" r="2" fill="#ff8a80" opacity="0.7" />
                            
                            {/* Back of neck/shoulders visible */}
                            <rect x="52" y="34" width="16" height="12" fill="#d4a574" />
                            <rect x="53" y="35" width="14" height="10" fill="#c99765" />
                            
                            {/* Detailed jacket - back view with seams */}
                            <path d="M40,75 L36,82 L36,112 L42,118 L42,135 L40,148 L45,152 L60,150 L60,75 Z" fill="#0d47a1" />
                            <path d="M80,75 L84,82 L84,112 L78,118 L78,135 L80,148 L75,152 L60,150 L60,75 Z" fill="#0d47a1" />
                            <rect x="42" y="75" width="36" height="75" fill="#1565c0" />
                            
                            {/* Center back seam */}
                            <line x1="60" y1="80" x2="60" y2="145" stroke="#0d47a1" strokeWidth="2.5" />
                            
                            {/* Side seams */}
                            <line x1="48" y1="82" x2="48" y2="140" stroke="#0d47a1" strokeWidth="1.8" opacity="0.7" />
                            <line x1="72" y1="82" x2="72" y2="140" stroke="#0d47a1" strokeWidth="1.8" opacity="0.7" />
                            
                            {/* Jacket panels for depth */}
                            <rect x="48" y="85" width="10" height="50" fill="#1976d2" opacity="0.3" />
                            <rect x="62" y="85" width="10" height="50" fill="#1976d2" opacity="0.3" />
                            
                            {/* Left arm - animated */}
                            <g transform={`rotate(${-12 + armSwing} 40 92)`}>
                                <ellipse cx="40" cy="100" rx="7" ry="24" fill="#0d47a1" />
                                <ellipse cx="39" cy="120" rx="6.5" ry="20" fill="#1565c0" />
                                <ellipse cx="38" cy="138" rx="6" ry="11" fill="#d4a574" />
                                <ellipse cx="38" cy="142" rx="7" ry="7" fill="#ff6f00" />
                                <circle cx="38" cy="142" r="5" fill="#ff8f00" />
                            </g>
                            
                            {/* Right arm with pole - animated */}
                            <g transform={`rotate(${12 - armSwing} 80 92)`}>
                                <ellipse cx="80" cy="100" rx="7" ry="24" fill="#0d47a1" />
                                <ellipse cx="81" cy="120" rx="6.5" ry="20" fill="#1565c0" />
                                <ellipse cx="82" cy="138" rx="6" ry="11" fill="#d4a574" />
                                <ellipse cx="82" cy="142" rx="7" ry="7" fill="#ff6f00" />
                                <circle cx="82" cy="142" r="5" fill="#ff8f00" />
                            </g>
                            
                            {/* Hiking pole - detailed */}
                            <line x1="83" y1="142" x2="90" y2="160" stroke="#5d4037" strokeWidth="4" />
                            <line x1="83" y1="142" x2="90" y2="160" stroke="#795548" strokeWidth="3.5" />
                            <circle cx="90" cy="160" r="5" fill="#3e2723" />
                            <circle cx="90" cy="160" r="3.5" fill="#4a3728" />
                            <circle cx="83" cy="144" r="4" fill="#6d4c41" />
                            <rect x="85" y="150" width="3" height="4" fill="#8d6e63" />
                            
                            {/* Legs with animated walking - LEFT LEG */}
                        <g transform={`translate(${leftLegForward ? -2 : 1} ${leftLegForward ? 5 : 0})`}>
                            <rect x="48" y="150" width="12" height="10" rx="2" fill="#263238" />
                            <rect x="49" y="151" width="10" height="8" rx="1.5" fill="#37474f" />
                            <rect x="50" y="152" width="8" height="6" rx="1" fill="#455a64" />
                        </g>
                        
                        {/* RIGHT LEG */}
                        <g transform={`translate(${leftLegForward ? 1 : -2} ${leftLegForward ? 0 : 5})`}>
                            <rect x="60" y="150" width="12" height="10" rx="2" fill="#263238" />
                            <rect x="61" y="151" width="10" height="8" rx="1.5" fill="#37474f" />
                            <rect x="62" y="152" width="8" height="6" rx="1" fill="#455a64" />
                        </g>
                        
                        {/* Detailed boots - back view */}
                        <ellipse cx="54" cy="160" rx="8" ry="4" fill="#1a1a1a" />
                        <ellipse cx="54" cy="159" rx="7" ry="3.5" fill="#212121" />
                        <ellipse cx="54" cy="158" rx="6" ry="3" fill="#2a2a2a" />
                        
                        <ellipse cx="66" cy="160" rx="8" ry="4" fill="#1a1a1a" />
                        <ellipse cx="66" cy="159" rx="7" ry="3.5" fill="#212121" />
                        <ellipse cx="66" cy="158" rx="6" ry="3" fill="#2a2a2a" />
                        
                        {/* Boot treads */}
                        <line x1="50" y1="160" x2="58" y2="160" stroke="#0a0a0a" strokeWidth="0.8" />
                        <line x1="62" y1="160" x2="70" y2="160" stroke="#0a0a0a" strokeWidth="0.8" />
                    </svg>
                    
                    {/* Realistic shadow */}
                    <div 
                        className="absolute left-1/2 -translate-x-1/2 rounded-full blur-2xl"
                        style={{ 
                            top: '155px',
                            width: '85px',
                            height: '20px',
                            background: 'radial-gradient(ellipse, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.3) 50%, transparent 100%)'
                        }}
                    />
                </div>

                {/* Atmospheric fog gradient */}
                <div className="absolute inset-0 pointer-events-none">
                    <div 
                        className="absolute bottom-0 left-0 right-0"
                        style={{
                            height: '35%',
                            background: `linear-gradient(to top, ${env.skyBot}99 0%, ${env.skyBot}55 25%, transparent 100%)`
                        }}
                    />
                </div>

                {/* HUD */}
                <div className="absolute top-4 left-4 right-4 z-50 flex justify-between items-start gap-3">
                    <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                        <div className="flex items-center gap-2 mb-1">
                            <Mountain className="w-4 h-4 text-emerald-400" />
                            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
                        </div>
                        <div className="text-3xl font-bold text-white">
                            {userData.altitude.toLocaleString()}
                            <span className="text-base text-slate-400 ml-1">m</span>
                        </div>
                        <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                            <div 
                                className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all duration-500 shadow-lg shadow-emerald-500/50"
                                style={{ width: `${progressPercent}%` }}
                            />
                        </div>
                        <div className="text-xs text-slate-400 mt-1">
                            {Math.round(progressPercent)}% to summit
                        </div>
                    </div>

                    <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                        <div className="flex items-center gap-2 mb-1">
                            <div className="w-3 h-3 rounded-full animate-pulse" style={{ backgroundColor: getOxygenColor(userData.oxygen) }} />
                            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
                        </div>
                        <div 
                            className="text-3xl font-bold transition-colors duration-500"
                            style={{ color: getOxygenColor(userData.oxygen) }}
                        >
                            {userData.oxygen}
                            <span className="text-base text-slate-400">%</span>
                        </div>
                        <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                            <div 
                                className="h-full transition-all duration-500"
                                style={{ 
                                    width: `${userData.oxygen}%`,
                                    backgroundColor: getOxygenColor(userData.oxygen),
                                    boxShadow: `0 0 10px ${getOxygenColor(userData.oxygen)}80`
                                }}
                            />
                        </div>
                        <div className="text-xs text-slate-400 mt-1">
                            {userData.oxygen >= 70 ? 'Strong' : userData.oxygen >= 50 ? 'Moderate' : userData.oxygen >= 30 ? 'Weak' : 'Critical'}
                        </div>
                    </div>
                </div>

                {/* Habit Buttons - moved higher to not cut off character */}
                <div className="absolute left-4 right-4 z-50" style={{ bottom: '80px' }}>
                    <div className="bg-white/98 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
                        <div className="grid grid-cols-4 gap-3">
                            {habits.map((habit, index) => {
                                const Icon = habit.icon;
                                const colors = [
                                    { from: 'from-blue-500', to: 'to-cyan-500', glow: 'shadow-blue-500/50' },
                                    { from: 'from-indigo-500', to: 'to-purple-500', glow: 'shadow-indigo-500/50' },
                                    { from: 'from-green-500', to: 'to-emerald-500', glow: 'shadow-green-500/50' },
                                    { from: 'from-purple-500', to: 'to-pink-500', glow: 'shadow-purple-500/50' }
                                ];
                                const color = colors[index];
                                
                                return (
                                    <button
                                        key={habit.id}
                                        onClick={() => completeHabit(habit.id)}
                                        disabled={habit.completed || isClimbing}
                                        className={`
                                            relative aspect-square rounded-2xl transition-all duration-300 flex flex-col items-center justify-center gap-2
                                            ${habit.completed 
                                                ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95' 
                                                : `bg-gradient-to-br ${color.from} ${color.to} hover:scale-105 active:scale-95 shadow-xl ${color.glow}`
                                            }
                                            ${isClimbing && !habit.completed ? 'opacity-50 cursor-not-allowed' : ''}
                                        `}
                                    >
                                        {!habit.completed && (
                                            <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl" />
                                        )}
                                        
                                        <Icon 
                                            className={`w-7 h-7 ${habit.completed ? 'text-emerald-600' : 'text-white drop-shadow-lg'}`}
                                            strokeWidth={2.5}
                                        />
                                        <span className={`text-xs font-bold ${habit.completed ? 'text-emerald-700' : 'text-white drop-shadow'}`}>
                                            {habit.completed ? '✓ Done' : `+${habit.oxygen}%`}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                        
                        <div className="text-center mt-4 pt-3 border-t border-slate-200">
                            <div className="flex items-center justify-center gap-2">
                                <div className="flex gap-1">
                                    {habits.map((h, i) => (
                                        <div 
                                            key={i} 
                                            className={`w-2 h-2 rounded-full transition-all duration-300 ${
                                                h.completed ? 'bg-emerald-500 scale-125' : 'bg-slate-300'
                                            }`}
                                        />
                                    ))}
                                </div>
                                <span className="text-sm text-slate-600 font-medium ml-2">
                                    {habits.filter(h => h.completed).length} / 4 completed
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Milestone notification */}
                {userData.altitude >= 2000 && userData.altitude < 2270 && (
                    <div className="absolute top-1/3 left-1/2 -translate-x-1/2 z-50 animate-bounce">
                        <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl border-2 border-white/50">
                            🎯 2,000m Milestone!
                        </div>
                    </div>
                )}

                <style>{`
                    @keyframes cloudFloat {
                        0%, 100% { transform: translateY(0px) translateX(0px); }
                        25% { transform: translateY(-18px) translateX(12px); }
                        50% { transform: translateY(-10px) translateX(-12px); }
                        75% { transform: translateY(-22px) translateX(10px); }
                    }
                `}</style>
            </div>
        );
    };

    ReactDOM.render(<MountainView />, document.getElementById('root'));
</script>
</body>
</html>
