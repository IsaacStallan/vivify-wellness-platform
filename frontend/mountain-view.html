<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivify - Mountain View</title>
    
    <!-- Load React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        @keyframes snowfall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(100vh) translateX(20px); }
        }
        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: snowfall linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
    
        // Icons
        const Mountain = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
            </svg>
        );
    
        const Droplets = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
                <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
            </svg>
        );
    
        const Moon = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );
    
        const Footprints = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
                <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
            </svg>
        );
    
        const Target = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );
    
        const MountainView = () => {
            const [userData, setUserData] = useState({
                altitude: 1200,
                targetAltitude: 3776,
                oxygen: 78,
                mountainName: 'Mt. Fuji'
            });
    
            const [habits, setHabits] = useState([
                { id: 'hydration', name: 'Water', icon: Droplets, completed: false, oxygen: 15 },
                { id: 'sleep', name: 'Sleep', icon: Moon, completed: false, oxygen: 20 },
                { id: 'movement', name: 'Move', icon: Footprints, completed: false, oxygen: 15 },
                { id: 'focus', name: 'Focus', icon: Target, completed: false, oxygen: 20 }
            ]);
    
            const [mountainScroll, setMountainScroll] = useState(0);
            const [isClimbing, setIsClimbing] = useState(false);
            const [stepPhase, setStepPhase] = useState(0);
            const [snowflakes, setSnowflakes] = useState([]);
    
            const progressPercent = (userData.altitude / userData.targetAltitude) * 100;
    
            const getEnvironment = (alt) => {
                if (alt < 1000) return {
                    name: 'Forest Base',
                    skyTop: '#4A90C8',
                    skyBot: '#7BB8E8',
                    slopeColor: '#6b5d4f',
                    slopeDark: '#4a3d2f',
                    hasForest: true,
                    hasSnow: false
                };
                if (alt < 2000) return {
                    name: 'Mountain Trail',
                    skyTop: '#3A7FB8',
                    skyBot: '#5BA3D8',
                    slopeColor: '#7a7268',
                    slopeDark: '#5a5248',
                    hasForest: true,
                    hasSnow: false
                };
                if (alt < 3000) return {
                    name: 'Alpine Zone',
                    skyTop: '#2E6FA8',
                    skyBot: '#4A8AC8',
                    slopeColor: '#8a8a82',
                    slopeDark: '#6a6a62',
                    hasForest: false,
                    hasSnow: true
                };
                return {
                    name: 'Summit Ridge',
                    skyTop: '#1E5F98',
                    skyBot: '#2E6FA8',
                    slopeColor: '#e8f0f8',
                    slopeDark: '#d0dce8',
                    hasForest: false,
                    hasSnow: true
                };
            };
    
            const env = getEnvironment(userData.altitude);
    
            // Generate snowflakes when in snow zone
            useEffect(() => {
                if (env.hasSnow) {
                    const flakes = Array.from({ length: 50 }, (_, i) => ({
                        id: i,
                        left: Math.random() * 100,
                        size: 2 + Math.random() * 4,
                        duration: 5 + Math.random() * 10,
                        delay: Math.random() * 5
                    }));
                    setSnowflakes(flakes);
                } else {
                    setSnowflakes([]);
                }
            }, [env.hasSnow]);
    
            const completeHabit = (habitId) => {
                const habit = habits.find(h => h.id === habitId);
                if (habit.completed || isClimbing) return;
    
                setIsClimbing(true);
                
                let frame = 0;
                const totalFrames = 30;
                
                const walkInterval = setInterval(() => {
                    frame++;
                    setMountainScroll(prev => prev + 2.8);
                    
                    if (frame % 8 === 0) {
                        setStepPhase(prev => prev === 1 ? 2 : 1);
                    }
                    
                    if (frame >= totalFrames) {
                        clearInterval(walkInterval);
                        setStepPhase(0);
                        
                        setUserData(prev => ({
                            ...prev,
                            altitude: Math.min(prev.altitude + 270, prev.targetAltitude),
                            oxygen: Math.min(prev.oxygen + habit.oxygen, 100)
                        }));
    
                        setHabits(prev => prev.map(h => 
                            h.id === habitId ? { ...h, completed: true } : h
                        ));
                        
                        setIsClimbing(false);
                    }
                }, 35);
            };
    
            const getOxygenColor = (oxygen) => {
                if (oxygen >= 70) return '#10b981';
                if (oxygen >= 50) return '#f59e0b';
                if (oxygen >= 30) return '#f97316';
                return '#ef4444';
            };
    
            const generateTerrain = () => {
                const elements = [];
                for (let i = 0; i < 40; i++) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const y = 250 + i * 100;
                    const x = side * (140 + Math.random() * 220);
                    
                    elements.push({
                        id: i,
                        x: x,
                        y: y,
                        type: env.hasForest && Math.random() > 0.25 ? 'tree' : 'rock',
                        size: 1.1 + Math.random() * 0.9,
                        variant: Math.floor(Math.random() * 3)
                    });
                }
                return elements;
            };
    
            const [terrain] = useState(generateTerrain());
    
            return (
                <div className="relative w-full h-screen overflow-hidden" style={{
                    background: `linear-gradient(to bottom, ${env.skyTop} 0%, ${env.skyBot} 100%)`
                }}>
                    
                    {/* Snowfall effect */}
                    {env.hasSnow && snowflakes.map(flake => (
                        <div
                            key={flake.id}
                            className="snowflake"
                            style={{
                                left: `${flake.left}%`,
                                width: `${flake.size}px`,
                                height: `${flake.size}px`,
                                animationDuration: `${flake.duration}s`,
                                animationDelay: `${flake.delay}s`
                            }}
                        />
                    ))}
                    
                    {/* Sun */}
                    <div className="absolute w-48 h-48 rounded-full" style={{
                        top: '8%',
                        right: '12%',
                        background: 'radial-gradient(circle, #fffef5 0%, #fff9e0 15%, #ffeb3b 40%, #ffa726 80%, transparent 100%)',
                        boxShadow: '0 0 120px rgba(255, 235, 59, 0.4), 0 0 60px rgba(255, 235, 59, 0.6)',
                        opacity: 0.95
                    }} />
    
                    {/* Mountain slope with snow coverage */}
                    <div 
                        className="absolute inset-0"
                        style={{
                            transform: `translateY(${mountainScroll}px)`,
                            transition: 'none'
                        }}
                    >
                        <svg width="100%" height="200%" className="absolute" style={{ top: '-50%' }} preserveAspectRatio="none">
                            <defs>
                                <pattern id="rockTexture" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
                                    <rect width="80" height="80" fill={env.slopeColor} />
                                    <polygon points="15,20 22,18 25,25 18,28" fill={env.slopeDark} opacity="0.3" />
                                    <polygon points="45,10 52,12 50,20 42,18" fill={env.slopeDark} opacity="0.25" />
                                    <polygon points="60,35 68,33 70,42 62,45" fill={env.slopeDark} opacity="0.28" />
                                    <polygon points="30,55 38,52 42,60 33,62" fill={env.slopeDark} opacity="0.32" />
                                    <circle cx="25" cy="45" r="3" fill={env.slopeDark} opacity="0.22" />
                                    <circle cx="70" cy="15" r="2.5" fill={env.slopeDark} opacity="0.20" />
                                    <path d="M5,5 L12,8 L18,6 L25,10" stroke={env.slopeDark} strokeWidth="1" fill="none" opacity="0.18" />
                                </pattern>
                                
                                {/* Snow pattern overlay */}
                                <pattern id="snowPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
                                    <circle cx="20" cy="30" r="8" fill="white" opacity="0.7" />
                                    <circle cx="65" cy="15" r="10" fill="white" opacity="0.65" />
                                    <circle cx="45" cy="60" r="7" fill="white" opacity="0.75" />
                                    <circle cx="80" cy="75" r="9" fill="white" opacity="0.68" />
                                    <circle cx="15" cy="85" r="6" fill="white" opacity="0.72" />
                                    <ellipse cx="50" cy="90" rx="15" ry="8" fill="white" opacity="0.6" />
                                </pattern>
                                
                                <filter id="mountainTexture">
                                    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.04" numOctaves="4" seed="2" />
                                    <feColorMatrix type="saturate" values="0" />
                                    <feComponentTransfer>
                                        <feFuncA type="discrete" tableValues="0 0.08 0.15 0.08" />
                                    </feComponentTransfer>
                                    <feBlend mode="multiply" in="SourceGraphic" />
                                </filter>
                            </defs>
                            <rect width="100%" height="100%" fill="url(#rockTexture)" filter="url(#mountainTexture)" />
                            
                            {/* Snow overlay when above snowline */}
                            {env.hasSnow && (
                                <rect width="100%" height="100%" fill="url(#snowPattern)" opacity="0.8" />
                            )}
                            
                            {[...Array(18)].map((_, i) => (
                                <line 
                                    key={i}
                                    x1="0" 
                                    y1={i * 160} 
                                    x2="100%" 
                                    y2={i * 160}
                                    stroke={env.hasSnow ? "#d0dce8" : env.slopeDark}
                                    strokeWidth="1.5"
                                    opacity="0.18"
                                    strokeDasharray={i % 3 === 0 ? "30,10" : "20,15"}
                                />
                            ))}
                        </svg>
    
                        {/* Terrain objects */}
                        {terrain.map((obj) => {
                            const scale = Math.max(0.5, 1 - ((obj.y - mountainScroll) / 3800));
                            
                            let element = null;
    
                            if (obj.type === 'tree') {
                                const treeVariants = [
                                    <svg width={90} height={120} viewBox="0 0 90 120">
                                        <path d="M38,88 L40,95 L42,105 L44,115 L46,120 L44,120 L42,115 L40,105 L38,95 Z" fill="#2d1810" />
                                        <path d="M39,89 L41,96 L43,106 L45,116 L43,116 L41,106 L39,96 Z" fill="#3e2415" />
                                        
                                        <ellipse cx="45" cy="85" rx="36" ry="14" fill="#0a2d0a" opacity="0.9" />
                                        <ellipse cx="45" cy="80" rx="34" ry="13" fill="#0f3d0f" opacity="0.9" />
                                        <ellipse cx="45" cy="75" rx="33" ry="12" fill="#14481a" />
                                        <ellipse cx="45" cy="70" rx="31" ry="12" fill="#0f3d0f" opacity="0.9" />
                                        <ellipse cx="45" cy="65" rx="29" ry="11" fill="#14481a" opacity="0.9" />
                                        <ellipse cx="45" cy="61" rx="28" ry="10" fill="#195520" />
                                        <ellipse cx="45" cy="56" rx="26" ry="11" fill="#14481a" opacity="0.9" />
                                        <ellipse cx="45" cy="51" rx="24" ry="10" fill="#1e6025" opacity="0.9" />
                                        <ellipse cx="45" cy="47" rx="22" ry="9" fill="#246b2a" />
                                        <ellipse cx="45" cy="42" rx="20" ry="9" fill="#1e6025" opacity="0.9" />
                                        <ellipse cx="45" cy="37" rx="18" ry="8" fill="#2a7630" opacity="0.9" />
                                        <ellipse cx="45" cy="33" rx="16" ry="7" fill="#308135" />
                                        <ellipse cx="45" cy="28" rx="13" ry="7" fill="#2a7630" opacity="0.9" />
                                        <ellipse cx="45" cy="24" rx="11" ry="6" fill="#368c3a" />
                                        <ellipse cx="45" cy="20" rx="8" ry="5" fill="#3c9740" />
                                        
                                        {env.hasSnow && (
                                            <>
                                                <ellipse cx="45" cy="85" rx="34" ry="12" fill="white" opacity="0.6" />
                                                <ellipse cx="45" cy="75" rx="31" ry="10" fill="white" opacity="0.5" />
                                                <ellipse cx="45" cy="65" rx="27" ry="9" fill="white" opacity="0.45" />
                                            </>
                                        )}
                                        
                                        <ellipse cx="52" cy="75" rx="8" ry="6" fill="#4daa4d" opacity="0.4" />
                                        <ellipse cx="51" cy="60" rx="7" ry="5" fill="#5dba5d" opacity="0.45" />
                                    </svg>,
                                    
                                    <svg width={95} height={115} viewBox="0 0 95 115">
                                        <path d="M40,85 L42,92 L44,102 L46,112 L44,112 L42,102 L40,92 Z" fill="#2d1810" />
                                        
                                        <ellipse cx="47" cy="82" rx="38" ry="13" fill="#0a2d0a" opacity="0.9" />
                                        <ellipse cx="47" cy="77" rx="36" ry="12" fill="#0f3d0f" />
                                        <ellipse cx="47" cy="72" rx="34" ry="11" fill="#14481a" opacity="0.9" />
                                        <ellipse cx="47" cy="67" rx="32" ry="11" fill="#0f3d0f" opacity="0.9" />
                                        <ellipse cx="47" cy="62" rx="30" ry="10" fill="#195520" />
                                        <ellipse cx="47" cy="57" rx="28" ry="10" fill="#1e6025" opacity="0.9" />
                                        <ellipse cx="47" cy="52" rx="26" ry="9" fill="#195520" opacity="0.9" />
                                        <ellipse cx="47" cy="47" rx="24" ry="9" fill="#246b2a" />
                                        <ellipse cx="47" cy="42" rx="21" ry="8" fill="#2a7630" opacity="0.9" />
                                        <ellipse cx="47" cy="37" rx="18" ry="8" fill="#246b2a" opacity="0.9" />
                                        <ellipse cx="47" cy="33" rx="15" ry="7" fill="#308135" />
                                        <ellipse cx="47" cy="29" rx="12" ry="6" fill="#368c3a" />
                                        
                                        {env.hasSnow && (
                                            <>
                                                <ellipse cx="47" cy="82" rx="36" ry="11" fill="white" opacity="0.6" />
                                                <ellipse cx="47" cy="72" rx="32" ry="9" fill="white" opacity="0.5" />
                                            </>
                                        )}
                                    </svg>,
                                    
                                    <svg width={85} height={125} viewBox="0 0 85 125">
                                        <path d="M37,92 L39,99 L41,109 L43,119 L41,119 L39,109 L37,99 Z" fill="#2d1810" />
                                        
                                        <ellipse cx="43" cy="88" rx="34" ry="12" fill="#0a2d0a" opacity="0.9" />
                                        <ellipse cx="43" cy="82" rx="32" ry="11" fill="#0f3d0f" />
                                        <ellipse cx="43" cy="76" rx="30" ry="11" fill="#0f3d0f" opacity="0.9" />
                                        <ellipse cx="43" cy="70" rx="28" ry="10" fill="#14481a" />
                                        <ellipse cx="43" cy="64" rx="26" ry="10" fill="#14481a" opacity="0.9" />
                                        <ellipse cx="43" cy="58" rx="24" ry="9" fill="#195520" />
                                        <ellipse cx="43" cy="52" rx="22" ry="9" fill="#195520" opacity="0.9" />
                                        <ellipse cx="43" cy="46" rx="20" ry="8" fill="#1e6025" />
                                        <ellipse cx="43" cy="40" rx="18" ry="8" fill="#1e6025" opacity="0.9" />
                                        <ellipse cx="43" cy="35" rx="15" ry="7" fill="#246b2a" />
                                        <ellipse cx="43" cy="30" rx="12" ry="6" fill="#246b2a" opacity="0.9" />
                                        <ellipse cx="43" cy="25" rx="9" ry="5" fill="#2a7630" />
                                        <ellipse cx="43" cy="21" rx="6" ry="4" fill="#308135" />
                                        
                                        {env.hasSnow && (
                                            <>
                                                <ellipse cx="43" cy="88" rx="32" ry="10" fill="white" opacity="0.6" />
                                                <ellipse cx="43" cy="76" rx="28" ry="9" fill="white" opacity="0.5" />
                                            </>
                                        )}
                                    </svg>
                                ];
                                
                                element = treeVariants[obj.variant];
                            } else {
                                const rockVariants = [
                                    <svg width={60} height={42} viewBox="0 0 60 42">
                                        <ellipse cx="30" cy="40" rx="26" ry="7" fill="#000000" opacity="0.25" />
                                        <path d="M30,4 L50,30 L48,37 L12,37 L10,30 Z" fill="#2a2a2a" />
                                        <path d="M30,4 L42,26 L40,34 L20,34 L18,26 Z" fill="#3d3d3d" />
                                        <path d="M30,6 L37,22 L35,30 L25,30 L23,22 Z" fill="#5a5a5a" />
                                        <path d="M30,8 L34,19 L32,26 L28,26 L26,19 Z" fill="#7a7a7a" />
                                        <ellipse cx="30" cy="13" rx="6" ry="5" fill="#9a9a9a" opacity="0.6" />
                                        
                                        {env.hasSnow && (
                                            <>
                                                <path d="M30,4 L42,26 L20,26 Z" fill="white" opacity="0.7" />
                                                <ellipse cx="30" cy="8" rx="8" ry="6" fill="white" opacity="0.8" />
                                            </>
                                        )}
                                        
                                        <ellipse cx="23" cy="28" rx="5" ry="4" fill={env.hasSnow ? "white" : "#3a5a3a"} opacity="0.4" />
                                    </svg>,
                                    
                                    <svg width={65} height={45} viewBox="0 0 65 45">
                                        <ellipse cx="32" cy="42" rx="28" ry="8" fill="#000000" opacity="0.25" />
                                        <ellipse cx="32" cy="26" rx="30" ry="24" fill="#2a2a2a" />
                                        <ellipse cx="32" cy="24" rx="28" ry="22" fill="#3d3d3d" />
                                        <ellipse cx="32" cy="22" rx="26" ry="20" fill="#5a5a5a" />
                                        <ellipse cx="32" cy="20" rx="24" ry="18" fill="#7a7a7a" />
                                        <ellipse cx="32" cy="18" rx="20" ry="15" fill="#909090" />
                                        
                                        {env.hasSnow && (
                                            <>
                                                <ellipse cx="32" cy="18" rx="22" ry="16" fill="white" opacity="0.7" />
                                                <ellipse cx="28" cy="14" rx="14" ry="11" fill="white" opacity="0.8" />
                                            </>
                                        )}
                                        
                                        <ellipse cx="28" cy="16" rx="12" ry="10" fill="#a5a5a5" opacity="0.7" />
                                    </svg>,
                                    
                                    <svg width={70} height={38} viewBox="0 0 70 38">
                                        <ellipse cx="35" cy="36" rx="30" ry="6" fill="#000000" opacity="0.25" />
                                        <path d="M10,30 L15,20 L55,20 L60,30 Z" fill="#2a2a2a" />
                                        <path d="M12,28 L17,22 L53,22 L58,28 Z" fill="#3d3d3d" />
                                        <path d="M15,16 L20,10 L50,10 L55,16 Z" fill="#4a4a4a" />
                                        <path d="M17,14 L22,12 L48,12 L53,14 Z" fill="#5a5a5a" />
                                        <path d="M20,8 L25,5 L45,5 L50,8 Z" fill="#7a7a7a" />
                                        
                                        {env.hasSnow && (
                                            <>
                                                <path d="M20,8 L25,5 L45,5 L50,8 Z" fill="white" opacity="0.8" />
                                                <path d="M17,14 L22,12 L48,12 L53,14 Z" fill="white" opacity="0.6" />
                                            </>
                                        )}
                                    </svg>
                                ];
                                
                                element = rockVariants[obj.variant];
                            }
    
                            return (
                                <div
                                    key={obj.id}
                                    className="absolute"
                                    style={{
                                        left: `calc(50% + ${obj.x}px)`,
                                        top: `${obj.y}px`,
                                        transform: `scale(${scale * obj.size})`,
                                        opacity: scale > 0.65 ? 1 : scale * 1.4,
                                        filter: scale < 0.7 ? 'blur(1px)' : 'none'
                                    }}
                                >
                                    {element}
                                </div>
                            );
                        })}
                    </div>
    
                    {/* CHARACTER - BACK VIEW, BETTER PROPORTIONS */}
                    <div className="absolute left-1/2 -translate-x-1/2 z-40" style={{ top: '46%' }}>
                        <svg width="100" height="140" viewBox="0 0 100 140">
                            {/* BACKPACK - visible from back */}
                            <ellipse cx="50" cy="50" rx="24" ry="28" fill="#1e4d7a" />
                            <ellipse cx="50" cy="48" rx="22" ry="26" fill="#2563a8" />
                            <ellipse cx="50" cy="46" rx="20" ry="24" fill="#2d72b8" />
                            
                            {/* Top pocket */}
                            <rect x="42" y="38" width="16" height="14" rx="2" fill="#3d82c8" />
                            <rect x="43" y="39" width="14" height="12" rx="1.5" fill="#4a8fd8" />
                            
                            {/* Side pockets */}
                            <ellipse cx="36" cy="52" rx="6" ry="12" fill="#2563a8" />
                            <ellipse cx="64" cy="52" rx="6" ry="12" fill="#2563a8" />
                            
                            {/* Straps going down */}
                            <path d="M36,42 Q32,48 32,64" stroke="#1a3d60" strokeWidth="3.5" fill="none" />
                            <path d="M64,42 Q68,48 68,64" stroke="#1a3d60" strokeWidth="3.5" fill="none" />
                            <path d="M37,43 Q34,49 34,64" stroke="#2563a8" strokeWidth="2.5" fill="none" />
                            <path d="M63,43 Q66,49 66,64" stroke="#2563a8" strokeWidth="2.5" fill="none" />
                            
                            {/* Buckles */}
                            <rect x="42" y="56" width="4" height="3" rx="0.5" fill="#404040" />
                            <rect x="54" y="56" width="4" height="3" rx="0.5" fill="#404040" />
                            
                            {/* Sleeping pad on top */}
                            <ellipse cx="50" cy="32" rx="14" ry="8" fill="#b83838" />
                            <ellipse cx="50" cy="30" rx="12" ry="6" fill="#c84848" />
                            
                            {/* BEANIE - back view, much cleaner */}
                            <ellipse cx="50" cy="18" rx="16" ry="12" fill="#a83030" />
                            <ellipse cx="50" cy="16" rx="15" ry="11" fill="#c83838" />
                            <ellipse cx="50" cy="14" rx="14" ry="10" fill="#d84040" />
                            <rect x="36" y="14" width="28" height="6" rx="3" fill="#e84848" />
                            {/* Folded brim */}
                            <rect x="36" y="18" width="28" height="3" rx="1.5" fill="#b83030" />
                            {/* Pom-pom */}
                            <circle cx="50" cy="8" r="4.5" fill="#e84848" />
                            <circle cx="50" cy="7" r="3.5" fill="#f85050" />
                            
                            {/* HEAD - back of head */}
                            <ellipse cx="50" cy="26" rx="14" ry="12" fill="#d4a574" />
                            <ellipse cx="50" cy="25" rx="13" ry="11" fill="#e0b080" />
                            
                            {/* NECK - proper connection */}
                            <rect x="45" y="34" width="10" height="6" fill="#d4a574" />
                            <rect x="46" y="35" width="8" height="4" fill="#c99565" />
                            
                            {/* Goggle strap visible on back of head */}
                            <ellipse cx="50" cy="22" rx="14" ry="2.5" fill="#1a1a1a" opacity="0.8" />
                            <ellipse cx="50" cy="22" rx="13" ry="2" fill="#2a2a2a" />
                            
                            {/* JACKET - back view, proper proportions */}
                            <path d="M32,42 L28,48 L28,74 L32,80 L32,95 L36,98 L50,97 L50,42 Z" fill="#2d72b8" />
                            <path d="M68,42 L72,48 L72,74 L68,80 L68,95 L64,98 L50,97 L50,42 Z" fill="#2d72b8" />
                            
                            {/* Center back seam */}
                            <line x1="50" y1="44" x2="50" y2="95" stroke="#1a5c8a" strokeWidth="2" />
                            
                            {/* Side seams */}
                            <line x1="40" y1="46" x2="40" y2="92" stroke="#1a5c8a" strokeWidth="1.5" opacity="0.6" />
                            <line x1="60" y1="46" x2="60" y2="92" stroke="#1a5c8a" strokeWidth="1.5" opacity="0.6" />
                            
                            {/* Jacket panels */}
                            <rect x="38" y="50" width="10" height="42" fill="#3d82c8" opacity="0.3" />
                            <rect x="52" y="50" width="10" height="42" fill="#3d82c8" opacity="0.3" />
                            
                            {/* Back pockets */}
                            <rect x="38" y="82" width="10" height="12" rx="2" fill="#1a5c8a" />
                            <rect x="52" y="82" width="10" height="12" rx="2" fill="#1a5c8a" />
                            
                            {/* LEFT ARM - back view */}
                            <g transform={`rotate(${stepPhase === 1 ? -14 : stepPhase === 2 ? -5 : -8} 32 56)`}>
                                <ellipse cx="32" cy="56" rx="6" ry="18" fill="#2d72b8" />
                                <ellipse cx="31" cy="71" rx="5.5" ry="15" fill="#3d82c8" />
                                <ellipse cx="30" cy="84" rx="5" ry="9" fill="#d4a574" />
                                {/* Glove */}
                                <ellipse cx="30" cy="89" rx="5.5" ry="5.5" fill="#1a1a1a" />
                                <ellipse cx="30" cy="88" rx="4.5" ry="4.5" fill="#2a2a2a" />
                            </g>
                            
                            {/* LEFT POLE */}
                            {stepPhase === 1 && (
                                <>
                                    <line x1="31" y1="89" x2="26" y2="115" stroke="#404040" strokeWidth="2.5" />
                                    <line x1="31" y1="89" x2="26" y2="115" stroke="#606060" strokeWidth="2" />
                                    <circle cx="26" cy="115" r="3" fill="#2a2a2a" />
                                    <rect x="29" y="91" width="3" height="5" rx="1.5" fill="#606060" />
                                </>
                            )}
                            
                            {/* RIGHT ARM - back view */}
                            <g transform={`rotate(${stepPhase === 2 ? 14 : stepPhase === 1 ? 5 : 8} 68 56)`}>
                                <ellipse cx="68" cy="56" rx="6" ry="18" fill="#2d72b8" />
                                <ellipse cx="69" cy="71" rx="5.5" ry="15" fill="#3d82c8" />
                                <ellipse cx="70" cy="84" rx="5" ry="9" fill="#d4a574" />
                                {/* Glove */}
                                <ellipse cx="70" cy="89" rx="5.5" ry="5.5" fill="#1a1a1a" />
                                <ellipse cx="70" cy="88" rx="4.5" ry="4.5" fill="#2a2a2a" />
                            </g>
                            
                            {/* RIGHT POLE */}
                            {stepPhase === 2 && (
                                <>
                                    <line x1="69" y1="89" x2="74" y2="115" stroke="#404040" strokeWidth="2.5" />
                                    <line x1="69" y1="89" x2="74" y2="115" stroke="#606060" strokeWidth="2" />
                                    <circle cx="74" cy="115" r="3" fill="#2a2a2a" />
                                    <rect x="68" y="91" width="3" height="5" rx="1.5" fill="#606060" />
                                </>
                            )}
                            
                            {/* PANTS - BETTER PROPORTIONS, LONGER LEGS */}
                            <g transform={`translate(${stepPhase === 1 ? -1.2 : 0} ${stepPhase === 1 ? 2.5 : 0})`}>
                                {/* Left leg */}
                                <rect x="38" y="97" width="12" height="28" rx="2" fill="#2a3a48" />
                                <rect x="39" y="98" width="10" height="26" rx="1.5" fill="#3a4a58" />
                                <line x1="44" y1="99" x2="44" y2="122" stroke="#2a3a48" strokeWidth="1" opacity="0.5" />
                                {/* Knee area */}
                                <rect x="39" y="110" width="10" height="8" rx="1" fill="#4a5a68" opacity="0.5" />
                                {/* Calf shaping */}
                                <path d="M39,118 L39,124 L49,124 L49,118" stroke="#2a3a48" strokeWidth="1.5" fill="none" opacity="0.6" />
                            </g>
                            
                            <g transform={`translate(${stepPhase === 2 ? 1.2 : 0} ${stepPhase === 2 ? 2.5 : 0})`}>
                                {/* Right leg */}
                                <rect x="50" y="97" width="12" height="28" rx="2" fill="#2a3a48" />
                                <rect x="51" y="98" width="10" height="26" rx="1.5" fill="#3a4a58" />
                                <line x1="56" y1="99" x2="56" y2="122" stroke="#2a3a48" strokeWidth="1" opacity="0.5" />
                                {/* Knee area */}
                                <rect x="51" y="110" width="10" height="8" rx="1" fill="#4a5a68" opacity="0.5" />
                                {/* Calf shaping */}
                                <path d="M51,118 L51,124 L61,124 L61,118" stroke="#2a3a48" strokeWidth="1.5" fill="none" opacity="0.6" />
                            </g>
                            
                            {/* HIKING BOOTS - BETTER PROPORTIONS */}
                            <g transform={`translate(${stepPhase === 1 ? -1.2 : 0} ${stepPhase === 1 ? 2.5 : 0})`}>
                                {/* Left boot */}
                                <ellipse cx="44" cy="128" rx="7" ry="4" fill="#1a1a1a" />
                                <ellipse cx="44" cy="127" rx="6.5" ry="3.5" fill="#252525" />
                                <rect x="38" y="121" width="12" height="8" rx="2" fill="#2a2a2a" />
                                <rect x="39" y="122" width="10" height="6" rx="1.5" fill="#353535" />
                                {/* Laces */}
                                <line x1="41" y1="123" x2="47" y2="123" stroke="#505050" strokeWidth="0.7" />
                                <line x1="41" y1="125" x2="47" y2="125" stroke="#505050" strokeWidth="0.7" />
                                {/* Toe cap */}
                                <ellipse cx="44" cy="127" rx="5" ry="2.5" fill="#3a3a3a" />
                                {/* Tread */}
                                <line x1="39" y1="128" x2="49" y2="128" stroke="#0a0a0a" strokeWidth="0.8" />
                            </g>
                            
                            <g transform={`translate(${stepPhase === 2 ? 1.2 : 0} ${stepPhase === 2 ? 2.5 : 0})`}>
                                {/* Right boot */}
                                <ellipse cx="56" cy="128" rx="7" ry="4" fill="#1a1a1a" />
                                <ellipse cx="56" cy="127" rx="6.5" ry="3.5" fill="#252525" />
                                <rect x="50" y="121" width="12" height="8" rx="2" fill="#2a2a2a" />
                                <rect x="51" y="122" width="10" height="6" rx="1.5" fill="#353535" />
                                {/* Laces */}
                                <line x1="53" y1="123" x2="59" y2="123" stroke="#505050" strokeWidth="0.7" />
                                <line x1="53" y1="125" x2="59" y2="125" stroke="#505050" strokeWidth="0.7" />
                                {/* Toe cap */}
                                <ellipse cx="56" cy="127" rx="5" ry="2.5" fill="#3a3a3a" />
                                {/* Tread */}
                                <line x1="51" y1="128" x2="61" y2="128" stroke="#0a0a0a" strokeWidth="0.8" />
                            </g>
                        </svg>
                        
                        {/* Character shadow */}
                        <div 
                            className="absolute left-1/2 -translate-x-1/2 rounded-full blur-lg"
                            style={{ 
                                top: '132px',
                                width: '60px',
                                height: '16px',
                                background: 'radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.25) 50%, transparent 100%)'
                            }}
                        />
                    </div>
    
                    {/* HUD */}
                    <div className="absolute top-4 left-4 right-4 z-50 flex justify-between items-start gap-3">
                        <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                            <div className="flex items-center gap-2 mb-1">
                                <Mountain className="w-4 h-4 text-emerald-400" />
                                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
                            </div>
                            <div className="text-3xl font-bold text-white">
                                {userData.altitude.toLocaleString()}
                                <span className="text-base text-slate-400 ml-1">m</span>
                            </div>
                            <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                                <div 
                                    className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all duration-500 shadow-lg shadow-emerald-500/50"
                                    style={{ width: `${progressPercent}%` }}
                                />
                            </div>
                            <div className="text-xs text-slate-400 mt-1">
                                {Math.round(progressPercent)}% to summit
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                            <div className="flex items-center gap-2 mb-1">
                                <div className="w-3 h-3 rounded-full animate-pulse" style={{ backgroundColor: getOxygenColor(userData.oxygen) }} />
                                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
                            </div>
                            <div 
                                className="text-3xl font-bold transition-colors duration-500"
                                style={{ color: getOxygenColor(userData.oxygen) }}
                            >
                                {userData.oxygen}
                                <span className="text-base text-slate-400">%</span>
                            </div>
                            <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                                <div 
                                    className="h-full transition-all duration-500"
                                    style={{ 
                                        width: `${userData.oxygen}%`,
                                        backgroundColor: getOxygenColor(userData.oxygen),
                                        boxShadow: `0 0 10px ${getOxygenColor(userData.oxygen)}80`
                                    }}
                                />
                            </div>
                            <div className="text-xs text-slate-400 mt-1">
                                {userData.oxygen >= 70 ? 'Strong' : userData.oxygen >= 50 ? 'Moderate' : userData.oxygen >= 30 ? 'Weak' : 'Critical'}
                            </div>
                        </div>
                    </div>

                    {/* Habit Buttons */}
                    <div className="absolute left-4 right-4 z-50" style={{ bottom: '80px' }}>
                        <div className="bg-white/98 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
                            <div className="grid grid-cols-4 gap-3">
                                {habits.map((habit, index) => {
                                    const Icon = habit.icon;
                                    const colors = [
                                        { from: 'from-blue-500', to: 'to-cyan-500', glow: 'shadow-blue-500/50' },
                                        { from: 'from-indigo-500', to: 'to-purple-500', glow: 'shadow-indigo-500/50' },
                                        { from: 'from-green-500', to: 'to-emerald-500', glow: 'shadow-green-500/50' },
                                        { from: 'from-purple-500', to: 'to-pink-500', glow: 'shadow-purple-500/50' }
                                    ];
                                    const color = colors[index];
                                    
                                    return (
                                        <button
                                            key={habit.id}
                                            onClick={() => completeHabit(habit.id)}
                                            disabled={habit.completed || isClimbing}
                                            className={`
                                                relative aspect-square rounded-2xl transition-all duration-300 flex flex-col items-center justify-center gap-2
                                                ${habit.completed 
                                                    ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95' 
                                                    : `bg-gradient-to-br ${color.from} ${color.to} hover:scale-105 active:scale-95 shadow-xl ${color.glow}`
                                                }
                                                ${isClimbing && !habit.completed ? 'opacity-50 cursor-not-allowed' : ''}
                                            `}
                                        >
                                            {!habit.completed && (
                                                <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl" />
                                            )}
                                            
                                            <Icon 
                                                className={`w-7 h-7 ${habit.completed ? 'text-emerald-600' : 'text-white drop-shadow-lg'}`}
                                                strokeWidth={2.5}
                                            />
                                            <span className={`text-xs font-bold ${habit.completed ? 'text-emerald-700' : 'text-white drop-shadow'}`}>
                                                {habit.completed ? '✓ Done' : `+${habit.oxygen}%`}
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>
                            
                            <div className="text-center mt-4 pt-3 border-t border-slate-200">
                                <div className="flex items-center justify-center gap-2">
                                    <div className="flex gap-1">
                                        {habits.map((h, i) => (
                                            <div 
                                                key={i} 
                                                className={`w-2 h-2 rounded-full transition-all duration-300 ${
                                                    h.completed ? 'bg-emerald-500 scale-125' : 'bg-slate-300'
                                                }`}
                                            />
                                        ))}
                                    </div>
                                    <span className="text-sm text-slate-600 font-medium ml-2">
                                        {habits.filter(h => h.completed).length} / 4 completed
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {userData.altitude >= 2000 && userData.altitude < 2270 && (
                        <div className="absolute top-1/3 left-1/2 -translate-x-1/2 z-50 animate-bounce">
                            <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl border-2 border-white/50">
                                🎯 2,000m Milestone!
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<MountainView />, document.getElementById('root'));
    </script>
</body>
</html>
