<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivify - Mountain View</title>
    
    <!-- Load React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        @keyframes snowfall {
            0% { transform: translateY(-10px) translateX(0); }
            100% { transform: translateY(100vh) translateX(20px); }
        }
        .snowflake {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: snowfall linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
    
        // Icons
        const Mountain = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
            </svg>
        );
    
        const Droplets = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
                <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
            </svg>
        );
    
        const Moon = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );
    
        const Footprints = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
                <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
            </svg>
        );
    
        const Target = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );
    
        const MountainView = () => {
            const [userData, setUserData] = useState({
                altitude: 1200,
                targetAltitude: 3776,
                oxygen: 78,
                mountainName: 'Mt. Fuji'
            });
    
            const [habits, setHabits] = useState([
                { id: 'hydration', name: 'Water', icon: Droplets, completed: false, oxygen: 15 },
                { id: 'sleep', name: 'Sleep', icon: Moon, completed: false, oxygen: 20 },
                { id: 'movement', name: 'Move', icon: Footprints, completed: false, oxygen: 15 },
                { id: 'focus', name: 'Focus', icon: Target, completed: false, oxygen: 20 }
            ]);
    
            const [mountainScroll, setMountainScroll] = useState(0);
            const [isClimbing, setIsClimbing] = useState(false);
            const [stepPhase, setStepPhase] = useState(0);
            const [snowflakes, setSnowflakes] = useState([]);
    
            const progressPercent = (userData.altitude / userData.targetAltitude) * 100;
    
            const getEnvironment = (alt) => {
                if (alt < 1000) return {
                    name: 'Forest Base',
                    skyTop: '#4A90C8',
                    skyBot: '#7BB8E8',
                    slopeColor: '#8b7355',
                    slopeDark: '#6b5845',
                    hasForest: true,
                    hasSnow: false
                };
                if (alt < 2000) return {
                    name: 'Mountain Trail',
                    skyTop: '#3A7FB8',
                    skyBot: '#5BA3D8',
                    slopeColor: '#95887a',
                    slopeDark: '#75685a',
                    hasForest: true,
                    hasSnow: false
                };
                if (alt < 3000) return {
                    name: 'Alpine Zone',
                    skyTop: '#2E6FA8',
                    skyBot: '#4A8AC8',
                    slopeColor: '#a5a59d',
                    slopeDark: '#85857d',
                    hasForest: false,
                    hasSnow: true
                };
                return {
                    name: 'Summit Ridge',
                    skyTop: '#1E5F98',
                    skyBot: '#2E6FA8',
                    slopeColor: '#f0f4f8',
                    slopeDark: '#d8e0e8',
                    hasForest: false,
                    hasSnow: true
                };
            };
    
            const env = getEnvironment(userData.altitude);
    
            useEffect(() => {
                if (env.hasSnow) {
                    const flakes = Array.from({ length: 50 }, (_, i) => ({
                        id: i,
                        left: Math.random() * 100,
                        size: 2 + Math.random() * 4,
                        duration: 5 + Math.random() * 10,
                        delay: Math.random() * 5
                    }));
                    setSnowflakes(flakes);
                } else {
                    setSnowflakes([]);
                }
            }, [env.hasSnow]);
    
            const completeHabit = (habitId) => {
                const habit = habits.find(h => h.id === habitId);
                if (habit.completed || isClimbing) return;
    
                setIsClimbing(true);
                
                let frame = 0;
                const totalFrames = 30;
                
                const walkInterval = setInterval(() => {
                    frame++;
                    setMountainScroll(prev => prev + 2.8);
                    
                    if (frame % 8 === 0) {
                        setStepPhase(prev => prev === 1 ? 2 : 1);
                    }
                    
                    if (frame >= totalFrames) {
                        clearInterval(walkInterval);
                        setStepPhase(0);
                        
                        setUserData(prev => ({
                            ...prev,
                            altitude: Math.min(prev.altitude + 270, prev.targetAltitude),
                            oxygen: Math.min(prev.oxygen + habit.oxygen, 100)
                        }));
    
                        setHabits(prev => prev.map(h => 
                            h.id === habitId ? { ...h, completed: true } : h
                        ));
                        
                        setIsClimbing(false);
                    }
                }, 35);
            };
    
            const getOxygenColor = (oxygen) => {
                if (oxygen >= 70) return '#10b981';
                if (oxygen >= 50) return '#f59e0b';
                if (oxygen >= 30) return '#f97316';
                return '#ef4444';
            };
    
            const generateTerrain = () => {
                const elements = [];
                for (let i = 0; i < 40; i++) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const y = 250 + i * 100;
                    const x = side * (140 + Math.random() * 220);
                    
                    elements.push({
                        id: i,
                        x: x,
                        y: y,
                        type: env.hasForest && Math.random() > 0.3 ? 'tree' : 'rock',
                        size: 0.9 + Math.random() * 1.1,
                        variant: Math.floor(Math.random() * 3)
                    });
                }
                return elements;
            };
    
            const [terrain] = useState(generateTerrain());
    
            return (
                <div className="relative w-full h-screen overflow-hidden" style={{
                    background: `linear-gradient(to bottom, ${env.skyTop} 0%, ${env.skyBot} 100%)`
                }}>
                    
                    {/* Snowfall */}
                    {env.hasSnow && snowflakes.map(flake => (
                        <div
                            key={flake.id}
                            className="snowflake"
                            style={{
                                left: `${flake.left}%`,
                                width: `${flake.size}px`,
                                height: `${flake.size}px`,
                                animationDuration: `${flake.duration}s`,
                                animationDelay: `${flake.delay}s`
                            }}
                        />
                    ))}
                    
                    {/* Sun */}
                    <div className="absolute w-48 h-48 rounded-full" style={{
                        top: '8%',
                        right: '12%',
                        background: 'radial-gradient(circle, #fffef5 0%, #fff9e0 15%, #ffeb3b 40%, #ffa726 80%, transparent 100%)',
                        boxShadow: '0 0 120px rgba(255, 235, 59, 0.4), 0 0 60px rgba(255, 235, 59, 0.6)',
                        opacity: 0.95
                    }} />
    
                    {/* Mountain slope */}
                    <div 
                        className="absolute inset-0"
                        style={{
                            transform: `translateY(${mountainScroll}px)`,
                            transition: 'none'
                        }}
                    >
                        <svg width="100%" height="200%" className="absolute" style={{ top: '-50%' }} preserveAspectRatio="none">
                            <defs>
                                {/* Enhanced rock texture pattern */}
                                <pattern id="rockTexture" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
                                    <rect width="120" height="120" fill={env.slopeColor} />
                                    
                                    {/* Large angular rock faces */}
                                    <polygon points="20,25 35,20 40,35 25,42" fill={env.slopeDark} opacity="0.35" />
                                    <polygon points="65,15 82,18 80,32 63,30" fill={env.slopeDark} opacity="0.3" />
                                    <polygon points="90,45 105,42 108,58 92,62" fill={env.slopeDark} opacity="0.33" />
                                    <polygon points="40,70 58,65 62,82 44,88" fill={env.slopeDark} opacity="0.37" />
                                    <polygon points="15,90 25,95 20,108 12,105" fill={env.slopeDark} opacity="0.32" />
                                    <polygon points="75,95 90,98 88,112 74,110" fill={env.slopeDark} opacity="0.34" />
                                    
                                    {/* Medium rocks */}
                                    <polygon points="48,28 56,26 58,35 50,37" fill={env.slopeDark} opacity="0.28" />
                                    <polygon points="28,58 38,55 40,68 30,70" fill={env.slopeDark} opacity="0.29" />
                                    <polygon points="85,75 93,73 95,84 87,86" fill={env.slopeDark} opacity="0.27" />
                                    
                                    {/* Small pebbles - clusters */}
                                    <circle cx="35" cy="55" r="4" fill={env.slopeDark} opacity="0.24" />
                                    <circle cx="40" cy="53" r="3" fill={env.slopeDark} opacity="0.22" />
                                    <circle cx="38" cy="58" r="2.5" fill={env.slopeDark} opacity="0.23" />
                                    
                                    <circle cx="95" cy="25" r="3.5" fill={env.slopeDark} opacity="0.21" />
                                    <circle cx="98" cy="28" r="2.8" fill={env.slopeDark} opacity="0.20" />
                                    
                                    <circle cx="68" cy="90" r="3.2" fill={env.slopeDark} opacity="0.25" />
                                    <circle cx="72" cy="88" r="2.5" fill={env.slopeDark} opacity="0.23" />
                                    <circle cx="70" cy="93" r="2" fill={env.slopeDark} opacity="0.22" />
                                    
                                    {/* Natural cracks and fissures */}
                                    <path d="M8,8 L18,12 L28,10 L38,15 L48,12" stroke={env.slopeDark} strokeWidth="1.5" fill="none" opacity="0.20" />
                                    <path d="M60,40 Q70,38 80,42 T100,48" stroke={env.slopeDark} strokeWidth="1.2" fill="none" opacity="0.18" />
                                    <path d="M25,85 L38,82 L50,88 L62,85" stroke={env.slopeDark} strokeWidth="1.3" fill="none" opacity="0.19" />
                                    <path d="M5,65 Q10,68 15,65 T25,68" stroke={env.slopeDark} strokeWidth="1" fill="none" opacity="0.17" />
                                    
                                    {/* Weathering marks */}
                                    <ellipse cx="52" cy="48" rx="6" ry="3" fill={env.slopeDark} opacity="0.15" />
                                    <ellipse cx="18" cy="75" rx="5" ry="2.5" fill={env.slopeDark} opacity="0.14" />
                                    <ellipse cx="88" cy="18" rx="4.5" ry="2" fill={env.slopeDark} opacity="0.16" />
                                </pattern>
                                
                                {/* Snow pattern */}
                                <pattern id="snowPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
                                    <circle cx="20" cy="30" r="8" fill="white" opacity="0.7" />
                                    <circle cx="65" cy="15" r="10" fill="white" opacity="0.65" />
                                    <circle cx="45" cy="60" r="7" fill="white" opacity="0.75" />
                                    <circle cx="80" cy="75" r="9" fill="white" opacity="0.68" />
                                    <circle cx="15" cy="85" r="6" fill="white" opacity="0.72" />
                                    <ellipse cx="50" cy="90" rx="15" ry="8" fill="white" opacity="0.6" />
                                </pattern>
                                
                                {/* 3D depth filter */}
                                <filter id="mountainTexture">
                                    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.05" numOctaves="5" seed="3" />
                                    <feColorMatrix type="saturate" values="0" />
                                    <feComponentTransfer>
                                        <feFuncA type="discrete" tableValues="0 0.06 0.12 0.18 0.10" />
                                    </feComponentTransfer>
                                    <feBlend mode="overlay" in="SourceGraphic" />
                                </filter>
                            </defs>
                            
                            <rect width="100%" height="100%" fill="url(#rockTexture)" filter="url(#mountainTexture)" />
                            
                            {env.hasSnow && (
                                <rect width="100%" height="100%" fill="url(#snowPattern)" opacity="0.8" />
                            )}
                            
                            {/* Contour lines with varied spacing */}
                            {[...Array(18)].map((_, i) => (
                                <line 
                                    key={i}
                                    x1="0" 
                                    y1={i * 160} 
                                    x2="100%" 
                                    y2={i * 160}
                                    stroke={env.hasSnow ? "#d0dce8" : env.slopeDark}
                                    strokeWidth={i % 5 === 0 ? "2" : "1.5"}
                                    opacity={i % 5 === 0 ? "0.25" : "0.18"}
                                    strokeDasharray={i % 3 === 0 ? "35,12" : i % 2 === 0 ? "25,15" : "20,18"}
                                />
                            ))}
                        </svg>
    
                        {/* HIGH QUALITY TERRAIN OBJECTS */}
                        {terrain.map((obj) => {
                            const scale = Math.max(0.4, 1 - ((obj.y - mountainScroll) / 4000));
                            
                            let element = null;
    
                            if (obj.type === 'tree') {
                                // Professional quality evergreen tree
                                element = (
                                    <svg width={100} height={130} viewBox="0 0 100 130">
                                        {/* Trunk with detailed bark texture */}
                                        <rect x="44" y="95" width="12" height="35" fill="#2d1810" />
                                        <rect x="45" y="96" width="10" height="33" fill="#3e2415" />
                                        <rect x="46" y="97" width="8" height="31" fill="#4a2f1a" />
                                        
                                        {/* Bark texture details */}
                                        <line x1="47" y1="100" x2="47" y2="125" stroke="#1a0f08" strokeWidth="1" opacity="0.6" />
                                        <line x1="50" y1="98" x2="50" y2="127" stroke="#1a0f08" strokeWidth="0.8" opacity="0.5" />
                                        <line x1="53" y1="99" x2="53" y2="126" stroke="#1a0f08" strokeWidth="0.9" opacity="0.55" />
                                        <ellipse cx="49" cy="108" rx="2.5" ry="4" fill="#1a0f08" opacity="0.7" />
                                        <ellipse cx="52" cy="118" rx="2" ry="3.5" fill="#1a0f08" opacity="0.65" />
                                        
                                        {/* Realistic branch layers - conical shape */}
                                        <ellipse cx="50" cy="90" rx="40" ry="15" fill="#0a2d0a" opacity="0.9" />
                                        <ellipse cx="50" cy="88" rx="38" ry="14" fill="#0f3d0f" opacity="0.9" />
                                        <ellipse cx="50" cy="86" rx="36" ry="13" fill="#14481a" />
                                        
                                        <ellipse cx="50" cy="80" rx="36" ry="13" fill="#0f3d0f" opacity="0.9" />
                                        <ellipse cx="50" cy="78" rx="34" ry="12" fill="#14481a" opacity="0.9" />
                                        <ellipse cx="50" cy="76" rx="32" ry="11" fill="#195520" />
                                        
                                        <ellipse cx="50" cy="70" rx="32" ry="12" fill="#14481a" opacity="0.9" />
                                        <ellipse cx="50" cy="68" rx="30" ry="11" fill="#195520" opacity="0.9" />
                                        <ellipse cx="50" cy="66" rx="28" ry="10" fill="#1e6025" />
                                        
                                        <ellipse cx="50" cy="60" rx="28" ry="11" fill="#195520" opacity="0.9" />
                                        <ellipse cx="50" cy="58" rx="26" ry="10" fill="#1e6025" opacity="0.9" />
                                        <ellipse cx="50" cy="56" rx="24" ry="9" fill="#246b2a" />
                                        
                                        <ellipse cx="50" cy="50" rx="24" ry="10" fill="#1e6025" opacity="0.9" />
                                        <ellipse cx="50" cy="48" rx="22" ry="9" fill="#246b2a" opacity="0.9" />
                                        <ellipse cx="50" cy="46" rx="20" ry="8" fill="#2a7630" />
                                        
                                        <ellipse cx="50" cy="40" rx="20" ry="9" fill="#246b2a" opacity="0.9" />
                                        <ellipse cx="50" cy="38" rx="18" ry="8" fill="#2a7630" opacity="0.9" />
                                        <ellipse cx="50" cy="36" rx="16" ry="7" fill="#308135" />
                                        
                                        <ellipse cx="50" cy="30" rx="16" ry="8" fill="#2a7630" opacity="0.9" />
                                        <ellipse cx="50" cy="28" rx="14" ry="7" fill="#308135" opacity="0.9" />
                                        <ellipse cx="50" cy="26" rx="12" ry="6" fill="#368c3a" />
                                        
                                        <ellipse cx="50" cy="21" rx="10" ry="6" fill="#308135" opacity="0.9" />
                                        <ellipse cx="50" cy="18" rx="8" ry="5" fill="#368c3a" />
                                        <ellipse cx="50" cy="15" rx="6" ry="4" fill="#3c9740" />
                                        
                                        {/* Sunlight highlights on foliage */}
                                        <ellipse cx="58" cy="82" rx="10" ry="7" fill="#4daa4d" opacity="0.4" />
                                        <ellipse cx="57" cy="68" rx="9" ry="6" fill="#5dba5d" opacity="0.45" />
                                        <ellipse cx="56" cy="54" rx="8" ry="5" fill="#6dca6d" opacity="0.5" />
                                        <ellipse cx="55" cy="40" rx="7" ry="4" fill="#7dda7d" opacity="0.55" />
                                        <ellipse cx="54" cy="26" rx="6" ry="3" fill="#8dea8d" opacity="0.6" />
                                        
                                        {/* Shadow side */}
                                        <ellipse cx="42" cy="84" rx="9" ry="6" fill="#061a06" opacity="0.3" />
                                        <ellipse cx="43" cy="70" rx="8" ry="5" fill="#061a06" opacity="0.28" />
                                        <ellipse cx="44" cy="56" rx="7" ry="4" fill="#061a06" opacity="0.26" />
                                        
                                        {/* Snow coverage if in snow zone */}
                                        {env.hasSnow && (
                                            <>
                                                <ellipse cx="50" cy="90" rx="38" ry="13" fill="white" opacity="0.65" />
                                                <ellipse cx="50" cy="80" rx="34" ry="11" fill="white" opacity="0.6" />
                                                <ellipse cx="50" cy="70" rx="30" ry="10" fill="white" opacity="0.55" />
                                                <ellipse cx="50" cy="60" rx="26" ry="9" fill="white" opacity="0.5" />
                                                <ellipse cx="50" cy="50" rx="22" ry="8" fill="white" opacity="0.45" />
                                                <ellipse cx="50" cy="40" rx="18" ry="7" fill="white" opacity="0.4" />
                                                <ellipse cx="50" cy="30" rx="14" ry="6" fill="white" opacity="0.35" />
                                            </>
                                        )}
                                    </svg>
                                );
                            } else {
                                // Professional quality boulder/rock
                                const rockVariants = [
                                    // Variant 1: Angular mountain boulder
                                    <svg width={75} height={50} viewBox="0 0 75 50">
                                        {/* Shadow */}
                                        <ellipse cx="37" cy="48" rx="32" ry="8" fill="#000000" opacity="0.3" />
                                        
                                        {/* Main rock structure - multiple facets */}
                                        <path d="M37,5 L60,32 L58,42 L16,42 L14,32 Z" fill="#1a1a1a" />
                                        <path d="M37,5 L52,28 L50,38 L24,38 L22,28 Z" fill="#2a2a2a" />
                                        <path d="M37,7 L47,24 L45,34 L29,34 L27,24 Z" fill="#3d3d3d" />
                                        <path d="M37,9 L43,21 L41,30 L33,30 L31,21 Z" fill="#5a5a5a" />
                                        <path d="M37,11 L40,19 L38,26 L36,26 L34,19 Z" fill="#7a7a7a" />
                                        
                                        {/* Top highlight */}
                                        <ellipse cx="37" cy="14" rx="7" ry="6" fill="#9a9a9a" opacity="0.7" />
                                        <ellipse cx="35" cy="12" rx="4" ry="3" fill="#afafaf" opacity="0.6" />
                                        
                                        {/* Rock cracks and fissures */}
                                        <line x1="24" y1="37" x2="28" y2="24" stroke="#0a0a0a" strokeWidth="1.5" opacity="0.7" />
                                        <line x1="50" y1="38" x2="46" y2="25" stroke="#0a0a0a" strokeWidth="1.5" opacity="0.7" />
                                        <line x1="37" y1="10" x2="37" y2="32" stroke="#0a0a0a" strokeWidth="1.2" opacity="0.6" />
                                        
                                        {/* Smaller detail cracks */}
                                        <path d="M30,30 Q32,28 34,30" stroke="#1a1a1a" strokeWidth="1" fill="none" opacity="0.5" />
                                        <path d="M40,32 Q42,30 44,32" stroke="#1a1a1a" strokeWidth="1" fill="none" opacity="0.5" />
                                        <path d="M26,36 L28,34 L30,36" stroke="#1a1a1a" strokeWidth="0.8" fill="none" opacity="0.4" />
                                        
                                        {/* Moss/lichen patches */}
                                        <ellipse cx="28" cy="34" rx="6" ry="5" fill="#3a5a3a" opacity="0.45" />
                                        <ellipse cx="48" cy="36" rx="5" ry="4" fill="#3a5a3a" opacity="0.4" />
                                        <ellipse cx="36" cy="38" rx="4" ry="3" fill="#4a6a4a" opacity="0.35" />
                                        
                                        {/* Snow cap if in snow zone */}
                                        {env.hasSnow && (
                                            <>
                                                <path d="M37,5 L52,28 L24,28 Z" fill="white" opacity="0.75" />
                                                <ellipse cx="37" cy="10" rx="10" ry="8" fill="white" opacity="0.85" />
                                                <ellipse cx="35" cy="8" rx="6" ry="5" fill="white" opacity="0.9" />
                                            </>
                                        )}
                                    </svg>,
                                    
                                    // Variant 2: Rounded boulder
                                    <svg width={80} height={55} viewBox="0 0 80 55">
                                        <ellipse cx="40" cy="52" rx="34" ry="9" fill="#000000" opacity="0.3" />
                                        
                                        {/* Rounded layers */}
                                        <ellipse cx="40" cy="32" rx="36" ry="28" fill="#1a1a1a" />
                                        <ellipse cx="40" cy="30" rx="34" ry="26" fill="#2a2a2a" />
                                        <ellipse cx="40" cy="28" rx="32" ry="24" fill="#3d3d3d" />
                                        <ellipse cx="40" cy="26" rx="30" ry="22" fill="#5a5a5a" />
                                        <ellipse cx="40" cy="24" rx="28" ry="20" fill="#7a7a7a" />
                                        <ellipse cx="40" cy="22" rx="24" ry="18" fill="#909090" />
                                        
                                        {/* Highlight */}
                                        <ellipse cx="36" cy="20" rx="16" ry="13" fill="#a5a5a5" opacity="0.75" />
                                        <ellipse cx="34" cy="18" rx="10" ry="8" fill="#b8b8b8" opacity="0.7" />
                                        
                                        {/* Surface cracks */}
                                        <path d="M26,32 Q28,30 30,32" stroke="#0a0a0a" strokeWidth="1.2" fill="none" opacity="0.6" />
                                        <path d="M50,34 Q52,32 54,34" stroke="#0a0a0a" strokeWidth="1.2" fill="none" opacity="0.6" />
                                        <path d="M38,16 Q40,20 42,16" stroke="#1a1a1a" strokeWidth="1" fill="none" opacity="0.5" />
                                        
                                        {/* Weathering spots */}
                                        <ellipse cx="30" cy="36" rx="7" ry="6" fill="#3a5a3a" opacity="0.45" />
                                        <ellipse cx="50" cy="38" rx="6" ry="5" fill="#3a5a3a" opacity="0.4" />
                                        <ellipse cx="40" cy="40" rx="5" ry="4" fill="#4a6a4a" opacity="0.35" />
                                        
                                        {env.hasSnow && (
                                            <>
                                                <ellipse cx="40" cy="22" rx="26" ry="19" fill="white" opacity="0.75" />
                                                <ellipse cx="36" cy="18" rx="18" ry="14" fill="white" opacity="0.85" />
                                                <ellipse cx="34" cy="16" rx="12" ry="10" fill="white" opacity="0.9" />
                                            </>
                                        )}
                                    </svg>,
                                    
                                    // Variant 3: Layered sedimentary rock
                                    <svg width={85} height={48} viewBox="0 0 85 48">
                                        <ellipse cx="42" cy="46" rx="36" ry="7" fill="#000000" opacity="0.3" />
                                        
                                        {/* Horizontal layers */}
                                        <path d="M12,38 L18,28 L67,28 L73,38 Z" fill="#1a1a1a" />
                                        <path d="M14,36 L20,30 L65,30 L71,36 Z" fill="#2a2a2a" />
                                        
                                        <path d="M18,24 L24,18 L61,18 L67,24 Z" fill="#2d2d2d" />
                                        <path d="M20,22 L26,20 L59,20 L65,22 Z" fill="#3d3d3d" />
                                        
                                        <path d="M24,14 L30,10 L55,10 L61,14 Z" fill="#4a4a4a" />
                                        <path d="M26,12 L32,11 L53,11 L59,12 Z" fill="#5a5a5a" />
                                        
                                        <path d="M30,8 L36,6 L49,6 L55,8 Z" fill="#6a6a6a" />
                                        <path d="M32,7 L38,6 L47,6 L53,7 Z" fill="#7a7a7a" />
                                        
                                        {/* Layer separation lines */}
                                        <line x1="14" y1="36" x2="71" y2="36" stroke="#0a0a0a" strokeWidth="2" opacity="0.6" />
                                        <line x1="18" y1="24" x2="67" y2="24" stroke="#0a0a0a" strokeWidth="1.8" opacity="0.6" />
                                        <line x1="24" y1="14" x2="61" y2="14" stroke="#0a0a0a" strokeWidth="1.5" opacity="0.5" />
                                        <line x1="30" y1="8" x2="55" y2="8" stroke="#0a0a0a" strokeWidth="1.2" opacity="0.5" />
                                        
                                        {/* Vertical cracks through layers */}
                                        <line x1="35" y1="7" x2="32" y2="36" stroke="#0a0a0a" strokeWidth="1.5" opacity="0.5" />
                                        <line x1="50" y1="7" x2="53" y2="36" stroke="#0a0a0a" strokeWidth="1.5" opacity="0.5" />
                                        
                                        {/* Moss patches */}
                                        <ellipse cx="28" cy="34" rx="6" ry="4" fill="#3a5a3a" opacity="0.45" />
                                        <ellipse cx="58" cy="35" rx="7" ry="5" fill="#3a5a3a" opacity="0.4" />
                                        <ellipse cx="42" cy="20" rx="5" ry="3" fill="#4a6a4a" opacity="0.35" />
                                        
                                        {env.hasSnow && (
                                            <>
                                                <path d="M30,8 L36,6 L49,6 L55,8 Z" fill="white" opacity="0.85" />
                                                <path d="M26,12 L32,11 L53,11 L59,12 Z" fill="white" opacity="0.7" />
                                                <path d="M20,22 L26,20 L59,20 L65,22 Z" fill="white" opacity="0.5" />
                                            </>
                                        )}
                                    </svg>
                                ];
                                
                                element = rockVariants[obj.variant];
                            }
    
                            return (
                                <div
                                    key={obj.id}
                                    className="absolute"
                                    style={{
                                        left: `calc(50% + ${obj.x}px)`,
                                        top: `${obj.y}px`,
                                        transform: `scale(${scale * obj.size})`,
                                        opacity: scale > 0.6 ? 1 : scale * 1.5,
                                        filter: scale < 0.65 ? 'blur(0.8px)' : 'none'
                                    }}
                                >
                                    {element}
                                </div>
                            );
                        })}
                    </div>
    
                    {/* CHARACTER - CLIMBING PERSPECTIVE, TILTED FORWARD */}
                    <div className="absolute left-1/2 -translate-x-1/2 z-40" style={{ 
                        top: '46%',
                        transform: 'translate(-50%, 0) perspective(800px) rotateX(12deg)'
                    }}>
                        <svg width="95" height="135" viewBox="0 0 95 135">
                            {/* BACKPACK */}
                            <ellipse cx="47" cy="48" rx="22" ry="26" fill="#1e4d7a" />
                            <ellipse cx="47" cy="46" rx="20" ry="24" fill="#2563a8" />
                            <ellipse cx="47" cy="44" rx="18" ry="22" fill="#2d72b8" />
                            
                            {/* Top pocket */}
                            <rect x="40" y="36" width="14" height="12" rx="2" fill="#3d82c8" />
                            <rect x="41" y="37" width="12" height="10" rx="1.5" fill="#4a8fd8" />
                            
                            {/* Side pockets */}
                            <ellipse cx="34" cy="50" rx="5" ry="11" fill="#2563a8" />
                            <ellipse cx="60" cy="50" rx="5" ry="11" fill="#2563a8" />
                            
                            {/* Straps */}
                            <path d="M34,40 Q31,45 31,60" stroke="#1a3d60" strokeWidth="3" fill="none" />
                            <path d="M60,40 Q63,45 63,60" stroke="#1a3d60" strokeWidth="3" fill="none" />
                            <path d="M35,41 Q32,46 32,60" stroke="#2563a8" strokeWidth="2" fill="none" />
                            <path d="M59,41 Q62,46 62,60" stroke="#2563a8" strokeWidth="2" fill="none" />
                            
                            {/* Sleeping pad */}
                            <ellipse cx="47" cy="30" rx="13" ry="7" fill="#b83838" />
                            <ellipse cx="47" cy="28" rx="11" ry="5" fill="#c84848" />
                            
                            {/* BEANIE - back view */}
                            <ellipse cx="47" cy="16" rx="15" ry="11" fill="#a83030" />
                            <ellipse cx="47" cy="14" rx="14" ry="10" fill="#c83838" />
                            <ellipse cx="47" cy="12" rx="13" ry="9" fill="#d84040" />
                            <rect x="34" y="12" width="26" height="5" rx="2.5" fill="#e84848" />
                            <rect x="34" y="16" width="26" height="3" rx="1.5" fill="#b83030" />
                            
                            {/* Pom-pom */}
                            <circle cx="47" cy="7" r="4" fill="#e84848" />
                            <circle cx="47" cy="6" r="3" fill="#f85050" />
                            
                            {/* HEAD */}
                            <ellipse cx="47" cy="24" rx="13" ry="11" fill="#d4a574" />
                            <ellipse cx="47" cy="23" rx="12" ry="10" fill="#e0b080" />
                            
                            {/* NECK */}
                            <rect x="42" y="32" width="10" height="5" fill="#d4a574" />
                            <rect x="43" y="33" width="8" height="3" fill="#c99565" />
                            
                            {/* Goggle strap */}
                            <ellipse cx="47" cy="20" rx="13" ry="2" fill="#1a1a1a" opacity="0.8" />
                            <ellipse cx="47" cy="20" rx="12" ry="1.5" fill="#2a2a2a" />
                            
                            {/* JACKET - back view */}
                            <path d="M31,40 L28,45 L28,68 L31,73 L31,86 L35,89 L47,88 L47,40 Z" fill="#2d72b8" />
                            <path d="M63,40 L66,45 L66,68 L63,73 L63,86 L59,89 L47,88 L47,40 Z" fill="#2d72b8" />
                            
                            {/* Center seam */}
                            <line x1="47" y1="42" x2="47" y2="86" stroke="#1a5c8a" strokeWidth="2" />
                            
                            {/* Side seams */}
                            <line x1="38" y1="44" x2="38" y2="83" stroke="#1a5c8a" strokeWidth="1.5" opacity="0.6" />
                            <line x1="56" y1="44" x2="56" y2="83" stroke="#1a5c8a" strokeWidth="1.5" opacity="0.6" />
                            
                            {/* Panels */}
                            <rect x="36" y="48" width="9" height="38" fill="#3d82c8" opacity="0.3" />
                            <rect x="49" y="48" width="9" height="38" fill="#3d82c8" opacity="0.3" />
                            
                            {/* Back pockets */}
                            <rect x="36" y="74" width="9" height="10" rx="2" fill="#1a5c8a" />
                            <rect x="49" y="74" width="9" height="10" rx="2" fill="#1a5c8a" />
                            
                            {/* LEFT ARM - reaching forward */}
                            <g transform={`rotate(${stepPhase === 1 ? -20 : stepPhase === 2 ? -8 : -12} 31 52)`}>
                                <ellipse cx="31" cy="52" rx="5.5" ry="16" fill="#2d72b8" />
                                <ellipse cx="30" cy="66" rx="5" ry="13" fill="#3d82c8" />
                                <ellipse cx="29" cy="78" rx="4.5" ry="8" fill="#d4a574" />
                                <ellipse cx="29" cy="82" rx="5" ry="5" fill="#1a1a1a" />
                                <ellipse cx="29" cy="81" rx="4" ry="4" fill="#2a2a2a" />
                            </g>
                            
                            {/* LEFT POLE - angled forward */}
                            {stepPhase === 1 && (
                                <>
                                    <line x1="30" y1="82" x2="22" y2="105" stroke="#404040" strokeWidth="2.5" />
                                    <line x1="30" y1="82" x2="22" y2="105" stroke="#606060" strokeWidth="2" />
                                    <circle cx="22" cy="105" r="3" fill="#2a2a2a" />
                                    <rect x="28" y="84" width="3" height="5" rx="1.5" fill="#606060" />
                                </>
                            )}
                            
                            {/* RIGHT ARM - reaching forward */}
                            <g transform={`rotate(${stepPhase === 2 ? 20 : stepPhase === 1 ? 8 : 12} 63 52)`}>
                                <ellipse cx="63" cy="52" rx="5.5" ry="16" fill="#2d72b8" />
                                <ellipse cx="64" cy="66" rx="5" ry="13" fill="#3d82c8" />
                                <ellipse cx="65" cy="78" rx="4.5" ry="8" fill="#d4a574" />
                                <ellipse cx="65" cy="82" rx="5" ry="5" fill="#1a1a1a" />
                                <ellipse cx="65" cy="81" rx="4" ry="4" fill="#2a2a2a" />
                            </g>
                            
                            {/* RIGHT POLE - angled forward */}
                            {stepPhase === 2 && (
                                <>
                                    <line x1="64" y1="82" x2="72" y2="105" stroke="#404040" strokeWidth="2.5" />
                                    <line x1="64" y1="82" x2="72" y2="105" stroke="#606060" strokeWidth="2" />
                                    <circle cx="72" cy="105" r="3" fill="#2a2a2a" />
                                    <rect x="64" y="84" width="3" height="5" rx="1.5" fill="#606060" />
                                </>
                            )}
                            
                            {/* PANTS - longer legs, better proportions */}
                            <g transform={`translate(${stepPhase === 1 ? -1 : 0} ${stepPhase === 1 ? 2 : 0})`}>
                                <rect x="36" y="88" width="11" height="32" rx="2" fill="#2a3a48" />
                                <rect x="37" y="89" width="9" height="30" rx="1.5" fill="#3a4a58" />
                                <line x1="41" y1="90" x2="41" y2="116" stroke="#2a3a48" strokeWidth="1" opacity="0.5" />
                                <rect x="37" y="104" width="9" height="7" rx="1" fill="#4a5a68" opacity="0.5" />
                            </g>
                            
                            <g transform={`translate(${stepPhase === 2 ? 1 : 0} ${stepPhase === 2 ? 2 : 0})`}>
                                <rect x="48" y="88" width="11" height="32" rx="2" fill="#2a3a48" />
                                <rect x="49" y="89" width="9" height="30" rx="1.5" fill="#3a4a58" />
                                <line x1="53" y1="90" x2="53" y2="116" stroke="#2a3a48" strokeWidth="1" opacity="0.5" />
                                <rect x="49" y="104" width="9" height="7" rx="1" fill="#4a5a68" opacity="0.5" />
                            </g>
                            
                            {/* BOOTS - angled for climbing */}
                            <g transform={`translate(${stepPhase === 1 ? -1 : 0} ${stepPhase === 1 ? 2 : 0}) rotate(-8 41 122)`}>
                                <ellipse cx="41" cy="122" rx="7" ry="3.5" fill="#1a1a1a" />
                                <ellipse cx="41" cy="121" rx="6.5" ry="3" fill="#252525" />
                                <rect x="36" y="116" width="10" height="7" rx="2" fill="#2a2a2a" />
                                <rect x="37" y="117" width="8" height="5" rx="1.5" fill="#353535" />
                                <line x1="39" y1="118" x2="43" y2="118" stroke="#505050" strokeWidth="0.6" />
                                <line x1="39" y1="120" x2="43" y2="120" stroke="#505050" strokeWidth="0.6" />
                                <ellipse cx="41" cy="121" rx="4.5" ry="2" fill="#3a3a3a" />
                                <line x1="37" y1="122" x2="45" y2="122" stroke="#0a0a0a" strokeWidth="0.7" />
                            </g>
                            
                            <g transform={`translate(${stepPhase === 2 ? 1 : 0} ${stepPhase === 2 ? 2 : 0}) rotate(-8 53 122)`}>
                                <ellipse cx="53" cy="122" rx="7" ry="3.5" fill="#1a1a1a" />
                                <ellipse cx="53" cy="121" rx="6.5" ry="3" fill="#252525" />
                                <rect x="48" y="116" width="10" height="7" rx="2" fill="#2a2a2a" />
                                <rect x="49" y="117" width="8" height="5" rx="1.5" fill="#353535" />
                                <line x1="51" y1="118" x2="55" y2="118" stroke="#505050" strokeWidth="0.6" />
                                <line x1="51" y1="120" x2="55" y2="120" stroke="#505050" strokeWidth="0.6" />
                                <ellipse cx="53" cy="121" rx="4.5" ry="2" fill="#3a3a3a" />
                                <line x1="49" y1="122" x2="57" y2="122" stroke="#0a0a0a" strokeWidth="0.7" />
                            </g>
                        </svg>
                        
                        {/* Shadow */}
                        <div 
                            className="absolute left-1/2 -translate-x-1/2 rounded-full blur-lg"
                            style={{ 
                                top: '128px',
                                width: '55px',
                                height: '14px',
                                background: 'radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.25) 50%, transparent 100%)'
                            }}
                        />
                    </div>
    
                    {/* HUD */}
                    <div className="absolute top-4 left-4 right-4 z-50 flex justify-between items-start gap-3">
                        <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                            <div className="flex items-center gap-2 mb-1">
                                <Mountain className="w-4 h-4 text-emerald-400" />
                                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
                            </div>
                            <div className="text-3xl font-bold text-white">
                                {userData.altitude.toLocaleString()}
                                <span className="text-base text-slate-400 ml-1">m</span>
                            </div>
                            <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                                <div 
                                    className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all duration-500 shadow-lg shadow-emerald-500/50"
                                    style={{ width: `${progressPercent}%` }}
                                />
                            </div>
                            <div className="text-xs text-slate-400 mt-1">
                                {Math.round(progressPercent)}% to summit
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
                            <div className="flex items-center gap-2 mb-1">
                                <div className="w-3 h-3 rounded-full animate-pulse" style={{ backgroundColor: getOxygenColor(userData.oxygen) }} />
                                <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
                            </div>
                            <div 
                                className="text-3xl font-bold transition-colors duration-500"
                                style={{ color: getOxygenColor(userData.oxygen) }}
                            >
                                {userData.oxygen}
                                <span className="text-base text-slate-400">%</span>
                            </div>
                            <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                                <div 
                                    className="h-full transition-all duration-500"
                                    style={{ 
                                        width: `${userData.oxygen}%`,
                                        backgroundColor: getOxygenColor(userData.oxygen),
                                        boxShadow: `0 0 10px ${getOxygenColor(userData.oxygen)}80`
                                    }}
                                />
                            </div>
                            <div className="text-xs text-slate-400 mt-1">
                                {userData.oxygen >= 70 ? 'Strong' : userData.oxygen >= 50 ? 'Moderate' : userData.oxygen >= 30 ? 'Weak' : 'Critical'}
                            </div>
                        </div>
                    </div>

                    {/* Habit Buttons */}
                    <div className="absolute left-4 right-4 z-50" style={{ bottom: '80px' }}>
                        <div className="bg-white/98 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
                            <div className="grid grid-cols-4 gap-3">
                                {habits.map((habit, index) => {
                                    const Icon = habit.icon;
                                    const colors = [
                                        { from: 'from-blue-500', to: 'to-cyan-500', glow: 'shadow-blue-500/50' },
                                        { from: 'from-indigo-500', to: 'to-purple-500', glow: 'shadow-indigo-500/50' },
                                        { from: 'from-green-500', to: 'to-emerald-500', glow: 'shadow-green-500/50' },
                                        { from: 'from-purple-500', to: 'to-pink-500', glow: 'shadow-purple-500/50' }
                                    ];
                                    const color = colors[index];
                                    
                                    return (
                                        <button
                                            key={habit.id}
                                            onClick={() => completeHabit(habit.id)}
                                            disabled={habit.completed || isClimbing}
                                            className={`
                                                relative aspect-square rounded-2xl transition-all duration-300 flex flex-col items-center justify-center gap-2
                                                ${habit.completed 
                                                    ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95' 
                                                    : `bg-gradient-to-br ${color.from} ${color.to} hover:scale-105 active:scale-95 shadow-xl ${color.glow}`
                                                }
                                                ${isClimbing && !habit.completed ? 'opacity-50 cursor-not-allowed' : ''}
                                            `}
                                        >
                                            {!habit.completed && (
                                                <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl" />
                                            )}
                                            
                                            <Icon 
                                                className={`w-7 h-7 ${habit.completed ? 'text-emerald-600' : 'text-white drop-shadow-lg'}`}
                                                strokeWidth={2.5}
                                            />
                                            <span className={`text-xs font-bold ${habit.completed ? 'text-emerald-700' : 'text-white drop-shadow'}`}>
                                                {habit.completed ? '✓ Done' : `+${habit.oxygen}%`}
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>
                            
                            <div className="text-center mt-4 pt-3 border-t border-slate-200">
                                <div className="flex items-center justify-center gap-2">
                                    <div className="flex gap-1">
                                        {habits.map((h, i) => (
                                            <div 
                                                key={i} 
                                                className={`w-2 h-2 rounded-full transition-all duration-300 ${
                                                    h.completed ? 'bg-emerald-500 scale-125' : 'bg-slate-300'
                                                }`}
                                            />
                                        ))}
                                    </div>
                                    <span className="text-sm text-slate-600 font-medium ml-2">
                                        {habits.filter(h => h.completed).length} / 4 completed
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {userData.altitude >= 2000 && userData.altitude < 2270 && (
                        <div className="absolute top-1/3 left-1/2 -translate-x-1/2 z-50 animate-bounce">
                            <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl border-2 border-white/50">
                                🎯 2,000m Milestone!
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<MountainView />, document.getElementById('root'));
    </script>
</body>
</html>
