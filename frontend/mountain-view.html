<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Vivify – Mountain Climb</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/pixi.js@8/dist/pixi.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#1a1a2e}
    .safe{padding-bottom:env(safe-area-inset-bottom)}
  </style>
</head>
<body>
  <div id="scene" class="w-screen h-screen"></div>
  <div id="hud"></div>

  <script type="text/babel">
const lerp = (a,b,t)=>a+(b-a)*t;
const hex = (c) => {
  if (typeof c === 'number') return c;
  if (!c) return 0x000000;
  let s = String(c).trim();
  if (s[0] === '#') s = s.slice(1);
  if (s.length === 3) s = s.split('').map(ch => ch + ch).join('');
  return parseInt(s,16);
};

function envFromAltitude(alt){
  if (alt < 1000) return { 
    name:'Forest Base', 
    skyTop:'#87CEEB', skyMid:'#B8D7F0', skyBot:'#E8F4F8',
    sunColor:'#FFF5E1',
    far1:'#C5D5E4', far2:'#B0C5D9', far3:'#9BB5CE',
    mid1:'#8AA5BA', mid2:'#7595AA', mid3:'#60859A',
    near:'#50758A',
    groundTop:'#87A96B', groundMid:'#6B8E4F', groundBot:'#4F7239',
    trailTop:'#8B7355', trailBot:'#6B5335',
    treeColor:'#2D5016', treeTrunk:'#4A3428',
    particles: 'leaves'
  };
  if (alt < 2000) return { 
    name:'Mountain Trail', 
    skyTop:'#6FA8D1', skyMid:'#94C3E0', skyBot:'#C5E1F0',
    sunColor:'#FFF8DC',
    far1:'#B5C5D5', far2:'#A0B0C5', far3:'#8B9BB0',
    mid1:'#7A8A9F', mid2:'#657585', mid3:'#50606F',
    near:'#3F4F5F',
    groundTop:'#7A9B6E', groundMid:'#5F7D52', groundBot:'#445F3A',
    trailTop:'#8B7964', trailBot:'#6B5944',
    treeColor:'#3D5520', treeTrunk:'#3A2818',
    particles: 'birds'
  };
  if (alt < 3000) return { 
    name:'Alpine Zone', 
    skyTop:'#5A8CB4', skyMid:'#7FA8C8', skyBot:'#A8C8DC',
    sunColor:'#FFFACD',
    far1:'#A8B8C8', far2:'#8FA3B3', far3:'#768A9E',
    mid1:'#657589', mid2:'#50606F', mid3:'#3B4B5B',
    near:'#2F3F4F',
    groundTop:'#909090', groundMid:'#707070', groundBot:'#505050',
    trailTop:'#9B8B7B', trailBot:'#7B6B5B',
    treeColor:'#556B2F', treeTrunk:'#3A3A3A',
    particles: 'wind'
  };
  return { 
    name:'Summit Ridge', 
    skyTop:'#4A7099', skyMid:'#6A8FB4', skyBot:'#8FADC8',
    sunColor:'#FFFFF0',
    far1:'#9AAABA', far2:'#7A8A9A', far3:'#5A6A7A',
    mid1:'#505F6F', mid2:'#3F4F5F', mid3:'#2E3E4E',
    near:'#1E2E3E',
    groundTop:'#D8E4F0', groundMid:'#B8C8D8', groundBot:'#98A8B8',
    trailTop:'#C8D5E0', trailBot:'#A8B5C0',
    treeColor:'#E0F0FF', treeTrunk:'#C0D0E0',
    particles: 'snow'
  };
}

/* ========== HUD Component ========== */
const IconMountain=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>);
const Drop =(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3.1S6 9.1 6 12.6a6 6 0 0 0 12 0C18 9.1 12 3.1 12 3.1z"/></svg>);
const Moon =(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3a9 9 0 1 0 9 9 6 6 0 0 1-9-9Z"/></svg>);
const Steps=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="7" cy="14" r="3"/><circle cx="17" cy="10" r="3"/></svg>);
const Target=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>);

function Hud(){
  const {useState, useMemo, useEffect} = React;
  const [vw, setVw] = useState(window.innerWidth);
  const [vh, setVh] = useState(window.innerHeight);
  useEffect(()=>{ 
    const onR=()=>{setVw(window.innerWidth); setVh(window.innerHeight)}; 
    window.addEventListener('resize',onR); 
    return ()=>window.removeEventListener('resize',onR);
  },[]);
  const isPhone = (vw < 420) || (vh < 740);

  const [data, setData] = useState({ altitude:200, target:3776, oxygen:78 });
  const [climbing, setClimbing] = useState(false);
  const [habits, setHabits] = useState([
    { id:'water',  name:'Water',  icon:Drop,   oxygen:15, done:false },
    { id:'sleep',  name:'Sleep',  icon:Moon,   oxygen:20, done:false },
    { id:'move',   name:'Move',   icon:Steps,  oxygen:15, done:false },
    { id:'focus',  name:'Focus',  icon:Target, oxygen:20, done:false },
  ]);

  const env = useMemo(()=>envFromAltitude(data.altitude), [data.altitude]);
  useEffect(()=>{
    window.MountainAPI?.updateAltitude(data.altitude);
  }, [data.altitude]);

  const progress = Math.min(100, (data.altitude / data.target) * 100);
  const oxyColor = data.oxygen >= 70 ? '#10b981' : data.oxygen >= 50 ? '#f59e0b' : data.oxygen >= 30 ? '#f97316' : '#ef4444';

  function completeHabit(h){
    if (h.done || climbing) return;
    setClimbing(true);

    const altGain = 270;
    window.MountainAPI?.climbForward(altGain);

    const tmp = { alt: data.altitude };
    gsap.to(tmp,{
      alt: Math.min(data.altitude + altGain, data.target),
      duration: 1.4, 
      ease:'power2.out',
      onUpdate: ()=>setData(p=>({...p, altitude: tmp.alt})),
      onComplete: ()=>setClimbing(false)
    });

    setData(p=>({...p, oxygen: Math.min(p.oxygen + h.oxygen, 100)}));
    setHabits(p=>p.map(x=>x.id===h.id?{...x,done:true}:x));
  }

  return (
    <div className="pointer-events-none safe">
      <div className="absolute top-4 left-4 right-4 flex justify-between gap-3">
        <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
          <div className="flex items-center gap-2 mb-1">
            <IconMountain className="w-4 h-4 text-emerald-400"/>
            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
          </div>
          <div className="text-3xl font-bold text-white">
            {Math.round(data.altitude).toLocaleString()}<span className="text-base text-slate-400 ml-1">m</span>
          </div>
          <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all" style={{width:`${progress}%`}}/>
          </div>
          <div className="text-xs text-slate-400 mt-1">{Math.round(progress)}% to summit</div>
        </div>

        <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
          <div className="flex items-center gap-2 mb-1">
            <div className="w-3 h-3 rounded-full animate-pulse" style={{backgroundColor:oxyColor}}/>
            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
          </div>
          <div className="text-3xl font-bold" style={{color:oxyColor}}>
            {Math.round(data.oxygen)}<span className="text-base text-slate-400">%</span>
          </div>
          <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
            <div className="h-full transition-all" style={{width:`${data.oxygen}%`, backgroundColor:oxyColor, boxShadow:`0 0 10px ${oxyColor}80`}}/>
          </div>
          <div className="text-xs text-slate-400 mt-1">
            {data.oxygen>=70?'Strong':data.oxygen>=50?'Moderate':data.oxygen>=30?'Weak':'Critical'}
          </div>
        </div>
      </div>

      <div className="absolute left-4 right-4"
           style={{bottom: isPhone ? '16px' : '72px', transform: isPhone?'scale(0.92)':'scale(1)', transformOrigin:'center bottom'}}>
        <div className="pointer-events-auto bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
          <div className="grid grid-cols-4 gap-3">
            {habits.map((h,i)=>{
              const Icon = h.icon;
              const colors = [
                ['from-blue-500','to-cyan-500','shadow-blue-500/50'],
                ['from-indigo-500','to-purple-500','shadow-indigo-500/50'],
                ['from-green-500','to-emerald-500','shadow-green-500/50'],
                ['from-purple-500','to-pink-500','shadow-purple-500/50'],
              ][i];
              return (
                <button key={h.id} onClick={()=>completeHabit(h)} disabled={h.done||climbing}
                  className={`relative aspect-square rounded-2xl transition-all flex flex-col items-center justify-center gap-2
                    ${h.done
                      ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95'
                      : `bg-gradient-to-br ${colors[0]} ${colors[1]} hover:scale-105 active:scale-95 shadow-xl ${colors[2]}`
                    } ${climbing&&!h.done?'opacity-50 cursor-not-allowed':''}`}>
                  {!h.done && <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl"/>}
                  <Icon className={`w-7 h-7 ${h.done?'text-emerald-700':'text-white drop-shadow'}`}/>
                  <span className={`text-xs font-bold ${h.done?'text-emerald-700':'text-white'}`}>{h.done?'✓ Done':`+${h.oxygen}%`}</span>
                </button>
              );
            })}
          </div>
          <div className="text-center mt-4 pt-3 border-t border-slate-200">
            <div className="flex items-center justify-center gap-2">
              <div className="flex gap-1">
                {habits.map((h,i)=>(<div key={i} className={`w-2 h-2 rounded-full transition-all ${h.done?'bg-emerald-500 scale-125':'bg-slate-300'}`}/>))}
              </div>
              <span className="text-sm text-slate-600 font-medium ml-2">
                {habits.filter(x=>x.done).length} / 4 completed
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========== PIXI Scene ========== */
const UI_PAD = 220;

(async () => {
  const app = new PIXI.Application();
  await app.init({ 
    resizeTo: window, 
    antialias:true, 
    backgroundAlpha:1,
    autoDensity:true,
    resolution: window.devicePixelRatio || 1
  });
  document.getElementById('scene').appendChild(app.canvas);

  let W = app.screen.width;
  let H = app.screen.height;
  let currentAlt = 200;

  // Layers (back to front)
  const skyContainer = new PIXI.Container();
  const sunContainer = new PIXI.Container();
  const cloudContainer = new PIXI.Container();
  const far1Container = new PIXI.Container();
  const far2Container = new PIXI.Container();
  const far3Container = new PIXI.Container();
  const mid1Container = new PIXI.Container();
  const mid2Container = new PIXI.Container();
  const mid3Container = new PIXI.Container();
  const nearContainer = new PIXI.Container();
  const groundContainer = new PIXI.Container();
  const trailContainer = new PIXI.Container();
  const foliageContainer = new PIXI.Container();
  const actorContainer = new PIXI.Container();
  const particleContainer = new PIXI.Container();
  
  app.stage.addChild(
    skyContainer, sunContainer, cloudContainer,
    far1Container, far2Container, far3Container,
    mid1Container, mid2Container, mid3Container,
    nearContainer, groundContainer, trailContainer,
    foliageContainer, actorContainer, particleContainer
  );

  let env = envFromAltitude(currentAlt);

  /* ===== SKY WITH GRADIENT ===== */
  function createSky(){
    skyContainer.removeChildren();
    
    const canvas = document.createElement('canvas');
    canvas.width = W;
    canvas.height = H * 0.7;
    const ctx = canvas.getContext('2d');
    
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, env.skyTop);
    gradient.addColorStop(0.5, env.skyMid);
    gradient.addColorStop(1, env.skyBot);
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    const texture = PIXI.Texture.from(canvas);
    const sprite = new PIXI.Sprite(texture);
    skyContainer.addChild(sprite);
  }

  /* ===== SUN ===== */
  function createSun(){
    sunContainer.removeChildren();
    
    const sun = new PIXI.Graphics();
    sun.beginFill(hex(env.sunColor), 0.85);
    sun.drawCircle(0, 0, 70);
    sun.endFill();
    
    sun.x = W * 0.8;
    sun.y = H * 0.15;
    
    // Soft glow
    sun.filters = [new PIXI.BlurFilter(4)];
    sunContainer.addChild(sun);
  }

  /* ===== CLOUDS ===== */
  function createClouds(){
    cloudContainer.removeChildren();
    
    function makeCloud(x, y, scale){
      const cloud = new PIXI.Graphics();
      cloud.beginFill(0xFFFFFF, 0.4);
      cloud.drawCircle(0, 0, 30 * scale);
      cloud.drawCircle(25 * scale, -5 * scale, 25 * scale);
      cloud.drawCircle(-25 * scale, -5 * scale, 25 * scale);
      cloud.drawCircle(45 * scale, 5 * scale, 20 * scale);
      cloud.drawCircle(-45 * scale, 5 * scale, 20 * scale);
      cloud.endFill();
      
      cloud.x = x;
      cloud.y = y;
      cloud.filters = [new PIXI.BlurFilter(2)];
      cloudContainer.addChild(cloud);
      
      // Drift animation
      gsap.to(cloud, {
        x: cloud.x + W + 200,
        duration: 120 / scale,
        ease: 'none',
        repeat: -1,
        onRepeat: ()=> cloud.x = -200
      });
    }
    
    makeCloud(-100, H * 0.15, 1.2);
    makeCloud(W * 0.3, H * 0.22, 0.9);
    makeCloud(W * 0.7, H * 0.18, 1.0);
  }

  /* ===== MOUNTAIN LAYER (Smooth Bezier Curves) ===== */
  function createMountainLayer(container, color, baseY, amplitude, frequency, blur){
    container.removeChildren();
    
    const graphics = new PIXI.Graphics();
    graphics.beginFill(hex(color));
    
    const segments = 100;
    const width = W * 2; // Extra width for scrolling
    
    graphics.moveTo(-W * 0.5, H);
    graphics.lineTo(-W * 0.5, baseY);
    
    // Smooth mountain silhouette using bezier
    for(let i = 0; i <= segments; i++){
      const x = (-W * 0.5) + (width / segments) * i;
      const wave = Math.sin(i * frequency) * amplitude;
      const y = baseY - amplitude * 0.5 + wave;
      
      if(i === 0){
        graphics.lineTo(x, y);
      } else {
        const prevX = (-W * 0.5) + (width / segments) * (i - 1);
        const prevWave = Math.sin((i - 1) * frequency) * amplitude;
        const prevY = baseY - amplitude * 0.5 + prevWave;
        
        const cpX = (prevX + x) / 2;
        const cpY = (prevY + y) / 2;
        
        graphics.quadraticCurveTo(cpX, cpY, x, y);
      }
    }
    
    graphics.lineTo(W * 1.5, H);
    graphics.closePath();
    graphics.endFill();
    
    if(blur > 0){
      graphics.filters = [new PIXI.BlurFilter(blur)];
    }
    
    container.addChild(graphics);
  }

  /* ===== GROUND WITH TEXTURE ===== */
  function createGround(){
    groundContainer.removeChildren();
    
    const canvas = document.createElement('canvas');
    canvas.width = W * 2;
    canvas.height = H * 0.35;
    const ctx = canvas.getContext('2d');
    
    // Gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, env.groundTop);
    gradient.addColorStop(0.6, env.groundMid);
    gradient.addColorStop(1, env.groundBot);
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Add texture noise
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    for(let i = 0; i < 5000; i++){
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      const size = Math.random() * 2;
      ctx.fillRect(x, y, size, size);
    }
    
    const texture = PIXI.Texture.from(canvas);
    const sprite = new PIXI.Sprite(texture);
    sprite.y = H * 0.65;
    groundContainer.addChild(sprite);
  }

  /* ===== TRAIL PATH ===== */
  function createTrail(){
    trailContainer.removeChildren();
    
    const canvas = document.createElement('canvas');
    canvas.width = W * 3;
    canvas.height = 100;
    const ctx = canvas.getContext('2d');
    
    // Trail gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, env.trailTop);
    gradient.addColorStop(1, env.trailBot);
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Trail texture
    ctx.fillStyle = 'rgba(0,0,0,0.1)';
    for(let i = 0; i < 2000; i++){
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height;
      ctx.fillRect(x, y, 1, 1);
    }
    
    // Trail edges (darker)
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, 0, canvas.width, 8);
    ctx.fillRect(0, canvas.height - 8, canvas.width, 8);
    
    const texture = PIXI.Texture.from(canvas);
    const sprite = new PIXI.Sprite(texture);
    sprite.y = H * 0.70;
    trailContainer.addChild(sprite);
  }

  /* ===== TREES (Realistic) ===== */
  function createTree(scale, isDense){
    const tree = new PIXI.Container();
    
    // Trunk
    const trunk = new PIXI.Graphics();
    trunk.beginFill(hex(env.treeTrunk));
    trunk.drawRoundedRect(-6 * scale, 0, 12 * scale, 50 * scale, 3 * scale);
    trunk.endFill();
    tree.addChild(trunk);
    
    // Foliage (layered circles for depth)
    const foliage = new PIXI.Graphics();
    foliage.beginFill(hex(env.treeColor), 0.9);
    
    if(isDense){
      // Dense forest tree
      foliage.drawCircle(0, -30 * scale, 35 * scale);
      foliage.drawCircle(-20 * scale, -20 * scale, 28 * scale);
      foliage.drawCircle(20 * scale, -20 * scale, 28 * scale);
      foliage.drawCircle(0, -50 * scale, 25 * scale);
    } else {
      // Sparse tree
      foliage.drawCircle(0, -25 * scale, 25 * scale);
      foliage.drawCircle(-15 * scale, -15 * scale, 20 * scale);
      foliage.drawCircle(15 * scale, -15 * scale, 20 * scale);
    }
    
    foliage.endFill();
    tree.addChild(foliage);
    
    return tree;
  }

  function populateFoliage(){
    foliageContainer.removeChildren();
    
    const zone = env.name;
    const count = zone === 'Forest Base' ? 25 : zone === 'Mountain Trail' ? 15 : zone === 'Alpine Zone' ? 8 : 4;
    
    for(let i = 0; i < count; i++){
      const x = (i * 180) - 500;
      const y = H * 0.68;
      const scale = 0.7 + Math.random() * 0.5;
      const isDense = zone === 'Forest Base';
      
      if(zone !== 'Summit Ridge'){
        const tree = createTree(scale, isDense);
        tree.x = x;
        tree.y = y;
        foliageContainer.addChild(tree);
      } else {
        // Ice crystals for summit
        const crystal = new PIXI.Graphics();
        crystal.beginFill(hex(env.treeColor), 0.6);
        crystal.drawPolygon([
          0, -20, 10, 0, 0, 5, -10, 0
        ]);
        crystal.endFill();
        crystal.x = x;
        crystal.y = y;
        foliageContainer.addChild(crystal);
      }
    }
  }

  /* ===== PARTICLES ===== */
  const particles = [];
  
  function createParticles(){
    particles.forEach(p => particleContainer.removeChild(p));
    particles.length = 0;
    
    const type = env.particles;
    const count = 15;
    
    for(let i = 0; i < count; i++){
      const p = new PIXI.Graphics();
      
      if(type === 'leaves'){
        p.beginFill(0x8FBC8F, 0.6);
        p.drawPolygon([0, -5, 3, 0, 0, 5, -3, 0]);
        p.endFill();
      } else if(type === 'birds'){
        p.lineStyle(2, 0x000000, 0.4);
        p.moveTo(-6, 0);
        p.quadraticCurveTo(-3, -3, 0, 0);
        p.quadraticCurveTo(3, -3, 6, 0);
      } else if(type === 'wind'){
        p.lineStyle(2, 0xFFFFFF, 0.3);
        p.moveTo(0, 0);
        p.lineTo(20, 0);
      } else if(type === 'snow'){
        p.beginFill(0xFFFFFF, 0.8);
        p.drawCircle(0, 0, 3);
        p.endFill();
      }
      
      p.x = Math.random() * W;
      p.y = Math.random() * H * 0.6;
      particleContainer.addChild(p);
      particles.push(p);
      
      // Animation
      const speed = type === 'birds' ? 40 : 60;
      const amplitude = type === 'snow' ? 30 : 10;
      
      gsap.to(p, {
        x: p.x + W + 100,
        y: p.y + (Math.random() - 0.5) * amplitude,
        duration: speed + Math.random() * 20,
        ease: 'none',
        repeat: -1,
        onRepeat: ()=> {
          p.x = -100;
          p.y = Math.random() * H * 0.6;
        }
      });
    }
  }

  /* ===== CLIMBER ===== */
  const climber = new PIXI.Container();
  
  function createClimber(){
    climber.removeChildren();
    
    // Shadow
    const shadow = new PIXI.Graphics();
    shadow.beginFill(0x000000, 0.3);
    shadow.drawEllipse(0, 38, 30, 9);
    shadow.endFill();
    climber.addChild(shadow);
    
    // Legs
    const leftLeg = new PIXI.Graphics();
    leftLeg.beginFill(0x1a1a2e);
    leftLeg.drawRoundedRect(-14, 12, 11, 26, 6);
    leftLeg.endFill();
    climber.addChild(leftLeg);
    
    const rightLeg = new PIXI.Graphics();
    rightLeg.beginFill(0x1a1a2e);
    rightLeg.drawRoundedRect(3, 12, 11, 26, 6);
    rightLeg.endFill();
    climber.addChild(rightLeg);
    
    // Body
    const body = new PIXI.Graphics();
    body.beginFill(0x2a2a3e);
    body.drawRoundedRect(-13, -26, 26, 40, 9);
    body.endFill();
    climber.addChild(body);
    
    // Arms
    const leftArm = new PIXI.Graphics();
    leftArm.beginFill(0x2a2a3e);
    leftArm.drawRoundedRect(-24, -20, 11, 24, 6);
    leftArm.endFill();
    climber.addChild(leftArm);
    
    const rightArm = new PIXI.Graphics();
    rightArm.beginFill(0x2a2a3e);
    rightArm.drawRoundedRect(13, -20, 11, 24, 6);
    rightArm.endFill();
    climber.addChild(rightArm);
    
    // Head
    const head = new PIXI.Graphics();
    head.beginFill(0xf4c2a6);
    head.drawCircle(0, -35, 12);
    head.endFill();
    climber.addChild(head);
    
    // Beanie
    const beanie = new PIXI.Graphics();
    beanie.beginFill(0xe24d4d);
    beanie.drawEllipse(0, -41, 13, 8);
    beanie.endFill();
    beanie.beginFill(0xf06a6a);
    beanie.drawRoundedRect(-13, -39, 26, 5, 2);
    beanie.endFill();
    beanie.beginFill(0xf06a6a);
    beanie.drawCircle(0, -47, 4);
    beanie.endFill();
    climber.addChild(beanie);
    
    // Backpack
    const backpack = new PIXI.Graphics();
    backpack.beginFill(0x4a5a6a);
    backpack.drawRoundedRect(-10, -22, 20, 28, 5);
    backpack.endFill();
    backpack.lineStyle(2, 0x3a4a5a);
    backpack.moveTo(-8, -15);
    backpack.lineTo(8, -15);
    backpack.moveTo(-8, -8);
    backpack.lineTo(8, -8);
    backpack.x = 0;
    backpack.y = 2;
    backpack.alpha = 0.9;
    climber.addChild(backpack);
    
    climber.x = W * 0.25;
    climber.y = H * 0.70 + 48;
    actorContainer.addChild(climber);
  }

  /* ===== FULL LAYOUT ===== */
  function fullLayout(){
    W = app.screen.width;
    H = app.screen.height;
    
    createSky();
    createSun();
    createClouds();
    
    // 9 mountain layers for depth
    createMountainLayer(far1Container, env.far1, H * 0.45, 100, 0.15, 6);
    createMountainLayer(far2Container, env.far2, H * 0.48, 110, 0.18, 5);
    createMountainLayer(far3Container, env.far3, H * 0.51, 120, 0.21, 4);
    
    createMountainLayer(mid1Container, env.mid1, H * 0.54, 95, 0.24, 3);
    createMountainLayer(mid2Container, env.mid2, H * 0.57, 105, 0.27, 2);
    createMountainLayer(mid3Container, env.mid3, H * 0.60, 115, 0.30, 1);
    
    createMountainLayer(nearContainer, env.near, H * 0.63, 90, 0.33, 0);
    
    createGround();
    createTrail();
    populateFoliage();
    createParticles();
    createClimber();
  }

  window.addEventListener('resize', fullLayout);

  /* ===== PARALLAX ANIMATION ===== */
  let isClimbing = false;
  
  function climbForward(meters){
    if(isClimbing) return;
    isClimbing = true;
    
    const distance = meters * 2.5;
    const duration = 1.4;
    
    // Parallax speeds (slower = further away)
    gsap.to(cloudContainer, { x: cloudContainer.x - distance * 0.02, duration, ease:'power2.out' });
    
    gsap.to(far1Container, { x: far1Container.x - distance * 0.05, duration, ease:'power2.out' });
    gsap.to(far2Container, { x: far2Container.x - distance * 0.08, duration, ease:'power2.out' });
    gsap.to(far3Container, { x: far3Container.x - distance * 0.12, duration, ease:'power2.out' });
    
    gsap.to(mid1Container, { x: mid1Container.x - distance * 0.20, duration, ease:'power2.out' });
    gsap.to(mid2Container, { x: mid2Container.x - distance * 0.30, duration, ease:'power2.out' });
    gsap.to(mid3Container, { x: mid3Container.x - distance * 0.40, duration, ease:'power2.out' });
    
    gsap.to(nearContainer, { x: nearContainer.x - distance * 0.50, duration, ease:'power2.out' });
    gsap.to(groundContainer, { x: groundContainer.x - distance * 0.85, duration, ease:'power2.out' });
    gsap.to(trailContainer, { x: trailContainer.x - distance * 1.0, duration, ease:'power2.out' });
    gsap.to(foliageContainer, { x: foliageContainer.x - distance * 0.70, duration, ease:'power2.out' });
    
    // Climber animation with rotation
    const tl = gsap.timeline({
      onComplete: ()=> {
        isClimbing = false;
        
        // Screen shake on landing
        gsap.to(app.stage, {
          x: 0,
          y: 0,
          duration: 0.1,
          yoyo: true,
          repeat: 3,
          ease: 'power2.inOut'
        });
        
        // Dust puff
        spawnDust(climber.x, climber.y);
      }
    });
    
    tl.to(climber, { 
      y: climber.y - 140, 
      duration: duration * 0.4, 
      ease:'power2.out' 
    }, 0);
    
    tl.to(climber, { 
      y: climber.y, 
      duration: duration * 0.6, 
      ease:'bounce.out' 
    }, duration * 0.4);
    
    tl.to(climber, { 
      rotation: Math.PI * 2, 
      duration, 
      ease:'power2.inOut' 
    }, 0);
    
    // Shadow squash
    const shadow = climber.children[0];
    tl.to(shadow.scale, { x: 1.3, y: 0.5, duration: duration * 0.4, ease:'power2.out' }, 0);
    tl.to(shadow.scale, { x: 1.0, y: 1.0, duration: duration * 0.6, ease:'power2.out' }, duration * 0.4);
  }

  /* ===== DUST EFFECT ===== */
  function spawnDust(x, y){
    const dustCount = 8;
    for(let i = 0; i < dustCount; i++){
      const dust = new PIXI.Graphics();
      dust.beginFill(0xD2B48C, 0.4);
      dust.drawCircle(0, 0, 8 + Math.random() * 6);
      dust.endFill();
      dust.filters = [new PIXI.BlurFilter(2)];
      
      dust.x = x + (Math.random() - 0.5) * 40;
      dust.y = y + (Math.random() - 0.5) * 20;
      particleContainer.addChild(dust);
      
      const angle = (Math.random() - 0.5) * Math.PI;
      const speed = 30 + Math.random() * 40;
      
      gsap.to(dust, {
        x: dust.x + Math.cos(angle) * speed,
        y: dust.y + Math.sin(angle) * speed - 20,
        alpha: 0,
        duration: 0.6 + Math.random() * 0.3,
        ease: 'power2.out',
        onComplete: ()=> {
          particleContainer.removeChild(dust);
          dust.destroy();
        }
      });
    }
  }

  /* ===== ALTITUDE UPDATE ===== */
  function updateAltitude(newAlt){
    currentAlt = newAlt;
    const newEnv = envFromAltitude(newAlt);
    
    // Smooth transition if zone changes
    if(newEnv.name !== env.name){
      env = newEnv;
      
      // Fade transition
      const fade = new PIXI.Graphics();
      fade.beginFill(0x000000, 0);
      fade.drawRect(0, 0, W, H);
      fade.endFill();
      app.stage.addChild(fade);
      
      gsap.to(fade, {
        alpha: 0.3,
        duration: 0.3,
        yoyo: true,
        repeat: 1,
        onComplete: ()=> {
          app.stage.removeChild(fade);
          fade.destroy();
        }
      });
      
      // Rebuild scene with new environment
      setTimeout(()=> fullLayout(), 300);
    }
  }

  /* ===== IDLE ANIMATIONS ===== */
  function startIdleAnimations(){
    // Gentle sway for climber
    gsap.to(climber, {
      rotation: 0.05,
      duration: 2,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut'
    });
    
    // Breathing animation
    const body = climber.children.find(c => c instanceof PIXI.Graphics && c.geometry);
    if(body){
      gsap.to(body.scale, {
        y: 1.03,
        duration: 1.5,
        yoyo: true,
        repeat: -1,
        ease: 'sine.inOut'
      });
    }
  }

  /* ===== API ===== */
  window.MountainAPI = {
    climbForward,
    updateAltitude
  };

  // Initialize
  fullLayout();
  startIdleAnimations();
  
  ReactDOM.createRoot(document.getElementById('hud')).render(React.createElement(Hud));
})();
  </script>
</body>
