<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Vivify – Mt. Fuji Climb</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/pixi.js@8/dist/pixi.min.js"></script>
  <script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    html,body{height:100%;margin:0;overflow:hidden;background:#0a0e1a}
    .safe{padding-bottom:env(safe-area-inset-bottom)}
  </style>
</head>
<body>
  <div id="scene" class="w-screen h-screen"></div>
  <div id="hud"></div>

  <script type="text/babel">
const lerp = (a,b,t)=>a+(b-a)*t;
const hex = (c) => {
  if (typeof c === 'number') return c;
  if (!c) return 0x000000;
  let s = String(c).trim();
  if (s[0] === '#') s = s.slice(1);
  if (s.length === 3) s = s.split('').map(ch => ch + ch).join('');
  return parseInt(s,16);
};

function envFromAltitude(alt){
  if (alt < 1000) return { 
    name:'Forest Base', 
    skyTop:'#87CEEB', skyMid:'#B8D7F0', skyBot:'#E8F4F8',
    sunColor:'#FFE4B5', sunGlow:'#FFD700',
    fujiPeak:'#E8F0F8', fujiMid:'#C8D8E8', fujiBase:'#A8B8C8',
    farMtn1:'#B8C8D8', farMtn2:'#98A8B8', farMtn3:'#7888A8',
    groundTop:'#8BA870', groundMid:'#658745', groundBot:'#4A6B30',
    trailColor:'#8B7355', trailDark:'#6B5335',
    treeTop:'#4A7C3B', treeMid:'#356428', treeDark:'#2D5420',
    grassLight:'#7A9B5F', grassDark:'#5A7B3F',
    particles: 'leaves', particleColor: 0x8FBC8F
  };
  if (alt < 2000) return { 
    name:'Mountain Trail', 
    skyTop:'#6FA8D1', skyMid:'#94C3E0', skyBot:'#C5E1F0',
    sunColor:'#FFE8C5', sunGlow:'#FFD700',
    fujiPeak:'#F0F8FF', fujiMid:'#D8E8F8', fujiBase:'#B8C8D8',
    farMtn1:'#A8B8C8', farMtn2:'#8898A8', farMtn3:'#687888',
    groundTop:'#8B9B7A', groundMid:'#6B7B5A', groundBot:'#4B5B3A',
    trailColor:'#9B8B7B', trailDark:'#7B6B5B',
    treeTop:'#5A7C4B', treeMid:'#3A5C2B', treeDark:'#2A4C1B',
    grassLight:'#8A9B6F', grassDark:'#6A7B4F',
    particles: 'birds', particleColor: 0x4A4A4A
  };
  if (alt < 3000) return { 
    name:'Alpine Zone', 
    skyTop:'#5A8CB4', skyMid:'#7FA8C8', skyBot:'#A8C8DC',
    sunColor:'#FFF8DC', sunGlow:'#FFE4B5',
    fujiPeak:'#FFFFFF', fujiMid:'#E8F0F8', fujiBase:'#C8D8E8',
    farMtn1:'#98A8B8', farMtn2:'#788898', farMtn3:'#586878',
    groundTop:'#9B9B9B', groundMid:'#7B7B7B', groundBot:'#5B5B5B',
    trailColor:'#ABABAB', trailDark:'#8B8B8B',
    treeTop:'#6A7A5A', treeMid:'#4A5A3A', treeDark:'#3A4A2A',
    grassLight:'#8B8B8B', grassDark:'#6B6B6B',
    particles: 'wind', particleColor: 0xCCCCCC
  };
  return { 
    name:'Summit Ridge', 
    skyTop:'#4A7099', skyMid:'#6A8FB4', skyBot:'#8FADC8',
    sunColor:'#FFFAF0', sunGlow:'#FFE4B5',
    fujiPeak:'#FFFFFF', fujiMid:'#F8F8FF', fujiBase:'#E8E8F8',
    farMtn1:'#8898A8', farMtn2:'#687888', farMtn3:'#485868',
    groundTop:'#D8E4F0', groundMid:'#B8C8D8', groundBot:'#98A8B8',
    trailColor:'#C8D5E0', trailDark:'#A8B5C0',
    treeTop:'#E0F0FF', treeMid:'#C0D8F0', treeDark:'#A0C0E0',
    grassLight:'#C8D8E8', grassDark:'#A8B8C8',
    particles: 'snow', particleColor: 0xFFFFFF
  };
}

/* ========== HUD Component ========== */
const IconMountain=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>);
const Drop =(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3.1S6 9.1 6 12.6a6 6 0 0 0 12 0C18 9.1 12 3.1 12 3.1z"/></svg>);
const Moon =(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3a9 9 0 1 0 9 9 6 6 0 0 1-9-9Z"/></svg>);
const Steps=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="7" cy="14" r="3"/><circle cx="17" cy="10" r="3"/></svg>);
const Target=(p)=>(<svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>);

function Hud(){
  const {useState, useMemo, useEffect} = React;
  const [vw, setVw] = useState(window.innerWidth);
  const [vh, setVh] = useState(window.innerHeight);
  useEffect(()=>{ 
    const onR=()=>{setVw(window.innerWidth); setVh(window.innerHeight)}; 
    window.addEventListener('resize',onR); 
    return ()=>window.removeEventListener('resize',onR);
  },[]);
  const isPhone = (vw < 420) || (vh < 740);

  const [data, setData] = useState({ altitude:200, target:3776, oxygen:78 });
  const [climbing, setClimbing] = useState(false);
  const [habits, setHabits] = useState([
    { id:'water',  name:'Water',  icon:Drop,   oxygen:15, done:false },
    { id:'sleep',  name:'Sleep',  icon:Moon,   oxygen:20, done:false },
    { id:'move',   name:'Move',   icon:Steps,  oxygen:15, done:false },
    { id:'focus',  name:'Focus',  icon:Target, oxygen:20, done:false },
  ]);

  const env = useMemo(()=>envFromAltitude(data.altitude), [data.altitude]);
  useEffect(()=>{
    window.MountainAPI?.updateAltitude(data.altitude);
  }, [data.altitude]);

  const progress = Math.min(100, (data.altitude / data.target) * 100);
  const oxyColor = data.oxygen >= 70 ? '#10b981' : data.oxygen >= 50 ? '#f59e0b' : data.oxygen >= 30 ? '#f97316' : '#ef4444';

  function completeHabit(h){
    if (h.done || climbing) return;
    setClimbing(true);

    const altGain = 270;
    window.MountainAPI?.climbForward(altGain);

    const tmp = { alt: data.altitude };
    gsap.to(tmp,{
      alt: Math.min(data.altitude + altGain, data.target),
      duration: 1.4, 
      ease:'power2.out',
      onUpdate: ()=>setData(p=>({...p, altitude: tmp.alt})),
      onComplete: ()=>setClimbing(false)
    });

    setData(p=>({...p, oxygen: Math.min(p.oxygen + h.oxygen, 100)}));
    setHabits(p=>p.map(x=>x.id===h.id?{...x,done:true}:x));
  }

  return (
    <div className="pointer-events-none safe">
      <div className="absolute top-4 left-4 right-4 flex justify-between gap-3">
        <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
          <div className="flex items-center gap-2 mb-1">
            <IconMountain className="w-4 h-4 text-emerald-400"/>
            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{env.name}</span>
          </div>
          <div className="text-3xl font-bold text-white">
            {Math.round(data.altitude).toLocaleString()}<span className="text-base text-slate-400 ml-1">m</span>
          </div>
          <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all" style={{width:`${progress}%`}}/>
          </div>
          <div className="text-xs text-slate-400 mt-1">{Math.round(progress)}% to summit</div>
        </div>

        <div className="pointer-events-auto bg-gradient-to-br from-slate-900/95 to-slate-800/95 backdrop-blur-xl rounded-2xl px-6 py-3 shadow-2xl border border-white/10">
          <div className="flex items-center gap-2 mb-1">
            <div className="w-3 h-3 rounded-full animate-pulse" style={{backgroundColor:oxyColor}}/>
            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
          </div>
          <div className="text-3xl font-bold" style={{color:oxyColor}}>
            {Math.round(data.oxygen)}<span className="text-base text-slate-400">%</span>
          </div>
          <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
            <div className="h-full transition-all" style={{width:`${data.oxygen}%`, backgroundColor:oxyColor, boxShadow:`0 0 10px ${oxyColor}80`}}/>
          </div>
          <div className="text-xs text-slate-400 mt-1">
            {data.oxygen>=70?'Strong':data.oxygen>=50?'Moderate':data.oxygen>=30?'Weak':'Critical'}
          </div>
        </div>
      </div>

      <div className="absolute left-4 right-4"
           style={{bottom: isPhone ? '16px' : '72px', transform: isPhone?'scale(0.92)':'scale(1)', transformOrigin:'center bottom'}}>
        <div className="pointer-events-auto bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-5 border border-slate-200">
          <div className="grid grid-cols-4 gap-3">
            {habits.map((h,i)=>{
              const Icon = h.icon;
              const colors = [
                ['from-blue-500','to-cyan-500','shadow-blue-500/50'],
                ['from-indigo-500','to-purple-500','shadow-indigo-500/50'],
                ['from-green-500','to-emerald-500','shadow-green-500/50'],
                ['from-purple-500','to-pink-500','shadow-purple-500/50'],
              ][i];
              return (
                <button key={h.id} onClick={()=>completeHabit(h)} disabled={h.done||climbing}
                  className={`relative aspect-square rounded-2xl transition-all flex flex-col items-center justify-center gap-2
                    ${h.done
                      ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95'
                      : `bg-gradient-to-br ${colors[0]} ${colors[1]} hover:scale-105 active:scale-95 shadow-xl ${colors[2]}`
                    } ${climbing&&!h.done?'opacity-50 cursor-not-allowed':''}`}>
                  {!h.done && <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl"/>}
                  <Icon className={`w-7 h-7 ${h.done?'text-emerald-700':'text-white drop-shadow'}`}/>
                  <span className={`text-xs font-bold ${h.done?'text-emerald-700':'text-white'}`}>{h.done?'✓ Done':`+${h.oxygen}%`}</span>
                </button>
              );
            })}
          </div>
          <div className="text-center mt-4 pt-3 border-t border-slate-200">
            <div className="flex items-center justify-center gap-2">
              <div className="flex gap-1">
                {habits.map((h,i)=>(<div key={i} className={`w-2 h-2 rounded-full transition-all ${h.done?'bg-emerald-500 scale-125':'bg-slate-300'}`}/>))}
              </div>
              <span className="text-sm text-slate-600 font-medium ml-2">
                {habits.filter(x=>x.done).length} / 4 completed
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========== PIXI Scene ========== */
const UI_PAD = 220;

(async () => {
  const app = new PIXI.Application();
  await app.init({ 
    resizeTo: window, 
    antialias:true, 
    backgroundAlpha:1,
    autoDensity:true,
    resolution: window.devicePixelRatio || 1
  });
  document.getElementById('scene').appendChild(app.canvas);

  let W = app.screen.width;
  let H = app.screen.height;
  let currentAlt = 200;

  // INFINITE SCROLLING SYSTEM
  const TILE_WIDTH = W * 1.5;

  // Layer containers
  const skyContainer = new PIXI.Container();
  const sunContainer = new PIXI.Container();
  const cloudContainer = new PIXI.Container();
  const fujiContainer = new PIXI.Container();
  const farMtn1Container = new PIXI.Container();
  const farMtn2Container = new PIXI.Container();
  const farMtn3Container = new PIXI.Container();
  const groundContainer = new PIXI.Container();
  const trailContainer = new PIXI.Container();
  const foliageContainer = new PIXI.Container();
  const actorContainer = new PIXI.Container();
  const particleContainer = new PIXI.Container();
  const vfxContainer = new PIXI.Container();
  
  app.stage.addChild(
    skyContainer, sunContainer, cloudContainer, fujiContainer,
    farMtn1Container, farMtn2Container, farMtn3Container,
    groundContainer, trailContainer, foliageContainer,
    actorContainer, particleContainer, vfxContainer
  );

  let env = envFromAltitude(currentAlt);

  /* ===== GRADIENT TEXTURE CREATOR ===== */
  function createGradientTexture(width, height, colors, stops){
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    stops.forEach((stop, i) => gradient.addColorStop(stop, colors[i]));
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);
    
    return PIXI.Texture.from(canvas);
  }

  /* ===== SKY ===== */
  function createSky(){
    skyContainer.removeChildren();
    
    const texture = createGradientTexture(W, H * 0.75, 
      [env.skyTop, env.skyMid, env.skyBot], 
      [0, 0.4, 1]
    );
    const sprite = new PIXI.Sprite(texture);
    skyContainer.addChild(sprite);
  }

  /* ===== SUN WITH GLOW ===== */
  function createSun(){
    sunContainer.removeChildren();
    
    // Outer glow
    const glow = new PIXI.Graphics();
    glow.beginFill(hex(env.sunGlow), 0.15);
    glow.drawCircle(0, 0, 120);
    glow.endFill();
    glow.filters = [new PIXI.BlurFilter(12)];
    
    // Sun
    const sun = new PIXI.Graphics();
    sun.beginFill(hex(env.sunColor), 0.95);
    sun.drawCircle(0, 0, 65);
    sun.endFill();
    sun.filters = [new PIXI.BlurFilter(3)];
    
    const container = new PIXI.Container();
    container.addChild(glow, sun);
    container.x = W * 0.78;
    container.y = H * 0.16;
    sunContainer.addChild(container);
    
    // Gentle pulse
    gsap.to(container.scale, {
      x: 1.05, y: 1.05,
      duration: 3,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut'
    });
  }

  /* ===== CLOUDS (LOOPING) ===== */
  function createClouds(){
    cloudContainer.removeChildren();
    
    function makeCloudShape(){
      const g = new PIXI.Graphics();
      g.beginFill(0xFFFFFF, 0.45);
      g.drawCircle(0, 0, 32);
      g.drawCircle(28, -6, 26);
      g.drawCircle(-28, -6, 26);
      g.drawCircle(50, 6, 22);
      g.drawCircle(-50, 6, 22);
      g.drawCircle(0, -12, 24);
      g.endFill();
      g.filters = [new PIXI.BlurFilter(2.5)];
      return g;
    }
    
    for(let i = 0; i < 4; i++){
      const cloud = makeCloudShape();
      cloud.x = Math.random() * W;
      cloud.y = (H * 0.12) + (i * 40);
      cloud.scale.set(0.9 + Math.random() * 0.3);
      cloudContainer.addChild(cloud);
      
      const speed = 80 + Math.random() * 40;
      gsap.to(cloud, {
        x: cloud.x + W + 300,
        duration: speed,
        ease: 'none',
        repeat: -1,
        modifiers: {
          x: (x) => parseFloat(x) > W + 200 ? -200 : x
        }
      });
    }
  }

  /* ===== MT. FUJI (ICONIC CONE SHAPE) ===== */
  function createFuji(){
    fujiContainer.removeChildren();
    
    const fuji = new PIXI.Graphics();
    
    // Snow cap (top)
    fuji.beginFill(hex(env.fujiPeak));
    fuji.moveTo(W * 0.5, H * 0.20);
    fuji.lineTo(W * 0.35, H * 0.42);
    fuji.lineTo(W * 0.65, H * 0.42);
    fuji.closePath();
    fuji.endFill();
    
    // Mid section
    fuji.beginFill(hex(env.fujiMid), 0.95);
    fuji.moveTo(W * 0.5, H * 0.25);
    fuji.lineTo(W * 0.32, H * 0.50);
    fuji.lineTo(W * 0.68, H * 0.50);
    fuji.closePath();
    fuji.endFill();
    
    // Base (darker)
    fuji.beginFill(hex(env.fujiBase), 0.9);
    fuji.moveTo(W * 0.5, H * 0.30);
    fuji.lineTo(W * 0.28, H * 0.56);
    fuji.lineTo(W * 0.72, H * 0.56);
    fuji.closePath();
    fuji.endFill();
    
    fuji.filters = [new PIXI.BlurFilter(1.5)];
    fujiContainer.addChild(fuji);
  }

  /* ===== BACKGROUND MOUNTAINS (TILING FOR INFINITE SCROLL) ===== */
  function createMountainTiles(container, color, baseY, amp, freq, blur, tileCount = 3){
    container.removeChildren();
    
    for(let t = 0; t < tileCount; t++){
      const g = new PIXI.Graphics();
      g.beginFill(hex(color));
      
      const startX = t * TILE_WIDTH - TILE_WIDTH * 0.5;
      const segments = 80;
      
      g.moveTo(startX, H);
      g.lineTo(startX, baseY);
      
      for(let i = 0; i <= segments; i++){
        const x = startX + (TILE_WIDTH / segments) * i;
        const wave = Math.sin((i + t * segments * 0.7) * freq) * amp;
        const y = baseY - amp * 0.4 + wave;
        
        if(i === 0){
          g.lineTo(x, y);
        } else {
          const prevX = startX + (TILE_WIDTH / segments) * (i - 1);
          const prevWave = Math.sin((i - 1 + t * segments * 0.7) * freq) * amp;
          const prevY = baseY - amp * 0.4 + prevWave;
          const cpX = (prevX + x) / 2;
          const cpY = (prevY + y) / 2;
          g.quadraticCurveTo(cpX, cpY, x, y);
        }
      }
      
      g.lineTo(startX + TILE_WIDTH, H);
      g.closePath();
      g.endFill();
      
      if(blur > 0) g.filters = [new PIXI.BlurFilter(blur)];
      container.addChild(g);
    }
  }

  /* ===== GROUND (TILING) ===== */
  function createGround(){
    groundContainer.removeChildren();
    
    for(let t = 0; t < 3; t++){
      const texture = createGradientTexture(TILE_WIDTH, H * 0.35,
        [env.groundTop, env.groundMid, env.groundBot],
        [0, 0.5, 1]
      );
      
      const sprite = new PIXI.Sprite(texture);
      sprite.x = t * TILE_WIDTH - TILE_WIDTH * 0.5;
      sprite.y = H * 0.65;
      
      // Add grass texture
      const grass = new PIXI.Graphics();
      for(let i = 0; i < 1500; i++){
        const x = Math.random() * TILE_WIDTH;
        const y = Math.random() * H * 0.15;
        const isLight = Math.random() > 0.5;
        grass.beginFill(hex(isLight ? env.grassLight : env.grassDark), 0.3);
        grass.drawRect(sprite.x + x, sprite.y + y, 2, Math.random() * 4 + 2);
        grass.endFill();
      }
      
      groundContainer.addChild(sprite, grass);
    }
  }

  /* ===== TRAIL (TILING) ===== */
  function createTrail(){
    trailContainer.removeChildren();
    
    for(let t = 0; t < 3; t++){
      const trail = new PIXI.Graphics();
      const startX = t * TILE_WIDTH - TILE_WIDTH * 0.5;
      
      // Trail base
      const texture = createGradientTexture(10, 90,
        [env.trailColor, env.trailDark],
        [0, 1]
      );
      
      const sprite = new PIXI.TilingSprite(texture, TILE_WIDTH, 90);
      sprite.x = startX;
      sprite.y = H * 0.70;
      trailContainer.addChild(sprite);
      
      // Trail edges
      trail.lineStyle(4, hex(env.trailDark), 0.4);
      trail.moveTo(startX, H * 0.70 + 5);
      trail.lineTo(startX + TILE_WIDTH, H * 0.70 + 5);
      trail.moveTo(startX, H * 0.70 + 85);
      trail.lineTo(startX + TILE_WIDTH, H * 0.70 + 85);
      
      // Trail lines (path markers)
      for(let i = 0; i < 8; i++){
        const x = startX + (i * TILE_WIDTH / 8);
        trail.lineStyle(3, 0xFFFFFF, 0.15);
        trail.moveTo(x, H * 0.70 + 42);
        trail.lineTo(x + 30, H * 0.70 + 42);
      }
      
      trailContainer.addChild(trail);
    }
  }

  /* ===== TREES (TILING) ===== */
  function createTree(scale, x, y){
    const tree = new PIXI.Container();
    
    // Trunk with texture
    const trunk = new PIXI.Graphics();
    trunk.beginFill(hex(env.treeDark));
    trunk.drawRoundedRect(-7 * scale, 0, 14 * scale, 55 * scale, 4 * scale);
    trunk.endFill();
    
    // Trunk highlights
    trunk.beginFill(0xFFFFFF, 0.1);
    trunk.drawRoundedRect(-6 * scale, 0, 4 * scale, 55 * scale, 2 * scale);
    trunk.endFill();
    
    tree.addChild(trunk);
    
    // Layered foliage for depth
    const foliage = new PIXI.Graphics();
    
    // Back layer (darker)
    foliage.beginFill(hex(env.treeDark), 0.85);
    foliage.drawCircle(-18 * scale, -28 * scale, 26 * scale);
    foliage.drawCircle(18 * scale, -28 * scale, 26 * scale);
    foliage.endFill();
    
    // Mid layer
    foliage.beginFill(hex(env.treeMid), 0.9);
    foliage.drawCircle(0, -45 * scale, 28 * scale);
    foliage.drawCircle(-15 * scale, -32 * scale, 24 * scale);
    foliage.drawCircle(15 * scale, -32 * scale, 24 * scale);
    foliage.endFill();
    
    // Front layer (lightest)
    foliage.beginFill(hex(env.treeTop));
    foliage.drawCircle(0, -38 * scale, 32 * scale);
    foliage.drawCircle(-12 * scale, -25 * scale, 22 * scale);
    foliage.drawCircle(12 * scale, -25 * scale, 22 * scale);
    foliage.endFill();
    
    // Highlights
    foliage.beginFill(0xFFFFFF, 0.15);
    foliage.drawCircle(10 * scale, -40 * scale, 10 * scale);
    foliage.endFill();
    
    tree.addChild(foliage);
    tree.x = x;
    tree.y = y;
    
    return tree;
  }

  function populateFoliage(){
    foliageContainer.removeChildren();
    
    const zone = env.name;
    
    if(zone === 'Forest Base'){
      // Dense forest with tiling
      for(let t = 0; t < 3; t++){
        const startX = t * TILE_WIDTH - TILE_WIDTH * 0.5;
        for(let i = 0; i < 12; i++){
          const x = startX + (i * 130) + Math.random() * 30;
          const y = H * 0.68;
          const scale = 0.75 + Math.random() * 0.45;
          const tree = createTree(scale, x, y);
          foliageContainer.addChild(tree);
        }
      }
    } else if(zone === 'Mountain Trail'){
      // Scattered trees
      for(let t = 0; t < 3; t++){
        const startX = t * TILE_WIDTH - TILE_WIDTH * 0.5;
        for(let i = 0; i < 8; i++){
          const x = startX + (i * 180) + Math.random() * 40;
          const y = H * 0.68;
          
          if(i % 2 === 0){
            const scale = 0.6 + Math.random() * 0.35;
            const tree = createTree(scale, x, y);
            foliageContainer.addChild(tree);
          } else {
            // Rocks
            const rock = new PIXI.Graphics();
            rock.beginFill(0x6a6a6a);
            const size = 18 + Math.random() * 16;
            rock.drawRoundedRect(x - size/2, y - size, size, size, 6);
            rock.endFill();
            rock.beginFill(0x8a8a8a, 0.3);
            rock.drawRoundedRect(x - size/2, y - size, size/3, size/2, 4);
            rock.endFill();
            foliageContainer.addChild(rock);
          }
        }
      }
    } else if(zone === 'Alpine Zone'){
      // Sparse rocks
      for(let t = 0; t < 3; t++){
        const startX = t * TILE_WIDTH - TILE_WIDTH * 0.5;
        for(let i = 0; i < 6; i++){
          const x = startX + (i * 240) + Math.random() * 50;
          const y = H * 0.68;
          const rock = new PIXI.Graphics();
          rock.beginFill(0x808080);
          const size = 22 + Math.random() * 18;
          rock.drawRoundedRect(x - size/2, y - size, size, size, 7);
          rock.endFill();
          rock.beginFill(0xA0A0A0, 0.4);
          rock.drawRoundedRect(x - size/2, y - size, size/2, size/3, 5);
          rock.endFill();
          foliageContainer.addChild(rock);
        }
      }
    } else {
      // Snow/ice patches
      for(let t = 0; t < 3; t++){
        const startX = t * TILE_WIDTH - TILE_WIDTH * 0.5;
        for(let i = 0; i < 5; i++){
          const x = startX + (i * 280) + Math.random() * 60;
          const y = H * 0.68;
          const ice = new PIXI.Graphics();
          ice.beginFill(0xE8F4F8, 0.8);
          ice.drawEllipse(x, y - 12, 45, 14);
          ice.endFill();
          ice.beginFill(0xFFFFFF, 0.5);
          ice.drawEllipse(x - 10, y - 12, 15, 6);
          ice.endFill();
          ice.filters = [new PIXI.BlurFilter(0.5)];
          foliageContainer.addChild(ice);
        }
      }
    }
  }

  /* ===== PARTICLES (WEATHER EFFECTS) ===== */
  const particles = [];
  
  function createParticles(){
    particles.forEach(p => {
      particleContainer.removeChild(p);
      p.destroy();
    });
    particles.length = 0;
    
    const type = env.particles;
    const count = 20;
    
    for(let i = 0; i < count; i++){
      const p = new PIXI.Graphics();
      
      if(type === 'leaves'){
        p.beginFill(env.particleColor, 0.7);
        p.drawPolygon([0, -6, 4, -1, 3, 4, 0, 6, -3, 4, -4, -1]);
        p.endFill();
      } else if(type === 'birds'){
        p.lineStyle(2, env.particleColor, 0.6);
        p.moveTo(-8, 0);
        p.quadraticCurveTo(-4, -4, 0, -1);
        p.quadraticCurveTo(4, -4, 8, 0);
      } else if(type === 'wind'){
        p.lineStyle(2, env.particleColor, 0.4);
        p.moveTo(0, 0);
        p.lineTo(25, -2);
        p.moveTo(5, 6);
        p.lineTo(30, 4);
      } else if(type === 'snow'){
        p.beginFill(env.particleColor, 0.85);
        p.drawCircle(0, 0, 3);
        p.drawCircle(2, 2, 2);
        p.endFill();
        p.filters = [new PIXI.BlurFilter(0.5)];
      }
      
      p.x = Math.random() * W;
      p.y = Math.random() * H * 0.65;
      particleContainer.addChild(p);
      particles.push(p);
      
      const speed = type === 'birds' ? 35 : type === 'snow' ? 80 : 55;
      const verticalMove = type === 'snow' ? 50 : (Math.random() - 0.5) * 20;
      
      gsap.to(p, {
        x: p.x + W + 150,
        y: p.y + verticalMove,
        rotation: type === 'leaves' ? Math.PI * 2 : 0,
        duration: speed + Math.random() * 25,
        ease: 'none',
        repeat: -1,
        onRepeat: ()=> {
          p.x = -100;
          p.y = Math.random() * H * 0.65;
        }
      });
    }
  }

  /* ===== CLIMBER (DETAILED) ===== */
  const climberBody = new PIXI.Container();
  let climberShadow, climberLegs, climberTorso, climberArms, climberHead;
  
  function createClimber(){
    climberBody.removeChildren();
    
    // Shadow
    climberShadow = new PIXI.Graphics();
    climberShadow.beginFill(0x000000, 0.35);
    climberShadow.drawEllipse(0, 42, 32, 10);
    climberShadow.endFill();
    climberShadow.filters = [new PIXI.BlurFilter(2)];
    climberBody.addChild(climberShadow);
    
    // Legs
    climberLegs = new PIXI.Container();
    const leftLeg = new PIXI.Graphics();
    leftLeg.beginFill(0x1a1a2e);
    leftLeg.drawRoundedRect(-15, 14, 12, 28, 6);
    leftLeg.endFill();
    leftLeg.beginFill(0x2a2a3e, 0.3);
    leftLeg.drawRoundedRect(-14, 14, 4, 28, 3);
    leftLeg.endFill();
    
    const rightLeg = new PIXI.Graphics();
    rightLeg.beginFill(0x1a1a2e);
    rightLeg.drawRoundedRect(3, 14, 12, 28, 6);
    rightLeg.endFill();
    rightLeg.beginFill(0x2a2a3e, 0.3);
    rightLeg.drawRoundedRect(4, 14, 4, 28, 3);
    rightLeg.endFill();
    
    climberLegs.addChild(leftLeg, rightLeg);
    climberBody.addChild(climberLegs);
    
    // Torso with backpack
    climberTorso = new PIXI.Container();
    
    const backpack = new PIXI.Graphics();
    backpack.beginFill(0x4a5a6a);
    backpack.drawRoundedRect(-12, -24, 24, 32, 6);
    backpack.endFill();
    backpack.beginFill(0x5a6a7a, 0.4);
    backpack.drawRoundedRect(-11, -22, 8, 28, 4);
    backpack.endFill();
    backpack.lineStyle(2, 0x3a4a5a);
    backpack.moveTo(-10, -16);
    backpack.lineTo(10, -16);
    backpack.moveTo(-10, -8);
    backpack.lineTo(10, -8);
    
    const body = new PIXI.Graphics();
    body.beginFill(0x2a2a3e);
    body.drawRoundedRect(-14, -28, 28, 44, 9);
    body.endFill();
    body.beginFill(0x3a3a4e, 0.3);
    body.drawRoundedRect(-13, -26, 10, 40, 6);
    body.endFill();
    
    climberTorso.addChild(backpack, body);
    climberBody.addChild(climberTorso);
    
    // Arms
    climberArms = new PIXI.Container();
    
    const leftArm = new PIXI.Graphics();
    leftArm.beginFill(0x2a2a3e);
    leftArm.drawRoundedRect(-26, -22, 12, 26, 6);
    leftArm.endFill();
    leftArm.beginFill(0xf4c2a6);
    leftArm.drawRoundedRect(-26, 2, 12, 8, 4);
    leftArm.endFill();
    
    const rightArm = new PIXI.Graphics();
    rightArm.beginFill(0x2a2a3e);
    rightArm.drawRoundedRect(14, -22, 12, 26, 6);
    rightArm.endFill();
    rightArm.beginFill(0xf4c2a6);
    rightArm.drawRoundedRect(14, 2, 12, 8, 4);
    rightArm.endFill();
    
    climberArms.addChild(leftArm, rightArm);
    climberBody.addChild(climberArms);
    
    // Head
    climberHead = new PIXI.Container();
    
    const head = new PIXI.Graphics();
    head.beginFill(0xf4c2a6);
    head.drawCircle(0, -37, 13);
    head.endFill();
    head.beginFill(0xe4b296, 0.3);
    head.drawCircle(-4, -37, 6);
    head.endFill();
    
    const beanie = new PIXI.Graphics();
    beanie.beginFill(0xe24d4d);
    beanie.drawEllipse(0, -43, 14, 9);
    beanie.endFill();
    beanie.beginFill(0xf06a6a);
    beanie.drawRoundedRect(-14, -41, 28, 6, 3);
    beanie.endFill();
    beanie.beginFill(0xf06a6a);
    beanie.drawCircle(0, -49, 5);
    beanie.endFill();
    beanie.beginFill(0xe24d4d, 0.5);
    beanie.drawCircle(-3, -49, 3);
    beanie.endFill();
    
    climberHead.addChild(head, beanie);
    climberBody.addChild(climberHead);
    
    climberBody.x = W * 0.25;
    climberBody.y = H * 0.70 + 48;
    actorContainer.addChild(climberBody);
  }

  /* ===== TILE WRAPPING SYSTEM ===== */
  function wrapTiles(container, speed){
    container.children.forEach(child => {
      if(child.x < -TILE_WIDTH){
        child.x += TILE_WIDTH * 3;
      }
    });
  }

  /* ===== FULL LAYOUT ===== */
  function fullLayout(){
    W = app.screen.width;
    H = app.screen.height;
    
    createSky();
    createSun();
    createClouds();
    createFuji();
    
    createMountainTiles(farMtn1Container, env.farMtn1, H * 0.48, 95, 0.16, 5);
    createMountainTiles(farMtn2Container, env.farMtn2, H * 0.53, 105, 0.20, 3.5);
    createMountainTiles(farMtn3Container, env.farMtn3, H * 0.58, 115, 0.24, 2);
    
    createGround();
    createTrail();
    populateFoliage();
    createParticles();
    createClimber();
  }

  window.addEventListener('resize', fullLayout);

  /* ===== CLIMBING ANIMATION WITH PARALLAX ===== */
  let isClimbing = false;
  
  function climbForward(meters){
    if(isClimbing) return;
    isClimbing = true;
    
    const distance = meters * 3;
    const duration = 1.4;
    
    // Parallax scrolling with tile wrapping
    const layers = [
      { container: fujiContainer, speed: 0.03 },
      { container: farMtn1Container, speed: 0.06 },
      { container: farMtn2Container, speed: 0.12 },
      { container: farMtn3Container, speed: 0.22 },
      { container: groundContainer, speed: 0.85 },
      { container: trailContainer, speed: 1.0 },
      { container: foliageContainer, speed: 0.65 }
    ];
    
    layers.forEach(({container, speed}) => {
      gsap.to(container, {
        x: container.x - distance * speed,
        duration,
        ease: 'power2.out',
        onUpdate: () => wrapTiles(container, speed)
      });
    });
    
    // Climber epic jump with flip
    const tl = gsap.timeline({
      onComplete: ()=> {
        isClimbing = false;
        
        // Landing impact - screen shake
        gsap.to(app.stage, {
          x: [-3, 3, -2, 2, 0],
          y: [0, -2, 0, -1, 0],
          duration: 0.4,
          ease: 'power2.out'
        });
        
        // Dust explosion
        spawnDustExplosion(climberBody.x, climberBody.y + 35);
      }
    });
    
    // Jump arc
    tl.to(climberBody, {
      y: climberBody.y - 160,
      duration: duration * 0.42,
      ease: 'power2.out'
    }, 0);
    
    tl.to(climberBody, {
      y: climberBody.y,
      duration: duration * 0.58,
      ease: 'bounce.out'
    }, duration * 0.42);
    
    // Full rotation flip
    tl.to(climberBody, {
      rotation: Math.PI * 2,
      duration,
      ease: 'power2.inOut'
    }, 0);
    
    // Arm swing
    tl.to(climberArms, {
      rotation: Math.PI * 0.3,
      duration: duration * 0.5,
      yoyo: true,
      repeat: 1,
      ease: 'sine.inOut'
    }, 0);
    
    // Shadow squash/stretch
    tl.to(climberShadow.scale, {
      x: 1.4,
      y: 0.4,
      duration: duration * 0.42,
      ease: 'power2.out'
    }, 0);
    
    tl.to(climberShadow.scale, {
      x: 1.0,
      y: 1.0,
      duration: duration * 0.58,
      ease: 'elastic.out(1, 0.5)'
    }, duration * 0.42);
  }

  /* ===== DUST EXPLOSION EFFECT ===== */
  function spawnDustExplosion(x, y){
    const dustCount = 12;
    
    for(let i = 0; i < dustCount; i++){
      const dust = new PIXI.Graphics();
      const size = 6 + Math.random() * 10;
      dust.beginFill(0xD2B48C, 0.5);
      dust.drawCircle(0, 0, size);
      dust.endFill();
      dust.filters = [new PIXI.BlurFilter(2.5)];
      
      dust.x = x + (Math.random() - 0.5) * 50;
      dust.y = y + (Math.random() - 0.5) * 25;
      vfxContainer.addChild(dust);
      
      const angle = (Math.random() * Math.PI * 2);
      const speed = 40 + Math.random() * 60;
      
      gsap.to(dust, {
        x: dust.x + Math.cos(angle) * speed,
        y: dust.y + Math.sin(angle) * speed - 30,
        alpha: 0,
        scale: 1.5,
        duration: 0.7 + Math.random() * 0.4,
        ease: 'power2.out',
        onComplete: ()=> {
          vfxContainer.removeChild(dust);
          dust.destroy();
        }
      });
    }
    
    // Ground impact ring
    const ring = new PIXI.Graphics();
    ring.lineStyle(4, 0xD2B48C, 0.6);
    ring.drawCircle(x, y, 20);
    ring.filters = [new PIXI.BlurFilter(2)];
    vfxContainer.addChild(ring);
    
    gsap.to(ring, {
      alpha: 0,
      duration: 0.5,
      ease: 'power2.out',
      onComplete: ()=> {
        vfxContainer.removeChild(ring);
        ring.destroy();
      }
    });
    
    gsap.to(ring.scale, {
      x: 2.5,
      y: 2.5,
      duration: 0.5,
      ease: 'power2.out'
    });
  }

  /* ===== ALTITUDE UPDATE ===== */
  function updateAltitude(newAlt){
    currentAlt = newAlt;
    const newEnv = envFromAltitude(newAlt);
    
    if(newEnv.name !== env.name){
      env = newEnv;
      
      // Smooth fade transition
      const overlay = new PIXI.Graphics();
      overlay.beginFill(0xFFFFFF, 0);
      overlay.drawRect(0, 0, W, H);
      overlay.endFill();
      app.stage.addChild(overlay);
      
      gsap.to(overlay, {
        alpha: 0.5,
        duration: 0.4,
        yoyo: true,
        repeat: 1,
        ease: 'power2.inOut',
        onComplete: ()=> {
          app.stage.removeChild(overlay);
          overlay.destroy();
        }
      });
      
      setTimeout(() => fullLayout(), 400);
    }
  }

  /* ===== IDLE ANIMATIONS ===== */
  function startIdleAnimations(){
    // Gentle breathing
    gsap.to(climberTorso.scale, {
      y: 1.04,
      duration: 1.8,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut'
    });
    
    // Subtle sway
    gsap.to(climberBody, {
      rotation: 0.03,
      duration: 2.5,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut'
    });
    
    // Head look around
    gsap.to(climberHead, {
      rotation: 0.08,
      duration: 3.2,
      yoyo: true,
      repeat: -1,
      ease: 'sine.inOut'
    });
  }

  /* ===== API ===== */
  window.MountainAPI = {
    climbForward,
    updateAltitude
  };

  // Initialize
  fullLayout();
  startIdleAnimations();
  
  ReactDOM.createRoot(document.getElementById('hud')).render(React.createElement(Hud));
})();
  </script>
</body>
