<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivify - Mountain View</title>
    
    <!-- Load React from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
    
        // Icon components
        const Mountain = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m8 3 4 8 5-5 5 15H2L8 3z"/>
            </svg>
        );
    
        const Droplets = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
                <path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97"/>
            </svg>
        );
    
        const Moon = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );
    
        const Footprints = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/>
                <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/>
            </svg>
        );
    
        const Target = (props) => (
            <svg {...props} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );
    
        const MountainView = () => {
            const [userData, setUserData] = useState({
                altitude: 1200,
                targetAltitude: 3776,
                oxygen: 78,
                mountainName: 'Mt. Fuji'
            });
    
            const [habits, setHabits] = useState([
                { id: 'hydration', name: 'Water', icon: Droplets, completed: false, oxygen: 15 },
                { id: 'sleep', name: 'Sleep', icon: Moon, completed: false, oxygen: 20 },
                { id: 'movement', name: 'Move', icon: Footprints, completed: false, oxygen: 15 },
                { id: 'focus', name: 'Focus', icon: Target, completed: false, oxygen: 20 }
            ]);
    
            const [trailProgress, setTrailProgress] = useState(0);
            const [isClimbing, setIsClimbing] = useState(false);
            const [walkCycle, setWalkCycle] = useState(0);
    
            const progressPercent = (userData.altitude / userData.targetAltitude) * 100;
    
            const getZone = (alt) => {
                if (alt < 1500) return { 
                    name: 'Forest Trail', 
                    skyTop: '#5BA3D0',
                    skyMid: '#87CEEB',
                    skyBot: '#B0E0E6',
                    ground: '#8b7355',
                    groundDark: '#6b5335',
                    dirt: '#a0826d',
                    rock: '#8b8680'
                };
                if (alt < 2500) return { 
                    name: 'Alpine Ridge', 
                    skyTop: '#4A7BA8',
                    skyMid: '#6BA3D4',
                    skyBot: '#89B5D6',
                    ground: '#756f6f',
                    groundDark: '#554f4f',
                    dirt: '#8b8680',
                    rock: '#6b7280'
                };
                if (alt < 3500) return { 
                    name: 'High Summit', 
                    skyTop: '#2E5F8A',
                    skyMid: '#4A8AB8',
                    skyBot: '#6BA3D4',
                    ground: '#9098a0',
                    groundDark: '#707880',
                    dirt: '#a8b0b8',
                    rock: '#94a3b8'
                };
                return { 
                    name: 'Peak Ridge', 
                    skyTop: '#1E4F7A',
                    skyMid: '#2E5F8A',
                    skyBot: '#4A8AB8',
                    ground: '#d0d8e0',
                    groundDark: '#b0b8c0',
                    dirt: '#e0e8f0',
                    rock: '#cbd5e1'
                };
            };
    
            const zone = getZone(userData.altitude);
    
            const completeHabit = (habitId) => {
                const habit = habits.find(h => h.id === habitId);
                if (habit.completed) return;
    
                setIsClimbing(true);
                
                // Smoother animation with smaller increments
                let steps = 0;
                const totalSteps = 20;
                const increment = 15 / totalSteps;
                
                const animate = setInterval(() => {
                    steps++;
                    setTrailProgress(prev => prev + increment);
                    setWalkCycle(prev => (prev + 1) % 4);
                    
                    if (steps >= totalSteps) {
                        clearInterval(animate);
                        setUserData(prev => ({
                            ...prev,
                            altitude: Math.min(prev.altitude + 270, prev.targetAltitude),
                            oxygen: Math.min(prev.oxygen + habit.oxygen, 100)
                        }));
    
                        setHabits(prev => prev.map(h => 
                            h.id === habitId ? { ...h, completed: true } : h
                        ));
                        setIsClimbing(false);
                    }
                }, 40);
            };
    
            const getOxygenColor = (oxygen) => {
                if (oxygen >= 70) return '#10b981';
                if (oxygen >= 50) return '#f59e0b';
                if (oxygen >= 30) return '#f97316';
                return '#ef4444';
            };
    
            // Generate realistic terrain
            const generateTerrain = () => {
                const elements = [];
                for (let i = 0; i < 35; i++) {
                    const side = Math.random() > 0.5 ? 1 : -1;
                    const distance = 100 + i * 70;
                    const spread = 80 + Math.random() * 140;
                    const rand = Math.random();
                    
                    let type = 'tree';
                    if (userData.altitude < 1500) {
                        if (rand < 0.5) type = 'tree';
                        else if (rand < 0.7) type = 'bush';
                        else type = 'rock';
                    } else if (userData.altitude < 2500) {
                        if (rand < 0.4) type = 'rock';
                        else if (rand < 0.7) type = 'boulder';
                        else type = 'shrub';
                    } else {
                        if (rand < 0.6) type = 'snow';
                        else type = 'rock';
                    }
                    
                    elements.push({
                        id: i,
                        x: side * spread,
                        y: distance,
                        type: type,
                        size: 0.6 + Math.random() * 0.6
                    });
                }
                return elements;
            };
    
            const [terrainElements] = useState(generateTerrain());
    
            return (
                <div className="relative w-full h-screen overflow-hidden" style={{
                    background: `linear-gradient(to bottom, ${zone.skyTop} 0%, ${zone.skyMid} 50%, ${zone.skyBot} 100%)`
                }}>
                    
                    {/* Sun */}
                    <div className="absolute w-32 h-32 rounded-full" style={{
                        top: '8%',
                        right: '12%',
                        background: 'radial-gradient(circle, #fff9e6 0%, #ffeb3b 40%, #ffa726 100%)',
                        boxShadow: '0 0 80px rgba(255, 235, 59, 0.6)',
                        opacity: 0.85
                    }} />
    
                    {/* Clouds */}
                    {[...Array(6)].map((_, i) => (
                        <div
                            key={i}
                            className="absolute rounded-full"
                            style={{
                                left: `${10 + i * 15}%`,
                                top: `${10 + (i % 3) * 8}%`,
                                width: `${120 + i * 20}px`,
                                height: `${60 + i * 10}px`,
                                background: 'rgba(255, 255, 255, 0.5)',
                                filter: 'blur(25px)',
                                animation: `float ${25 + i * 5}s ease-in-out infinite`,
                                animationDelay: `${i * 3}s`
                            }}
                        />
                    ))}
    
                    {/* MASSIVE Mt. Fuji Peak in Distance */}
                    <svg className="absolute w-full h-full pointer-events-none" style={{ opacity: 0.7 }}>
                        <defs>
                            <linearGradient id="peakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stopColor="#1e293b" stopOpacity="0.5" />
                                <stop offset="70%" stopColor="#475569" stopOpacity="0.4" />
                                <stop offset="100%" stopColor="#64748b" stopOpacity="0.25" />
                            </linearGradient>
                            <linearGradient id="snowCap" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95" />
                                <stop offset="100%" stopColor="#e0f2fe" stopOpacity="0.7" />
                            </linearGradient>
                        </defs>
                        
                        {/* Main Fuji silhouette */}
                        <polygon
                            points="400,120 500,280 520,270 580,340 640,300 700,350 760,310 800,360 900,280 1000,380 700,380 650,320 600,280 550,320 500,280 450,240"
                            fill="url(#peakGrad)"
                        />
                        
                        {/* Snow cap */}
                        <polygon
                            points="400,120 450,180 500,160 550,200 600,170 650,210 700,160 650,150 600,130 550,150 500,130 450,145"
                            fill="url(#snowCap)"
                        />
                    </svg>
    
                    {/* Scrolling Trail System */}
                    <div 
                        className="absolute bottom-0 left-1/2 -translate-x-1/2 transition-transform"
                        style={{ 
                            transform: `translateX(-50%) translateY(${trailProgress}%)`,
                            transitionDuration: isClimbing ? '40ms' : '600ms',
                            transitionTimingFunction: 'linear'
                        }}
                    >
                        {/* Dirt/Rocky Trail Path */}
                        <svg width="700" height="1800" className="absolute" style={{ bottom: '-500px', left: '50%', transform: 'translateX(-50%)' }}>
                            {/* Main dirt trail */}
                            <defs>
                                <linearGradient id="trailDirt" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stopColor={zone.ground} stopOpacity="0.3" />
                                    <stop offset="50%" stopColor={zone.ground} stopOpacity="0.7" />
                                    <stop offset="100%" stopColor={zone.ground} stopOpacity="0.95" />
                                </linearGradient>
                                
                                {/* Rocky texture pattern */}
                                <pattern id="rockTexture" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                                    <circle cx="8" cy="8" r="2" fill={zone.groundDark} opacity="0.4" />
                                    <circle cx="28" cy="15" r="2.5" fill={zone.rock} opacity="0.3" />
                                    <circle cx="15" cy="28" r="1.8" fill={zone.groundDark} opacity="0.35" />
                                    <circle cx="32" cy="32" r="2.2" fill={zone.dirt} opacity="0.3" />
                                    <ellipse cx="20" cy="10" rx="3" ry="2" fill={zone.groundDark} opacity="0.25" />
                                </pattern>
                            </defs>
                            
                            {/* Perspective trail surface */}
                            <path
                                d="M 200 1800 L 220 1400 L 240 1000 L 260 600 L 270 200 L 275 0 L 425 0 L 430 200 L 440 600 L 460 1000 L 480 1400 L 500 1800 Z"
                                fill="url(#trailDirt)"
                            />
                            
                            {/* Rock texture overlay */}
                            <path
                                d="M 200 1800 L 220 1400 L 240 1000 L 260 600 L 270 200 L 275 0 L 425 0 L 430 200 L 440 600 L 460 1000 L 480 1400 L 500 1800 Z"
                                fill="url(#rockTexture)"
                            />
                            
                            {/* Trail edges */}
                            <path 
                                d="M 200 1800 L 220 1400 L 240 1000 L 260 600 L 270 200 L 275 0" 
                                stroke={zone.groundDark} 
                                strokeWidth="5" 
                                fill="none" 
                                opacity="0.7" 
                            />
                            <path 
                                d="M 500 1800 L 480 1400 L 460 1000 L 440 600 L 430 200 L 425 0" 
                                stroke={zone.groundDark} 
                                strokeWidth="5" 
                                fill="none" 
                                opacity="0.7" 
                            />
    
                            {/* Switchback markers */}
                            {[...Array(14)].map((_, i) => {
                                const y = 150 + i * 125;
                                const leftX = 200 + (14 - i) * 5;
                                const rightX = 500 - (14 - i) * 5;
                                return (
                                    <g key={i}>
                                        <line 
                                            x1={leftX} y1={y} x2={rightX} y2={y}
                                            stroke={zone.groundDark} 
                                            strokeWidth="3" 
                                            strokeDasharray="15,10" 
                                            opacity="0.5" 
                                        />
                                        {/* Small rocks on trail */}
                                        {i % 3 === 0 && (
                                            <>
                                                <circle cx={leftX + 30} cy={y - 10} r="4" fill={zone.rock} opacity="0.6" />
                                                <circle cx={rightX - 40} cy={y + 8} r="3" fill={zone.rock} opacity="0.5" />
                                            </>
                                        )}
                                    </g>
                                );
                            })}
                        </svg>
    
                        {/* Detailed Terrain Objects */}
                        {terrainElements.map((el) => {
                            const scale = Math.max(0.35, 1 - (el.y / 2500));
                            let element = null;
    
                            if (el.type === 'tree') {
                                element = (
                                    <svg width={40 * el.size} height={55 * el.size} viewBox="0 0 40 55">
                                        {/* Tree trunk */}
                                        <rect x="16" y="42" width="8" height="13" fill="#5d4037" />
                                        <rect x="17" y="43" width="6" height="11" fill="#6d4c41" />
                                        
                                        {/* Foliage layers */}
                                        <ellipse cx="20" cy="35" rx="18" ry="15" fill="#1a5f1a" />
                                        <ellipse cx="20" cy="28" rx="15" ry="12" fill="#2d7a2d" />
                                        <ellipse cx="20" cy="22" rx="12" ry="10" fill="#3d8a3d" />
                                        <ellipse cx="20" cy="17" rx="9" ry="8" fill="#4d9a4d" />
                                        
                                        {/* Highlights */}
                                        <ellipse cx="18" cy="24" rx="4" ry="3" fill="#5daa5d" opacity="0.6" />
                                        <ellipse cx="24" cy="30" rx="5" ry="4" fill="#5daa5d" opacity="0.5" />
                                    </svg>
                                );
                            } else if (el.type === 'bush') {
                                element = (
                                    <svg width={28 * el.size} height={18 * el.size} viewBox="0 0 28 18">
                                        <ellipse cx="14" cy="13" rx="12" ry="9" fill="#3d6b3d" />
                                        <ellipse cx="10" cy="11" rx="8" ry="6" fill="#4d7a4d" />
                                        <ellipse cx="18" cy="12" rx="9" ry="7" fill="#4d7a4d" />
                                        <ellipse cx="14" cy="9" rx="6" ry="5" fill="#5d8a5d" opacity="0.8" />
                                    </svg>
                                );
                            } else if (el.type === 'rock') {
                                element = (
                                    <svg width={30 * el.size} height={22 * el.size} viewBox="0 0 30 22">
                                        <ellipse cx="15" cy="18" rx="14" ry="7" fill="#4b5563" opacity="0.3" />
                                        <polygon points="15,3 26,16 23,20 7,20 4,16" fill="#6b7280" />
                                        <polygon points="15,3 21,12 18,16 12,16 9,12" fill="#9ca3af" />
                                        <polygon points="15,5 18,11 15,14 12,11" fill="#d1d5db" opacity="0.7" />
                                        <line x1="10" y1="14" x2="13" y2="10" stroke="#4b5563" strokeWidth="1" opacity="0.4" />
                                    </svg>
                                );
                            } else if (el.type === 'boulder') {
                                element = (
                                    <svg width={45 * el.size} height={32 * el.size} viewBox="0 0 45 32">
                                        <ellipse cx="22" cy="28" rx="20" ry="8" fill="#374151" opacity="0.25" />
                                        <ellipse cx="22" cy="22" rx="20" ry="14" fill="#4b5563" />
                                        <ellipse cx="20" cy="18" rx="16" ry="11" fill="#6b7280" />
                                        <ellipse cx="24" cy="19" rx="14" ry="10" fill="#6b7280" opacity="0.9" />
                                        <ellipse cx="22" cy="14" rx="11" ry="8" fill="#9ca3af" />
                                        <path d="M12,20 L16,15 M30,22 L26,17" stroke="#374151" strokeWidth="1.5" opacity="0.4" />
                                    </svg>
                                );
                            } else if (el.type === 'shrub') {
                                element = (
                                    <svg width={22 * el.size} height={14 * el.size} viewBox="0 0 22 14">
                                        <ellipse cx="11" cy="10" rx="10" ry="7" fill="#6b8b6b" />
                                        <ellipse cx="7" cy="9" rx="6" ry="5" fill="#7b9b7b" />
                                        <ellipse cx="15" cy="9" rx="7" ry="5" fill="#7b9b7b" />
                                    </svg>
                                );
                            } else if (el.type === 'snow') {
                                element = (
                                    <svg width={35 * el.size} height={22 * el.size} viewBox="0 0 35 22">
                                        <ellipse cx="17" cy="18" rx="16" ry="10" fill="#ffffff" opacity="0.9" />
                                        <ellipse cx="15" cy="15" rx="12" ry="8" fill="#f0f8ff" />
                                        <ellipse cx="19" cy="16" rx="13" ry="9" fill="#f8fcff" opacity="0.95" />
                                        <circle cx="13" cy="13" r="3" fill="#e0f0ff" opacity="0.6" />
                                        <circle cx="21" cy="14" r="2.5" fill="#e0f0ff" opacity="0.5" />
                                    </svg>
                                );
                            }
    
                            return (
                                <div
                                    key={el.id}
                                    className="absolute transition-transform"
                                    style={{
                                        left: `calc(50% + ${el.x}px)`,
                                        bottom: `${el.y}px`,
                                        transform: `scale(${scale})`,
                                        opacity: scale > 0.4 ? scale * 0.95 : 0.35,
                                        filter: el.y > 1200 ? 'blur(0.8px)' : 'none',
                                        transitionDuration: '40ms'
                                    }}
                                >
                                    {element}
                                </div>
                            );
                        })}
                    </div>
    
                    {/* Realistic Character - Pixel Art Style */}
                    <div className="absolute bottom-32 left-1/2 -translate-x-1/2 z-30">
                        <div style={{ 
                            transform: `scale(${isClimbing ? 1.08 : 1})`,
                            filter: 'drop-shadow(0 10px 20px rgba(0,0,0,0.5))',
                            transition: 'transform 40ms linear'
                        }}>
                            <svg width="90" height="120" viewBox="0 0 90 120">
                                {/* Backpack */}
                                <rect x="30" y="24" width="30" height="38" rx="5" fill="#c62828" />
                                <rect x="32" y="26" width="26" height="34" rx="4" fill="#d32f2f" />
                                <rect x="36" y="30" width="18" height="8" rx="3" fill="#ef5350" />
                                <circle cx="38" cy="48" r="2.5" fill="#ffcdd2" />
                                <circle cx="52" cy="48" r="2.5" fill="#ffcdd2" />
                                <path d="M30,40 L26,46 L26,58 L30,56" stroke="#b71c1c" strokeWidth="2.5" fill="none" />
                                <path d="M60,40 L64,46 L64,58 L60,56" stroke="#b71c1c" strokeWidth="2.5" fill="none" />
                                <rect x="42" y="60" width="6" height="4" rx="2" fill="#d32f2f" />
                                
                                {/* Head with beanie */}
                                <ellipse cx="45" cy="18" rx="13" ry="14" fill="#d4a574" />
                                <ellipse cx="45" cy="10" rx="14" ry="8" fill="#c62828" />
                                <ellipse cx="45" cy="8" rx="15" ry="6" fill="#d32f2f" />
                                <circle cx="40" cy="17" r="2" fill="#3e2723" />
                                <circle cx="50" cy="17" r="2" fill="#3e2723" />
                                <path d="M42,22 Q45,24 48,22" stroke="#3e2723" strokeWidth="2" fill="none" />
                                <circle cx="45" cy="12" r="2" fill="#ef5350" />
                                
                                {/* Jacket with detail */}
                                <path d="M33,30 L27,35 L27,68 L33,73 L38,71 L38,88 L33,103 L38,108 L45,106 L45,30 Z" fill="#1565c0" />
                                <path d="M57,30 L63,35 L63,68 L57,73 L52,71 L52,88 L57,103 L52,108 L45,106 L45,30 Z" fill="#1565c0" />
                                <rect x="38" y="30" width="14" height="78" fill="#1976d2" />
                                
                                {/* Jacket zipper */}
                                <line x1="45" y1="35" x2="45" y2="75" stroke="#0d47a1" strokeWidth="2" />
                                <circle cx="45" cy="40" r="2" fill="#42a5f5" />
                                <circle cx="45" cy="50" r="2" fill="#42a5f5" />
                                <circle cx="45" cy="60" r="2" fill="#42a5f5" />
                                <circle cx="45" cy="70" r="2" fill="#42a5f5" />
                                
                                {/* Collar */}
                                <path d="M38,30 Q45,33 52,30" stroke="#0d47a1" strokeWidth="2.5" fill="none" />
                                
                                {/* Left arm with animation */}
                                <g transform={`rotate(${isClimbing ? (walkCycle % 2 === 0 ? -12 : -8) : -10} 28 48)`}>
                                    <ellipse cx="28" cy="52" rx="5" ry="18" fill="#1565c0" />
                                    <ellipse cx="27" cy="67" rx="4.5" ry="14" fill="#0d47a1" />
                                    <ellipse cx="26" cy="79" rx="4" ry="8" fill="#d4a574" />
                                    <ellipse cx="26" cy="82" rx="5" ry="5" fill="#ff6f00" />
                                </g>
                                
                                {/* Right arm with animation */}
                                <g transform={`rotate(${isClimbing ? (walkCycle % 2 === 0 ? 8 : 12) : 10} 62 48)`}>
                                    <ellipse cx="62" cy="52" rx="5" ry="18" fill="#1565c0" />
                                    <ellipse cx="63" cy="67" rx="4.5" ry="14" fill="#0d47a1" />
                                    <ellipse cx="64" cy="79" rx="4" ry="8" fill="#d4a574" />
                                    <ellipse cx="64" cy="82" rx="5" ry="5" fill="#ff6f00" />
                                </g>
                                
                                {/* Pants/Legs with walking animation */}
                                <g transform={`translate(0 ${isClimbing && walkCycle % 2 === 0 ? 3 : 0})`}>
                                    <rect x="35" y="106" width="9" height="14" rx="2" fill="#424242" />
                                    <rect x="36" y="106" width="7" height="14" rx="1.5" fill="#616161" />
                                </g>
                                <g transform={`translate(0 ${isClimbing && walkCycle % 2 === 1 ? 3 : 0})`}>
                                    <rect x="46" y="106" width="9" height="14" rx="2" fill="#424242" />
                                    <rect x="47" y="106" width="7" height="14" rx="1.5" fill="#616161" />
                                </g>
                                
                                {/* Boots */}
                                <ellipse cx="39" cy="120" rx="6" ry="4" fill="#212121" />
                            <ellipse cx="50" cy="120" rx="6" ry="4" fill="#212121" />
                            
                            {/* Hiking pole */}
                            <line x1="65" y1="82" x2="70" y2="115" stroke="#795548" strokeWidth="3" />
                            <circle cx="70" cy="116" r="4" fill="#5d4037" />
                            <circle cx="65" cy="84" r="3" fill="#8d6e63" />
                            <line x1="67" y1="95" x2="69" y2="95" stroke="#6d4c41" strokeWidth="2" />
                        </svg>
                    </div>
                    
                    {/* Shadow */}
                    <div 
                        className="absolute -bottom-4 left-1/2 -translate-x-1/2 rounded-full blur-lg"
                        style={{ 
                            width: '60px',
                            height: '14px',
                            background: 'radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, transparent 70%)',
                            transform: `translateX(-50%) scale(${isClimbing ? 1.15 : 1})`,
                            transition: 'transform 40ms linear'
                        }}
                    />
                </div>

                {/* Snowfall effect (high altitude) */}
                {userData.altitude > 2500 && (
                    <div className="absolute inset-0 pointer-events-none z-20">
                        {[...Array(25)].map((_, i) => (
                            <div
                                key={i}
                                className="absolute"
                                style={{
                                    left: `${Math.random() * 100}%`,
                                    top: `-5%`,
                                    animation: `snowfall ${5 + Math.random() * 5}s linear infinite`,
                                    animationDelay: `${Math.random() * 10}s`,
                                    opacity: 0.8
                                }}
                            >
                                <svg width="10" height="10" viewBox="0 0 10 10">
                                    <circle cx="5" cy="5" r="4" fill="white" opacity="0.9" />
                                    <line x1="5" y1="1" x2="5" y2="9" stroke="white" strokeWidth="0.8" />
                                    <line x1="1" y1="5" x2="9" y2="5" stroke="white" strokeWidth="0.8" />
                                    <line x1="2" y1="2" x2="8" y2="8" stroke="white" strokeWidth="0.6" />
                                    <line x1="8" y1="2" x2="2" y2="8" stroke="white" strokeWidth="0.6" />
                                </svg>
                            </div>
                        ))}
                    </div>
                )}

                {/* Fog layers at bottom */}
                <div className="absolute inset-0 pointer-events-none">
                    <div 
                        className="absolute bottom-0 left-0 right-0"
                        style={{
                            height: '40%',
                            background: `linear-gradient(to top, ${zone.skyBot}80 0%, ${zone.skyBot}30 40%, transparent 100%)`
                        }}
                    />
                </div>

                {/* HUD */}
                <div className="absolute top-4 left-4 right-4 z-40 flex justify-between items-start gap-3">
                    <div className="bg-gradient-to-br from-slate-900/90 to-slate-800/90 backdrop-blur-md rounded-2xl px-5 py-3 shadow-2xl border border-white/10">
                        <div className="flex items-center gap-2 mb-1">
                            <Mountain className="w-4 h-4 text-emerald-400" />
                            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">{zone.name}</span>
                        </div>
                        <div className="text-3xl font-bold text-white">
                            {userData.altitude.toLocaleString()}
                            <span className="text-base text-slate-400 ml-1">m</span>
                        </div>
                        <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                            <div 
                                className="h-full bg-gradient-to-r from-emerald-400 via-green-500 to-emerald-600 transition-all duration-500 shadow-lg shadow-emerald-500/50"
                                style={{ width: `${progressPercent}%` }}
                            />
                        </div>
                        <div className="text-xs text-slate-400 mt-1">
                            {Math.round(progressPercent)}% to summit
                        </div>
                    </div>

                    <div className="bg-gradient-to-br from-slate-900/90 to-slate-800/90 backdrop-blur-md rounded-2xl px-5 py-3 shadow-2xl border border-white/10">
                        <div className="flex items-center gap-2 mb-1">
                            <div className="w-3 h-3 rounded-full animate-pulse" style={{ backgroundColor: getOxygenColor(userData.oxygen) }} />
                            <span className="text-xs text-slate-300 font-semibold uppercase tracking-wider">Oxygen</span>
                        </div>
                        <div 
                            className="text-3xl font-bold transition-colors duration-500"
                            style={{ color: getOxygenColor(userData.oxygen) }}
                        >
                            {userData.oxygen}
                            <span className="text-base text-slate-400">%</span>
                        </div>
                        <div className="mt-2 w-32 h-2 bg-slate-700/50 rounded-full overflow-hidden">
                            <div 
                                className="h-full transition-all duration-500"
                                style={{ 
                                    width: `${userData.oxygen}%`,
                                    backgroundColor: getOxygenColor(userData.oxygen),
                                    boxShadow: `0 0 10px ${getOxygenColor(userData.oxygen)}80`
                                }}
                            />
                        </div>
                        <div className="text-xs text-slate-400 mt-1">
                            {userData.oxygen >= 70 ? 'Strong' : userData.oxygen >= 50 ? 'Moderate' : userData.oxygen >= 30 ? 'Weak' : 'Critical'}
                        </div>
                    </div>
                </div>

                {/* Habit Buttons */}
                <div className="absolute bottom-6 left-4 right-4 z-40">
                    <div className="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-4 border border-slate-200">
                        <div className="grid grid-cols-4 gap-3">
                            {habits.map((habit, index) => {
                                const Icon = habit.icon;
                                const colors = [
                                    { from: 'from-blue-500', to: 'to-cyan-500', glow: 'shadow-blue-500/50' },
                                    { from: 'from-indigo-500', to: 'to-purple-500', glow: 'shadow-indigo-500/50' },
                                    { from: 'from-green-500', to: 'to-emerald-500', glow: 'shadow-green-500/50' },
                                    { from: 'from-purple-500', to: 'to-pink-500', glow: 'shadow-purple-500/50' }
                                ];
                                const color = colors[index];
                                
                                return (
                                    <button
                                        key={habit.id}
                                        onClick={() => completeHabit(habit.id)}
                                        disabled={habit.completed}
                                        className={`
                                            relative aspect-square rounded-2xl transition-all duration-300 flex flex-col items-center justify-center gap-2
                                            ${habit.completed 
                                                ? 'bg-gradient-to-br from-emerald-50 to-green-100 border-2 border-emerald-400 scale-95' 
                                                : `bg-gradient-to-br ${color.from} ${color.to} hover:scale-110 active:scale-95 shadow-xl ${color.glow}`
                                            }
                                        `}
                                    >
                                        {!habit.completed && (
                                            <div className="absolute inset-0 bg-gradient-to-br from-white/20 to-transparent rounded-2xl" />
                                        )}
                                        
                                        <Icon 
                                            className={`w-7 h-7 ${habit.completed ? 'text-emerald-600' : 'text-white drop-shadow-lg'}`}
                                            strokeWidth={2.5}
                                        />
                                        <span className={`text-xs font-bold ${habit.completed ? 'text-emerald-700' : 'text-white drop-shadow'}`}>
                                            {habit.completed ? '✓ Done' : `+${habit.oxygen}%`}
                                        </span>
                                    </button>
                                );
                            })}
                        </div>
                        
                        <div className="text-center mt-4 pt-3 border-t border-slate-200">
                            <div className="flex items-center justify-center gap-2">
                                <div className="flex gap-1">
                                    {habits.map((h, i) => (
                                        <div 
                                            key={i} 
                                            className={`w-2 h-2 rounded-full transition-all duration-300 ${
                                                h.completed ? 'bg-emerald-500 scale-125' : 'bg-slate-300'
                                            }`}
                                        />
                                    ))}
                                </div>
                                <span className="text-sm text-slate-600 font-medium ml-2">
                                    {habits.filter(h => h.completed).length} / 4 completed
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Milestone popup */}
                {userData.altitude >= 2000 && userData.altitude < 2270 && (
                    <div className="absolute top-1/3 left-1/2 -translate-x-1/2 z-40 animate-bounce">
                        <div className="bg-gradient-to-r from-amber-400 to-orange-500 text-white px-6 py-3 rounded-full font-bold text-sm shadow-2xl border-2 border-white/50">
                            🎯 2,000m Milestone!
                        </div>
                    </div>
                )}

                <style>{`
                    @keyframes float {
                        0%, 100% { transform: translateY(0px) translateX(0px); }
                        25% { transform: translateY(-20px) translateX(8px); }
                        50% { transform: translateY(-12px) translateX(-8px); }
                        75% { transform: translateY(-25px) translateX(5px); }
                    }
                    @keyframes snowfall {
                        0% { transform: translateY(0px) translateX(0px) rotate(0deg); }
                        100% { transform: translateY(110vh) translateX(40px) rotate(360deg); }
                    }
                `}</style>
            </div>
        );
    };

    ReactDOM.render(<MountainView />, document.getElementById('root'));
</script>
</body>
</html>
